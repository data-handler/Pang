<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Eyes on Stalks</title>
    <script src="https://sdk.crazygames.com/crazygames-sdk-v2.js"></script>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #111;
            color: #ddd;
            font-family: system-ui, sans-serif;
            touch-action: manipulation;
        }

        body {
            overflow: hidden;
        }

        #gameShell {
            position: fixed;
            inset: 0;
            background: #030712;
            display: grid;
            place-items: center;
        }

        canvas {
            position: absolute;
            background: #0b0f1a;
            box-shadow:
                0 0 0 6px #1d4ed8,
                0 0 30px rgba(59, 130, 246, 0.35);
            touch-action: none;
            will-change: transform;
        }

        .hint {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 30px;
            text-align: center;
            font-size: 14px;
            opacity: .8;
        }

        .touch-controls {
            position: fixed;
            left: 0;
            right: 0;
            bottom: max(14px, env(safe-area-inset-bottom));
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 16px;
            pointer-events: none;
        }

        .touch-cluster {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }

        .touch-btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 2px solid rgba(191, 219, 254, 0.85);
            background: rgba(30, 41, 59, 0.5);
            color: #fff;
            font-weight: 700;
            font-size: 24px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .touch-btn.fire {
            width: 84px;
            height: 84px;
            font-size: 20px;
        }

        .touch-btn.ad {
            width: 68px;
            height: 68px;
            font-size: 15px;
            border-color: rgba(253, 230, 138, 0.9);
            background: rgba(120, 53, 15, 0.55);
        }

        @media (pointer: coarse) {
            .touch-controls {
                display: flex;
            }

            .hint {
                bottom: calc(112px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>

<body>
    <div id="gameShell">
        <canvas id="c" width="900" height="520"></canvas>
    </div>
    <div class="hint">R/C/G/T Accessibility</div>
    <div class="touch-controls">
        <div class="touch-cluster">
            <button class="touch-btn" id="touchLeft" aria-label="Move left">◀</button>
            <button class="touch-btn" id="touchRight" aria-label="Move right">▶</button>
        </div>
        <div class="touch-cluster">
            <button class="touch-btn ad" id="touchAd" aria-label="Watch ad to continue" style="display:none">AD</button>
        </div>
        <div class="touch-cluster">
            <button class="touch-btn fire" id="touchFire" aria-label="Fire">FIRE</button>
        </div>
    </div>

        (() => {
            const canvas = document.getElementById("c");
            const ctx = canvas.getContext("2d");

            const touchAdButton = document.getElementById("touchAd");
            const touchButtons = {
                left: document.getElementById("touchLeft"),
                right: document.getElementById("touchRight"),
                fire: document.getElementById("touchFire")

            const isTouchDevice = window.matchMedia("(pointer: coarse)").matches || (navigator.maxTouchPoints || 0) > 0;
            const startupActionText = isTouchDevice ? "TAP FIRE TO START" : "PRESS SPACE TO START";
            const restartActionText = isTouchDevice ? "Tap FIRE to Restart" : "Press Space to Restart";
            const continueActionText = isTouchDevice ? "Tap AD to Continue" : "Press V to Continue (Watch Ad)";

            // SFX use the Web Audio API rather than HTMLAudioElement: on iOS
            // Safari, repeatedly calling HTMLAudioElement.play() (e.g. for
            // rapid-fire shots/pops) does real synchronous main-thread work
            // per call and was causing visible frame stalls. Buffers are
            // decoded once up front; each trigger is a cheap
            // AudioBufferSourceNode.start() with no media-session overhead,
            // and overlapping triggers don't need pooling.
            const SFX_SOURCES = {
                shoot: "sounds/shoot.wav",
                pop: "sounds/pop.wav",
                death: "sounds/death.wav",
                level: "sounds/level.wav",
                powerup: "sounds/powerup.wav",
                bomb: "sounds/bomb.wav",
                uhoh: "sounds/uhoh.mp3",
                gallop: "sounds/gallop.mp3"
            };

            let audioCtx = null;
            const sfxBuffers = {};

            function getAudioContext() {
                if (!audioCtx) {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    audioCtx = Ctx ? new Ctx() : null;
                }
                return audioCtx;
            }

            function unlockAudio() {
                const ctx = getAudioContext();
                if (ctx && ctx.state === "suspended") {
                    ctx.resume().catch(() => { });
                }
            }

            // iOS requires AudioContext creation/resume to happen inside a
            // genuine user gesture, so hook the first one anywhere on the page.
            const _unlockAudioOnce = () => unlockAudio();
            addEventListener("keydown", _unlockAudioOnce, { once: true, capture: true });
            addEventListener("pointerdown", _unlockAudioOnce, { once: true, capture: true });
            addEventListener("touchstart", _unlockAudioOnce, { once: true, capture: true });

            // CrazyGames platform integration. The SDK throws on any domain
            // that isn't localhost or a crazygames.com domain ("disabled"
            // mode) - self-host/itch.io/etc must not call it at all, so every
            // call goes through this gate. crazySdkReady starts false and the
            // check below flips it once we know we're somewhere safe; calls
            // made before that (unlikely - it resolves near-instantly) just
            // no-op rather than queueing, since none of these events are
            // meaningful to replay after the fact.
            let crazySdkReady = false;
            (async function initCrazyGamesSdk() {
                try {
                    const env = await window.CrazyGames?.SDK?.getEnvironment();
                    crazySdkReady = env === "local" || env === "crazygames";
                } catch {
                    crazySdkReady = false;
                }

                // The platform's own mute (site-wide toggle, or during ad
                // playback) must be respected regardless of the player's
                // local M/S toggles - read the starting value, then stay in
                // sync with any change for the rest of the session.
                if (crazySdkReady) {
                    try {
                        applyPlatformMute(!!window.CrazyGames.SDK.game.settings?.muteAudio);
                        window.CrazyGames.SDK.game.addSettingsChangeListener((newSettings) => {
                            applyPlatformMute(!!newSettings.muteAudio);
                        });
                    } catch { }
                }
            })();

            function notifyLoadingStart() {
                if (crazySdkReady) window.CrazyGames.SDK.game.sdkGameLoadingStart();
            }
            function notifyLoadingStop() {
                if (crazySdkReady) window.CrazyGames.SDK.game.sdkGameLoadingStop();
            }
            function notifyGameplayStart() {
                if (crazySdkReady) window.CrazyGames.SDK.game.gameplayStart();
            }
            function notifyGameplayStop() {
                if (crazySdkReady) window.CrazyGames.SDK.game.gameplayStop();
            }
            notifyLoadingStart();

            // Rewarded-ad "continue" on game over - opt-in, and only offered
            // when the SDK is actually available (crazySdkReady false on
            // self-host/itch.io/etc, where the normal restart is the only
            // option). Continuing reuses the exact same fresh-level reload as
            // a normal mid-run respawn, just with the run's score/level kept
            // instead of a full restart from level 1.
            let adInProgress = false;

            function requestContinueAd() {
                if (!crazySdkReady || adInProgress || gameState !== "gameover") return;
                if (!window.CrazyGames?.SDK?.ad) return;
                adInProgress = true;
                window.CrazyGames.SDK.ad.requestAd("rewarded", {
                    adStarted: () => {
                        applyPlatformMute(undefined, true);
                    },
                    adFinished: () => {
                        adInProgress = false;
                        applyPlatformMute(undefined, false);
                        continueRun();
                    },
                    adError: () => {
                        adInProgress = false;
                        applyPlatformMute(undefined, false);
                    }
                });
            }

            function continueRun() {
                lives = 1;
                resetLevel();
                gameState = "playing";
                notifyGameplayStart();

                const ctx = getAudioContext();
                if (!ctx) return;
                await Promise.all(Object.entries(SFX_SOURCES).map(async ([key, src]) => {
                    try {
                        const response = await fetch(src);
                        const arrayBuffer = await response.arrayBuffer();
                        sfxBuffers[key] = await ctx.decodeAudioData(arrayBuffer);
                    } catch (err) {
                        // sfxBuffers[key] stays unset; playSound() no-ops for it
                        console.error(`Failed to load SFX "${key}" (${src}):`, err);

                button.addEventListener("pointerdown", event => {
                    set(true, event);

                    }

                button.addEventListener("pointerup", release);
                button.addEventListener("pointercancel", release);
                button.addEventListener("lostpointercapture", event => set(false, event));

            function resizeCanvasToViewport() {
                const viewportW = Math.max(320, window.innerWidth);

                const scale = Math.min(viewportW / W, viewportH / H);
                const displayW = Math.max(1, Math.floor(W * scale));
                const displayH = Math.max(1, Math.floor(H * scale));
                const offsetX = Math.floor((viewportW - displayW) / 2);
                const offsetY = Math.floor((viewportH - displayH) / 2);
                const dpr = Math.max(1, Math.min(MAX_CANVAS_DPR, window.devicePixelRatio || 1));

                canvas.style.width = `${displayW}px`;
                canvas.style.height = `${displayH}px`;
                canvas.style.left = `${offsetX}px`;
                canvas.style.top = `${offsetY}px`;

                canvas.width = Math.max(1, Math.floor(displayW * dpr));
                canvas.height = Math.max(1, Math.floor(displayH * dpr));

                ctx.setTransform((displayW / W) * dpr, 0, 0, (displayH / H) * dpr, 0, 0);

                if (volume === 1) {

                    gain.gain.value = volume;
                    source.connect(gain);

            function computeLevelTimeBudget(level, index) {
                const totalHits = level.balls.reduce((sum, ball) => sum + hitsToClearBall(ball.size), 0);
                const platformCount = (level.platforms || []).length;
                const base = TIME_BUDGET_BASE_SECONDS + totalHits * TIME_PER_HIT_SECONDS + platformCount * TIME_PER_PLATFORM_SECONDS;

                const graceT = Math.max(0, Math.min(1, index / EARLY_GRACE_LEVELS));
                const grace = 1 + EARLY_GRACE_BONUS * (1 - graceT);

                const seconds = Math.max(MIN_LEVEL_SECONDS, Math.min(MAX_LEVEL_SECONDS, base * grace));
                return seconds * TIME_DRAIN_PER_SECOND;
            }

            const MUSIC_TRACK_FOR_BG = {
                meadow: "meadow",
                sunset: "sunset",
                night: "night",
                cliffs: "meadow",
                cave: "night",
                volcanic: "sunset"
            };

            function playLevelMusic() {
                const bg = LEVELS[levelIndex].bg;
                const track = musicTracks[MUSIC_TRACK_FOR_BG[bg] ?? "meadow"];

                if (currentMusicTrack === track) return;

                if (currentMusicTrack) {
                    currentMusicTrack.pause();
                    currentMusicTrack.currentTime = 0;
                }

                currentMusicTrack = track;
                if (musicMuted || platformMuted) return;

                // Defer play() to a separate task. loadLevel() (and this call)
                // can run synchronously inside tick()'s fixed-step simulation
                // loop on level transitions; starting playback here forces the
                // browser to fetch/buffer/decode a not-yet-loaded track (music
                // files are 600KB-1.7MB) inside that frame, stalling it before
                // draw() and the next requestAnimationFrame run. This was the
                // source of the judder observed on iOS Safari.
                setTimeout(() => currentMusicTrack.play().catch(() => { }), 0);

                    baseX: platform.x,
                    baseY: platform.y,

                    active: true,
                    cracked: false,
                    // hp counts down as it's hit; reinforced stays fixed so the
                    // stone look doesn't revert once hp drops to 1 after a crack.
                    reinforced: (platform.hp ?? 1) > 1
                }));

                const level = LEVELS[index];

                balls = level.balls.map(ball => createBall(ball.size, ball.x, ball.y, ball.dir));

                hazardStrips = (level.modifiers?.hazards || []).map(strip => ({ ...strip }));

                challengeType = level.challenge ?? null;
                surviveTimer = challengeType === "survive" ? 25 : 0;
                stageCardTimer = 1.7;
                levelTimeBudget = computeLevelTimeBudget(level, index);

            function spawnParticles(x, y, { count, radius, life, speed, color, gravity = 0 }) {

                        y,

                        prevY: y,

                        vy: -Math.random() * speed * 0.6,

            }

            function pickWeighted(entries) {
                const total = entries.reduce((sum, e) => sum + e.weight, 0);
                let roll = Math.random() * total;
                for (const entry of entries) {
                    if (roll < entry.weight) return entry.type;
                    roll -= entry.weight;
                }
                return entries[entries.length - 1].type;
            }

            const POWERUP_POOL = [
                { type: "freeze", weight: 18 },
                { type: "bomb", weight: 10 },
                { type: "twin", weight: 20 },
                { type: "gun", weight: 20 },
                { type: "pierceHarpoon", weight: 12 },
                { type: "tripleHarpoon", weight: 8 },
                { type: "rapidGun", weight: 7 },
                { type: "stickyHarpoon", weight: 5 },
                { type: "horse", weight: 10 }
            ];

            function maybeSpawnPowerUp(x, y, chance = POWERUP.spawnChance) {
                if (challengeType === "no_powerups") return;
                if (Math.random() > chance) return;

                const type = pickWeighted(POWERUP_POOL);

                powerUps.push({
                    x,
                    y,
                    prevY: y,
                    vy: POWERUP.fallSpeed,
                    type,
                    grounded: false,
                    life: POWERUP.life,
                    anim: Math.random() * Math.PI * 2
                });
            }

            function trySpawnBonusEntity(dt) {
                if (bonusEntity || levelClear || challengeType === "no_powerups") return;

                bonusEntitySpawnTimer -= dt;
                if (bonusEntitySpawnTimer > 0) return;
                bonusEntitySpawnTimer = BONUS_ENTITY_CHECK_INTERVAL;

                if (Math.random() > BONUS_ENTITY_SPAWN_CHANCE) return;

                const fromLeft = Math.random() < 0.5;
                const startX = fromLeft ? -BONUS_ENTITY_RADIUS : W + BONUS_ENTITY_RADIUS;
                const startY = 60 + Math.random() * 70;

                bonusEntity = {
                    x: startX,
                    y: startY,
                    prevX: startX,
                    prevY: startY,
                    baseY: startY,
                    dir: fromLeft ? 1 : -1,
                    t: 0,
                    dashTimer: 1 + Math.random() * 1.5,
                    sparkleTimer: 0,
                    life: BONUS_ENTITY_LIFETIME
                };
            }

            function updateBonusEntity(dt) {
                if (!bonusEntity) return;
                const e = bonusEntity;
                e.prevX = e.x;
                e.prevY = e.y;
                e.t += dt;
                e.life -= dt;

                // Sine-wave drift plus the occasional short speed burst, so it
                // doesn't just fly a straight UFO line across the screen.
                let speed = BONUS_ENTITY_SPEED;
                e.dashTimer -= dt;
                if (e.dashTimer <= 0) {
                    speed *= BONUS_ENTITY_DASH_SPEED_MULT;
                    if (e.dashTimer < -0.3) {
                        e.dashTimer = 1 + Math.random() * 1.8;
                    }
                }

                e.x += e.dir * speed * dt;
                e.y = e.baseY + Math.sin(e.t * 3) * 26;

                e.sparkleTimer -= dt;
                if (e.sparkleTimer <= 0) {
                    e.sparkleTimer = 0.07;
                    spawnParticles(e.x, e.y, { count: 1, radius: 1.8, life: 0.35, speed: 25, gravity: 0, color: "#fde68a" });
                }

                const offscreen = e.dir > 0 ? e.x > W + BONUS_ENTITY_RADIUS : e.x < -BONUS_ENTITY_RADIUS;
                if (offscreen || e.life <= 0) {
                    bonusEntity = null;
                }
            }

            function popBonusEntity() {
                const e = bonusEntity;
                score += BONUS_ENTITY_SCORE;
                playSound("powerup");
                spawnScore(e.x, e.y, BONUS_ENTITY_SCORE);
                spawnParticles(e.x, e.y, { count: 20, radius: 3, life: 0.5, speed: 260, gravity: 200, color: "#fde68a" });
                comboCallout = "BONUS EYE!";
                comboCalloutTimer = 1.4;
                maybeSpawnPowerUp(e.x, e.y, 1);
                bonusEntity = null;
            }

            function splitBall(ball) {
                const nextSize = ball.size + 1;
                if (nextSize >= BALL_SIZES.length) return;

                const kick = -BALL_BOUNCE_VY[nextSize] * 0.25;
                balls.push(createBall(nextSize, ball.x - 8, ball.y - 4, -1, kick));
                balls.push(createBall(nextSize, ball.x + 8, ball.y - 4, 1, kick));
            }

            function destroyBall(ballIndex, skipHitStop = false) {
                const ball = balls[ballIndex];

                comboCount++;
                comboTimer = COMBO_RESET_TIME;
                if (comboCount >= 2) {
                    comboCallout = `${comboCount}x COMBO`;
                    comboCalloutTimer = 0.7;
                }

                triggerImpactFeedback({
                    flash: 0.12,
                    shake: 0,
                    strength: 0,
                    hitStop: skipHitStop ? 0 : 0.02
                });

                playSound("pop");
                spawnSparkBurst(ball.x, ball.y, 8, 2, 0.22, 340);

                const points = 100 * comboCount;
                score += points;

                spawnPop(ball.x, ball.y, ball.r);
                spawnScore(ball.x, ball.y, points);
                maybeSpawnPowerUp(ball.x, ball.y);

                balls.splice(ballIndex, 1);
                splitBall(ball);
            }

            function breakPlatform(platformIndex) {
                const platform = platforms[platformIndex];
                const cx = platform.x + platform.w / 2;
                const cy = platform.y + platform.h / 2;
                platforms.splice(platformIndex, 1);
                score += 50;
                spawnScore(cx, platform.y, 50);
                spawnParticles(cx, cy, {
                    count: 6,
                    radius: 2.5,
                    life: 0.4,
                    speed: 160,
                    gravity: 320,
                    color: THEME.env.platformBreakEdge
                });
                maybeSpawnPowerUp(cx, platform.y, POWERUP.platformSpawnChance);
            }

            // Reinforced platforms (hp > 1 in level data) take an extra hit
            // before breaking - first hit just cracks it (visual only), the
            // last hit breaks it exactly like a normal breakable platform.
            function hitBreakablePlatform(platformIndex) {
                const platform = platforms[platformIndex];
                const hp = platform.hp ?? 1;

                if (hp > 1) {
                    platform.hp = hp - 1;
                    platform.cracked = true;
                    const cx = platform.x + platform.w / 2;
                    const cy = platform.y + platform.h / 2;
                    playSound("pop");
                    spawnParticles(cx, cy, {
                        count: 4,
                        radius: 2,
                        life: 0.3,
                        speed: 100,
                        gravity: 260,
                        color: THEME.env.platformReinforcedEdge
                    });
                    return;
                }

                breakPlatform(platformIndex);
            }

            function killPlayer() {
                if (playerDead) return;

                playSound("death");
                triggerImpactFeedback({ flash: 0.2, shake: 0.24, strength: 14, hitStop: 0.05 });
                playerDead = true;
                deathTimer = DEATH_TIME;
                resetWeaponState();
                lives--;
            }

            function startLevelClear() {
                levelClear = true;
                levelClearTimer = LEVEL_CLEAR_TIME;

                playSound("level");

                const timeBonus = Math.ceil(timeLeft) * 10;
                score += timeBonus;
                spawnScore(W / 2, H / 2 + 40, `BONUS ${timeBonus}`);
            }

            const GUN_COOLDOWN_MULT = { gun: 1, rapidGun: 0.45 };

            function fireWeapon() {
                if (weaponType === "gun" || weaponType === "rapidGun") {
                    if (bulletCooldown > 0) return;

                    playSound("shoot");

                    bullets.push({
                        x: player.x - PLAYER.shootOffsetX,
                        y: player.y + PLAYER.shootOffsetY,
                        prevY: player.y + PLAYER.shootOffsetY,
                        vy: BULLET.speedY
                    });
                    bullets.push({
                        x: player.x + PLAYER.shootOffsetX,
                        y: player.y + PLAYER.shootOffsetY,
                        prevY: player.y + PLAYER.shootOffsetY,
                        vy: BULLET.speedY
                    });

                    bulletCooldown = BULLET.cooldown * bulletCooldownFactor * GUN_COOLDOWN_MULT[weaponType];
                    return;
                }

                if (harpoons.length > 0) return;

                playSound("shoot");

                if (weaponType === "twinHarpoon") {
                    harpoons.push(createHarpoon(clamp(player.x - PLAYER.twinHarpoonOffsetX, 6, W - 6)));
                    harpoons.push(createHarpoon(clamp(player.x + PLAYER.twinHarpoonOffsetX, 6, W - 6)));
                    return;
                }

                if (weaponType === "tripleHarpoon") {
                    harpoons.push(createHarpoon(clamp(player.x - PLAYER.twinHarpoonOffsetX, 6, W - 6)));
                    harpoons.push(createHarpoon(player.x));
                    harpoons.push(createHarpoon(clamp(player.x + PLAYER.twinHarpoonOffsetX, 6, W - 6)));
                    return;
                }

                if (weaponType === "pierceHarpoon") {
                    harpoons.push(createHarpoon(player.x, { pierce: true }));
                    return;
                }

                if (weaponType === "stickyHarpoon") {
                    harpoons.push(createHarpoon(player.x, { sticky: true }));
                    return;
                }

                harpoons.push(createHarpoon(player.x));
            }

            function createHarpoon(x, opts = {}) {
                return {
                    x,
                    yTop: FLOOR_Y,
                    prevYTop: FLOOR_Y,
                    yBottom: FLOOR_Y,
                    maxTop: 0,
                    speed: harpoonSpeed,
                    pierce: opts.pierce || false,
                    sticky: opts.sticky || false,
                    stuck: false,
                    stickTimer: 0
                };
            }

            function triggerBomb() {
                if (balls.length === 0) return;

                const newBalls = [];

                for (const ball of balls) {
                    playSound("pop");

                    spawnPop(ball.x, ball.y, ball.r);
                    spawnSparkBurst(ball.x, ball.y, 12, 3, 0.25, 420);

                    // Smallest balls explode completely
                    if (ball.size === SMALLEST_BALL_SIZE) {
                        const points = 100;
                        score += points;
                        spawnScore(ball.x, ball.y, points);
                        continue;
                    }

                    // Larger balls split down to smallest size
                    const splitsNeeded = SMALLEST_BALL_SIZE - ball.size;
                    const count = Math.pow(2, splitsNeeded);

                    for (let i = 0; i < count; i++) {
                        const dir = i % 2 === 0 ? -1 : 1;
                        const spread = (i - (count - 1) / 2) * 14;

                        newBalls.push(
                            createBall(
                                SMALLEST_BALL_SIZE,
                                ball.x + spread,
                                ball.y - 6,
                                dir,
                                -BALL_BOUNCE_VY[SMALLEST_BALL_SIZE] * (0.2 + Math.random() * 0.15)
                            )
                        );
                    }
                }

                balls = newBalls;
            }

            function pointInRect(x, y, rectX, rectY, rectW, rectH) {
                return x >= rectX && x <= rectX + rectW && y >= rectY && y <= rectY + rectH;
            }

            function circleHitsVerticalLine(ball, lineX, topY) {
                return Math.abs(ball.x - lineX) < ball.r && (ball.y + ball.r) > topY;
            }

            function circleIntersectsPlayer(ball) {
                const closestX = Math.max(player.x + PLAYER.collisionLeft, Math.min(ball.x, player.x + PLAYER.collisionRight));
                const closestY = Math.max(player.y + PLAYER.collisionTop, Math.min(ball.y, player.y + PLAYER.collisionBottom));
                const dx = ball.x - closestX;
                const dy = ball.y - closestY;
                const hitR = ball.r * PLAYER_HIT_FORGIVENESS;
                return (dx * dx + dy * dy) < (hitR * hitR);
            }

            function getWeaponLabel() {
                if (weaponType === "gun") return "Blaster";
                if (weaponType === "rapidGun") return "Rapid Blaster";
                if (weaponType === "twinHarpoon") return "Twin Lance";
                if (weaponType === "tripleHarpoon") return "Triple Lance";
                if (weaponType === "pierceHarpoon") return "Piercing Lance";
                if (weaponType === "stickyHarpoon") return "Sticky Lance";
                return "Lance";
            }

            const POWERUP_LABELS = {
                twin: "TWIN",
                gun: "BLASTER",
                pierceHarpoon: "PIERCE",
                tripleHarpoon: "TRIPLE",
                rapidGun: "RAPID",
                stickyHarpoon: "STICKY",
                freeze: "FREEZE",
                bomb: "FLASK",
                horse: "HORSE"
            };

            // --- update ---

            function tick(now) {
                const frameDt = Math.min(0.1, (now - last) / 1000);
                last = now;
                accumulator += frameDt;

                let steps = 0;
                while (accumulator >= FIXED_DT && steps < MAX_STEPS_PER_FRAME) {
                    savePrevPositions();
                    if (hitStopTimer > 0) {
                        updateTimers(FIXED_DT);
                        hitStopTimer = Math.max(0, hitStopTimer - FIXED_DT);
                    } else {
                        simulateStep(FIXED_DT);
                    }
                    accumulator -= FIXED_DT;
                    steps++;
                }

                // Allow up to 2 steps of leftover time so a single late frame
                // doesn't discard simulation time and cause a visible hitch.
                if (accumulator >= FIXED_DT) {
                    accumulator = Math.min(accumulator, 2 * FIXED_DT);
                }

                renderAlpha = accumulator / FIXED_DT;
                draw();
                requestAnimationFrame(tick);
            }

            function savePrevPositions() {
                player.prevX = player.x;
                for (const ball of balls) {
                    ball.prevX = ball.x;
                    ball.prevY = ball.y;
                }
                for (const harpoon of harpoons) {
                    harpoon.prevYTop = harpoon.yTop;
                }
                for (const bullet of bullets) {
                    bullet.prevY = bullet.y;
                }
                for (const pop of pops) {
                    pop.prevX = pop.x;
                    pop.prevY = pop.y;
                }
                for (const popup of scorePopups) {
                    popup.prevY = popup.y;
                }
                for (const powerUp of powerUps) {
                    powerUp.prevY = powerUp.y;
                }
            }

            function simulateStep(dt) {
                updateTimers(dt);
                simulationTime += dt;

                if (gameState === "startup") {
                    updateStartupState();
                    return;
                }

                if (gameState === "gameover") {
                    updateGameOverState();
                    return;
                }

                if (paused && gameState === "playing") return;

                if (playerDead) {
                    updateDeathState(dt);
                    return;
                }

                updateRoundState(dt);
                updatePlatforms(dt);
                updatePlayer(dt);
                updateBalls(dt);
                updatePlayerBallCollision();
                updateHazards(dt);
                updatePowerUps(dt);
                trySpawnBonusEntity(dt);
                updateBonusEntity(dt);
                updateBullets(dt);
                updateHarpoons(dt);
                updateEffects(dt);
            }

            function updateTimers(dt) {
                flashTimer = Math.max(0, flashTimer - dt);
                shakeTimer = Math.max(0, shakeTimer - dt);
                stageCardTimer = Math.max(0, stageCardTimer - dt);
                comboCalloutTimer = Math.max(0, comboCalloutTimer - dt);
                weaponCalloutTimer = Math.max(0, weaponCalloutTimer - dt);
                comboTimer = Math.max(0, comboTimer - dt);
                freezeTimer = Math.max(0, freezeTimer - dt);
                horseTimer = Math.max(0, horseTimer - dt);
                invulnTimer = Math.max(0, invulnTimer - dt);
                bulletCooldown = Math.max(0, bulletCooldown - dt);
                startupBlinkTimer += dt;
                if (shakeTimer === 0) shakeStrength = 0;

                if (comboTimer === 0) comboCount = 0;
            }

            function updateGameOverState() {
                if (consumeFirePress()) {
                    startGame();
                }
            }

            function updateDeathState(dt) {
                deathTimer -= dt;
                if (deathTimer <= 0) {
                    if (lives > 0) {
                        resetLevel();
                    } else {
                        if (currentMusicTrack) {
                            currentMusicTrack.pause();
                            currentMusicTrack.currentTime = 0;
                            currentMusicTrack = null;
                        }

                        gameState = "gameover";
                        notifyGameplayStop();
                    }
                }
            }

            function updateRoundState(dt) {
                if (!levelClear && !playerDead) {
                    const assistFactor = timerAssist ? 0.72 : 1;
                    const challengeFactor = challengeType === "score_attack" ? 1.35 : 1;
                    timeLeft -= dt * TIME_DRAIN_PER_SECOND * assistFactor * challengeFactor;
                    if (timeLeft <= 0) {
                        timeLeft = 0;
                        playerDead = true;
                        deathTimer = DEATH_TIME;
                        resetWeaponState();
                        lives--;
                    }
                }

                if (balls.length === 0 && !levelClear) {
                    startLevelClear();
                }

                if (challengeType === "survive" && !levelClear) {
                    surviveTimer = Math.max(0, surviveTimer - dt);
                    if (surviveTimer <= 0) {
                        startLevelClear();
                    }
                }

                if (levelClear) {
                    levelClearTimer -= dt;
                    if (levelClearTimer <= 0) {
                        levelIndex = (levelIndex + 1) % LEVELS.length;
                        const awardBonusLife = CHAPTER_BONUS_LIFE_INDICES.has(levelIndex);
                        loadLevel(levelIndex);
                        // loadLevel() -> resetLevelState() clears comboCallout, so the
                        // banner has to be set after the level load, not before.
                        if (awardBonusLife) {
                            lives++;
                            playSound("powerup");
                            comboCallout = "EXTRA LIFE!";
                            comboCalloutTimer = 1.6;
                        }
                    }
                }
            }

            function updatePlayer(dt) {
                let dir = 0;
                if (actionState.left) dir -= 1;
                if (actionState.right) dir += 1;

                player.moving = dir !== 0;
                if (dir !== 0) player.facing = dir;
                const effectiveSpeed = horseTimer > 0 ? player.speed * POWERUP.horseSpeedMultiplier : player.speed;
                player.vx = dir * effectiveSpeed + levelWind * 0.35;
                player.x += player.vx * dt;
                player.x = clamp(player.x, player.w / 2, W - player.w / 2);

                footstepTimer -= dt;
                if (player.moving && footstepTimer <= 0 && !playerDead) {
                    // Galloping is a quicker stride than walking, and gets an
                    // actual hoofbeat sound on top of the dust - regular
                    // footsteps stay silent (visual dust only).
                    footstepTimer = horseTimer > 0 ? 0.1 : 0.16;
                    // drawPlayer() renders the knight at 1.5x scale around
                    // (player.x, player.y), so the on-screen feet sit ~1.5x
                    // further from player.y than the local sprite coordinates
                    // (boots drawn around local y+30) - match that here so
                    // dust spawns at the feet, not the waist.
                    spawnParticles(player.x, player.y + 45, {
                        count: 3,
                        radius: 3.5,
                        life: 0.5,
                        speed: 16,
                        gravity: 0,
                        color: horseTimer > 0 ? "rgba(146,64,14,0.85)" : "rgba(212,209,204,0.85)"
                    });
                    if (horseTimer > 0) playSound("gallop", 0.5);
                }

                if (actionState.fire) {
                    fireWeapon();
                }
            }

            function updateBalls(dt) {
                for (const ball of balls) {
                    const prevX = ball.x;
                    const prevY = ball.y;

                    if (freezeTimer <= 0) {
                        if (levelWind !== 0) {
                            ball.vx += levelWind * dt;
                            ball.vx = clamp(ball.vx, -260, 260);
                        }
                        ball.vy += GRAVITY * dt;
                        ball.x += ball.vx * dt;
                        ball.y += ball.vy * dt;
                    }

                    ball.squash = Math.max(0, ball.squash - dt * 8);

                    ball.blinkTimer -= dt;
                    if (ball.blinkTimer <= -BLINK_DURATION) {
                        ball.blinkTimer = BLINK_MIN_GAP + Math.random() * BLINK_GAP_RANGE;
                    }

                    if (freezeTimer <= 0) {
                        handleBallWallBounce(ball);
                        handleBallPlatformBounce(ball, prevX, prevY);
                        handleBallFloorBounce(ball);
                    }
                }
            }

            function handleBallWallBounce(ball) {
                if (ball.x - ball.r < 0) {
                    ball.x = ball.r;
                    ball.vx *= -1;
                }

                if (ball.x + ball.r > W) {
                    ball.x = W - ball.r;
                    ball.vx *= -1;
                }
            }

            function handleBallPlatformBounce(ball, prevX, prevY) {
                for (const platform of platforms) {
                    if (platform.active === false) continue;
                    const hitHoriz = ball.x + ball.r > platform.x && ball.x - ball.r < platform.x + platform.w;
                    const hitVert = ball.y + ball.r > platform.y && ball.y - ball.r < platform.y + platform.h;

                    if (!hitHoriz || !hitVert) continue;

                    const wasAbove = prevY + ball.r <= platform.y;
                    const wasBelow = prevY - ball.r >= platform.y + platform.h;
                    const wasLeft = prevX + ball.r <= platform.x;
                    const wasRight = prevX - ball.r >= platform.x + platform.w;

                    if (wasAbove) {
                        ball.y = platform.y - ball.r;
                        ball.vy = -BALL_BOUNCE_VY[ball.size];
                        ball.squash = 1;
                    } else if (wasBelow) {
                        ball.y = platform.y + platform.h + ball.r;
                        ball.vy = Math.abs(ball.vy);
                    } else if (wasLeft) {
                        ball.x = platform.x - ball.r;
                        ball.vx = -Math.abs(ball.vx);
                    } else if (wasRight) {
                        ball.x = platform.x + platform.w + ball.r;
                        ball.vx = Math.abs(ball.vx);
                    }
                }
            }

            function handleBallFloorBounce(ball) {
                if (ball.y + ball.r > FLOOR_Y) {
                    ball.y = FLOOR_Y - ball.r;
                    ball.vy = -BALL_BOUNCE_VY[ball.size];
                    ball.squash = 1;
                }
            }

            function updatePlatforms(dt) {
                if (gameState !== "playing") return;
                const time = simulationTime;

                for (const platform of platforms) {
                    platform.x = platform.baseX;
                    platform.y = platform.baseY;
                    platform.active = true;

                    if (platform.move) {
                        const phase = (platform.movePhase || 0) + time * platform.move.speed;
                        const offset = Math.sin(phase) * platform.move.amp;
                        if (platform.move.axis === "x") platform.x = platform.baseX + offset;
                        else platform.y = platform.baseY + offset;
                    }

                    if (platform.gate) {
                        const phase = (time + (platform.gate.phase || 0)) % platform.gate.cycle;
                        platform.active = phase <= platform.gate.cycle * platform.gate.onRatio;
                    }
                }
            }

            function updateHazards() {
                if (playerDead || levelClear || invulnTimer > 0) return;

                for (const strip of hazardStrips) {
                    const active = Math.floor(simulationTime / 0.28) % 2 === 0;
                    strip.active = active;
                    if (!active) continue;

                    if (pointInRect(player.x, player.y + PLAYER.collisionBottom - 2, strip.x, strip.y, strip.w, strip.h)) {
                        killPlayer();
                        return;
                    }
                }
            }

            function updatePlayerBallCollision() {
                if (playerDead || freezeTimer > 0 || invulnTimer > 0) return;

                for (const ball of balls) {
                    if (circleIntersectsPlayer(ball)) {
                        killPlayer();
                        break;
                    }
                }
            }

            function updatePowerUps(dt) {
                for (let i = powerUps.length - 1; i >= 0; i--) {
                    const powerUp = powerUps[i];
                    powerUp.anim = (powerUp.anim || 0) + dt * 4;

                    if (!powerUp.grounded) {
                        powerUp.y += powerUp.vy * dt;

                        if (powerUp.y >= POWERUP.groundY) {
                            powerUp.y = POWERUP.groundY;
                            powerUp.vy = 0;
                            powerUp.grounded = true;
                        }
                    }

                    powerUp.life -= dt;

                    const playerLeft = player.x - PLAYER.pickupHalfWidth;
                    const playerTop = player.y;
                    const playerWidth = PLAYER.pickupHalfWidth * 2;
                    const playerHeight = FLOOR_Y - player.y;

                    if (pointInRect(powerUp.x, powerUp.y, playerLeft, playerTop, playerWidth, playerHeight)) {
                        applyPowerUp(powerUp);
                        powerUps.splice(i, 1);
                        continue;
                    }

                    if (powerUp.life <= 0) {
                        powerUps.splice(i, 1);
                    }
                }
            }

            // Equipping any new weapon clears the current shot in flight -
            // this is what lets picking up a fresh weapon cancel a sticky
            // lance's lockout early, and applies uniformly to every weapon.
            function equipWeapon(type, label, color, powerUp) {
                weaponType = type;
                harpoons = [];
                spawnScore(powerUp.x, powerUp.y, label);
                spawnParticles(powerUp.x, powerUp.y, { count: 8, radius: 2.5, life: 0.35, speed: 200, color });

                // The pickup-site score popup fades in under a second and is easy
                // to miss mid-dodge - back it up with a bigger, longer banner so
                // the player actually registers what they just picked up.
                weaponCallout = `${label.toUpperCase()} EQUIPPED`;
                weaponCalloutTimer = 1.6;
                weaponCalloutColor = color;
            }

            function applyPowerUp(powerUp) {

                if (powerUp.type === "bomb") {
                    playSound("bomb");

                    triggerBomb();
                    score += 200;
                    spawnScore(W / 2, H / 2, "FLASK!");
                    triggerImpactFeedback({ flash: 0.2, shake: 0.24, strength: 16, hitStop: 0.045 });
                    return;
                }

                // normal powerups
                playSound("powerup");

                if (powerUp.type === "twin") {
                    equipWeapon("twinHarpoon", POWERUP_LABELS.twin, THEME.weapon.lanceTip, powerUp);
                    return;
                }

                if (powerUp.type === "gun") {
                    equipWeapon("gun", POWERUP_LABELS.gun, THEME.weapon.boltGlow, powerUp);
                    return;
                }

                if (powerUp.type === "pierceHarpoon") {
                    equipWeapon("pierceHarpoon", POWERUP_LABELS.pierceHarpoon, THEME.weapon.pierceTip, powerUp);
                    return;
                }

                if (powerUp.type === "tripleHarpoon") {
                    equipWeapon("tripleHarpoon", POWERUP_LABELS.tripleHarpoon, THEME.weapon.lanceTip, powerUp);
                    return;
                }

                if (powerUp.type === "rapidGun") {
                    equipWeapon("rapidGun", POWERUP_LABELS.rapidGun, THEME.weapon.boltGlow, powerUp);
                    return;
                }

                if (powerUp.type === "stickyHarpoon") {
                    equipWeapon("stickyHarpoon", POWERUP_LABELS.stickyHarpoon, THEME.weapon.stickyColor, powerUp);
                    return;
                }

                if (powerUp.type === "freeze") {
                    freezeTimer = POWERUP.freezeDuration;
                    spawnScore(powerUp.x, powerUp.y, POWERUP_LABELS.freeze);
                    spawnParticles(powerUp.x, powerUp.y, { count: 8, radius: 2.5, life: 0.35, speed: 200, color: "#67e8f9" });

                    // A single random creature reacts to the freeze with a
                    // real vocal clip - tied to this one meaningful event
                    // rather than every bounce, so it stays a rare flourish
                    // instead of the constant bounce-chatter that used to
                    // clash with pickup labels.
                    if (balls.length > 0) {
                        playSound("uhoh", 0.55);
                    }
                    return;
                }

                if (powerUp.type === "horse") {
                    horseTimer = POWERUP.horseDuration;
                    spawnScore(powerUp.x, powerUp.y, POWERUP_LABELS.horse);
                    spawnParticles(powerUp.x, powerUp.y, { count: 10, radius: 2.5, life: 0.4, speed: 220, color: "#92400e" });
                }
            }

            function updateBullets(dt) {
                for (let bulletIndex = bullets.length - 1; bulletIndex >= 0; bulletIndex--) {
                    const bullet = bullets[bulletIndex];
                    bullet.y += bullet.vy * dt;

                    if (bullet.y < 0) {
                        bullets.splice(bulletIndex, 1);
                        continue;
                    }

                    if (handleBulletPowerUpCollision(bulletIndex, bullet)) continue;
                    if (handleBulletBonusEntityCollision(bulletIndex, bullet)) continue;
                    if (handleBulletPlatformCollision(bulletIndex, bullet)) continue;

                    handleBulletBallCollision(bulletIndex, bullet);
                }
            }

            function handleBulletBonusEntityCollision(bulletIndex, bullet) {
                if (!bonusEntity) return false;

                const dx = bonusEntity.x - bullet.x;
                const dy = bonusEntity.y - bullet.y;
                if ((dx * dx + dy * dy) < (BONUS_ENTITY_RADIUS * BONUS_ENTITY_RADIUS)) {
                    bullets.splice(bulletIndex, 1);
                    popBonusEntity();
                    return true;
                }

                return false;
            }

            function handleBulletPowerUpCollision(bulletIndex, bullet) {
                for (let powerUpIndex = powerUps.length - 1; powerUpIndex >= 0; powerUpIndex--) {
                    const powerUp = powerUps[powerUpIndex];
                    const dx = powerUp.x - bullet.x;
                    const dy = powerUp.y - bullet.y;
                    const r = 20; // matches the round pickup visuals closely enough

                    if ((dx * dx + dy * dy) < (r * r)) {
                        applyPowerUp(powerUp);
                        powerUps.splice(powerUpIndex, 1);
                        bullets.splice(bulletIndex, 1);
                        return true;
                    }
                }

                return false;
            }

            function handleBulletPlatformCollision(bulletIndex, bullet) {
                for (let platformIndex = platforms.length - 1; platformIndex >= 0; platformIndex--) {
                    const platform = platforms[platformIndex];
                    if (platform.active === false) continue;
                    if (!pointInRect(bullet.x, bullet.y, platform.x, platform.y, platform.w, platform.h)) continue;

                    if (platform.type === "breakable") {
                        hitBreakablePlatform(platformIndex);
                    }

                    bullets.splice(bulletIndex, 1);
                    return true;
                }

                return false;
            }

            function handleBulletBallCollision(bulletIndex, bullet) {
                for (let ballIndex = 0; ballIndex < balls.length; ballIndex++) {
                    const ball = balls[ballIndex];
                    const dx = ball.x - bullet.x;
                    const dy = ball.y - bullet.y;
                    const assist = aimAssist ? 8 : 0;

                    if ((dx * dx + dy * dy) < ((ball.r + assist) * (ball.r + assist))) {
                        bullets.splice(bulletIndex, 1);
                        destroyBall(ballIndex, true);
                        return true;
                    }
                }

                return false;
            }

            function updateHarpoons(dt) {
                for (let harpoonIndex = harpoons.length - 1; harpoonIndex >= 0; harpoonIndex--) {
                    const harpoon = harpoons[harpoonIndex];
                    // A harpoon colliding with a weapon powerup mid-loop can
                    // trigger applyPowerUp() -> harpoons = [] (equipping a new
                    // weapon clears the shot in flight), reassigning the array
                    // out from under this iteration - guard against that.
                    if (!harpoon) continue;

                    if (harpoon.stuck) {
                        harpoon.stickTimer -= dt;
                        if (harpoon.stickTimer <= 0) {
                            harpoons.splice(harpoonIndex, 1);
                            continue;
                        }
                        handleHarpoonBallCollision(harpoonIndex, harpoon);
                        continue;
                    }

                    harpoon.yTop -= harpoon.speed * dt;

                    if (harpoon.yTop <= harpoon.maxTop) {
                        harpoon.yTop = harpoon.maxTop;
                    }

                    if (harpoon.yTop <= 0) {
                        if (harpoon.sticky) {
                            harpoon.stuck = true;
                            harpoon.stickTimer = STICKY_HARPOON_DURATION;
                            continue;
                        }
                        harpoons.splice(harpoonIndex, 1);
                        continue;
                    }
                    if (handleHarpoonPowerUpCollision(harpoonIndex, harpoon)) continue;
                    if (handleHarpoonBonusEntityCollision(harpoonIndex, harpoon)) continue;
                    if (handleHarpoonPlatformCollision(harpoonIndex, harpoon)) continue;

                    handleHarpoonBallCollision(harpoonIndex, harpoon);
                }
            }

            function handleHarpoonBonusEntityCollision(harpoonIndex, harpoon) {
                if (!bonusEntity) return false;

                const withinX = Math.abs(bonusEntity.x - harpoon.x) < BONUS_ENTITY_RADIUS;
                const withinY = bonusEntity.y >= harpoon.yTop && bonusEntity.y <= harpoon.yBottom;

                if (withinX && withinY) {
                    harpoons.splice(harpoonIndex, 1);
                    popBonusEntity();
                    return true;
                }

                return false;
            }

            function handleHarpoonPowerUpCollision(harpoonIndex, harpoon) {
                for (let powerUpIndex = powerUps.length - 1; powerUpIndex >= 0; powerUpIndex--) {
                    const powerUp = powerUps[powerUpIndex];
                    const r = 20;

                    const withinX = Math.abs(powerUp.x - harpoon.x) < r;
                    const withinY = powerUp.y >= harpoon.yTop && powerUp.y <= harpoon.yBottom;

                    if (withinX && withinY) {
                        applyPowerUp(powerUp);
                        powerUps.splice(powerUpIndex, 1);
                        harpoons.splice(harpoonIndex, 1);
                        return true;
                    }
                }

                return false;
            }

            function handleHarpoonPlatformCollision(harpoonIndex, harpoon) {
                for (let platformIndex = platforms.length - 1; platformIndex >= 0; platformIndex--) {
                    const platform = platforms[platformIndex];
                    if (platform.active === false) continue;
                    const withinX = harpoon.x >= platform.x && harpoon.x <= platform.x + platform.w;
                    const withinY = harpoon.yTop <= platform.y + platform.h && harpoon.yBottom >= platform.y;

                    if (!withinX || !withinY) continue;

                    if (platform.type === "breakable") {
                        hitBreakablePlatform(platformIndex);
                    }

                    harpoons.splice(harpoonIndex, 1);
                    return true;
                }

                return false;
            }

            function handleHarpoonBallCollision(harpoonIndex, harpoon) {
                for (let ballIndex = 0; ballIndex < balls.length; ballIndex++) {
                    const ball = balls[ballIndex];
                    const assist = aimAssist ? 6 : 0;
                    const hits = Math.abs(ball.x - harpoon.x) < (ball.r + assist) && (ball.y + ball.r) > harpoon.yTop;
                    if (hits) {
                        if (!harpoon.pierce && !harpoon.stuck) {
                            harpoons.splice(harpoonIndex, 1);
                        }
                        destroyBall(ballIndex);
                        return true;
                    }
                }

                return false;
            }

            function updateEffects(dt) {
                for (let i = pops.length - 1; i >= 0; i--) {
                    const pop = pops[i];
                    pop.life -= dt;

                    if (pop.vx !== undefined) {
                        pop.x += pop.vx * dt;
                        pop.y += pop.vy * dt;
                    }

                    if (pop.life <= 0) {
                        pops.splice(i, 1);
                    }
                }

                for (let i = scorePopups.length - 1; i >= 0; i--) {
                    const popup = scorePopups[i];
                    popup.life -= dt;
                    popup.y -= 40 * dt;

                    if (popup.life <= 0) {
                        scorePopups.splice(i, 1);
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.prevX = p.x;
                    p.prevY = p.y;
                    p.vy += p.gravity * dt;
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.life -= dt;

                    if (p.life <= 0) {
                        particles.splice(i, 1);
                    }
                }
            }

            // --- draw ---

            function draw() {
                // The accessibility hotkey hint (R/C/G/T) and the canvas-drawn
                // credit line only ever need to coexist if both are visible at
                // once; making them mutually exclusive by game state avoids
                // any pixel-level coordination between a fixed-position HTML
                // element and the dynamically-scaled canvas beneath it.
                hintEl.style.display = gameState === "playing" ? "" : "none";
                if (touchAdButton) {
                    touchAdButton.style.display = gameState === "gameover" && crazySdkReady ? "" : "none";
                }

                ctx.save();

                applyScreenShake();
                if (bgFarCache && bgNearCache && bgFloorCache) {
                    const centerOffset = player.x - W / 2;
                    const farOffset = reduceMotion ? 0 : clamp(centerOffset * PARALLAX_FAR_STRENGTH, -PARALLAX_MARGIN, PARALLAX_MARGIN);
                    const nearOffset = reduceMotion ? 0 : clamp(centerOffset * PARALLAX_NEAR_STRENGTH, -PARALLAX_MARGIN, PARALLAX_MARGIN);
                    ctx.drawImage(bgFarCache, PARALLAX_MARGIN - farOffset, 0, W, H, 0, 0, W, H);
                    ctx.drawImage(bgNearCache, PARALLAX_MARGIN - nearOffset, 0, W, H, 0, 0, W, H);
                    ctx.drawImage(bgFloorCache, 0, 0, W, H);
                } else {
                    drawBackground();
                    drawFloor();
                }
                if (gameState === "playing" || gameState === "startup") {
                    drawAmbientParticles(LEVELS[levelIndex].bg, last / 1000);
                }
                drawHazards();
                drawPlatforms();
                drawPlayer();
                drawPlayerDeathMarker();
                drawHarpoons();
                drawBullets();
                drawBallShadows();
                drawBalls();
                drawBonusEntity();
                drawPops();
                drawParticles();
                drawScorePopups();
                drawLevelClear();
                drawPowerUps();
                drawComboCallout();
                drawWeaponCallout();
                drawStageCard();
                drawHud();
                drawLives();
                drawScreens();

                ctx.restore();

                drawFlash();
                drawFrame();
                drawBorderText();
            }

            function applyScreenShake() {
                let shakeX = 0;
                let shakeY = 0;

                if (shakeTimer > 0 && !reduceMotion) {
                    const amplitude = Math.max(2, shakeStrength);
                    const t = simulationTime;
                    shakeX = Math.sin(t * 97.3) * amplitude * (shakeTimer / 0.16);
                    shakeY = Math.sin(t * 79.1 + 1.7) * amplitude * (shakeTimer / 0.16);
                }

                ctx.translate(shakeX, shakeY);
            }

            function rebuildBgCache() {
                // Far (sky/sun/moon) and near (hills/trees) layers are cached
                // extra-wide and separately from each other and the floor, so
                // each can pan at its own rate each frame for a real sense of
                // depth instead of the whole scene sliding as one flat sheet -
                // without re-drawing gradients/shapes every frame. The floor
                // the player actually stands on stays visually fixed underneath.
                const far = document.createElement("canvas");
                far.width = W + PARALLAX_MARGIN * 2;
                far.height = H;
                const far_ctx = far.getContext("2d");
                far_ctx.translate(PARALLAX_MARGIN, 0);
                drawBackground(far_ctx, "far");
                bgFarCache = far;

                const near = document.createElement("canvas");
                near.width = W + PARALLAX_MARGIN * 2;
                near.height = H;
                const near_ctx = near.getContext("2d");
                near_ctx.translate(PARALLAX_MARGIN, 0);
                drawBackground(near_ctx, "near");
                bgNearCache = near;

                const floor = document.createElement("canvas");
                floor.width = W;
                floor.height = H;
                const floor_ctx = floor.getContext("2d");
                drawFloor(floor_ctx);
                bgFloorCache = floor;
            }

            // Trunk + overlapping-circle canopy, reused across all three
            // background themes for tree silhouettes.
            function drawTreeSilhouette(c, x, groundY, canopyR, height) {
                // Trunk height used to be a fixed fraction of `height`,
                // independent of canopyR - for every actual call site canopyR
                // was too small relative to height for that fraction to reach
                // the canopy's underside, leaving the trunk floating below a
                // visible gap. Anchor the trunk to the canopy's real bottom
                // edge instead, with a small overlap so there's no seam.
                const canopyCenterY = groundY - height;
                const canopyBottomY = canopyCenterY + canopyR * 0.4 + canopyR * 0.7;
                const trunkTopY = canopyBottomY - 8;
                c.fillRect(x - 6, trunkTopY, 12, groundY - trunkTopY);

                c.beginPath();
                c.arc(x, canopyCenterY, canopyR, 0, Math.PI * 2);
                c.arc(x - canopyR * 0.6, canopyCenterY + canopyR * 0.4, canopyR * 0.7, 0, Math.PI * 2);
                c.arc(x + canopyR * 0.6, canopyCenterY + canopyR * 0.4, canopyR * 0.7, 0, Math.PI * 2);
                c.fill();
            }

            // Single-triangle conifer, for the cliffs scene.
            function drawPineSilhouette(c, x, groundY, width, height) {
                c.fillRect(x - width * 0.08, groundY - height * 0.22, width * 0.16, height * 0.22);
                c.beginPath();
                c.moveTo(x, groundY - height);
                c.lineTo(x - width / 2, groundY - height * 0.2);
                c.lineTo(x + width / 2, groundY - height * 0.2);
                c.closePath();
                c.fill();
            }

            // Three overlapping shards, for the cave scene's crystal outcrops.
            function drawCrystalCluster(c, x, groundY, height) {
                for (const side of [-1, 0, 1]) {
                    const h = height * (side === 0 ? 1 : 0.6);
                    const w = height * 0.28;
                    const px = x + side * w * 1.1;
                    c.beginPath();
                    c.moveTo(px - w / 2, groundY);
                    c.lineTo(px, groundY - h);
                    c.lineTo(px + w / 2, groundY);
                    c.closePath();
                    c.fill();
                }
            }

            // Ambient atmosphere (fireflies at night, drifting pollen otherwise).
            // Deliberately a pure function of elapsed time rather than mutable
            // per-particle state, so it stays fully decoupled from the
            // fixed-timestep simulation loop - purely cosmetic, drawn straight
            // onto the live canvas (not cached in bgCache) so it animates.
            function drawAmbientParticles(bg, seconds) {
                if (highContrastMode) return;

                ctx.save();

                if (bg === "night") {
                    ctx.fillStyle = "rgba(190,255,180,0.85)";
                    for (let i = 0; i < 14; i++) {
                        const seed = i * 137.5;
                        const x = (Math.sin(seconds * 0.3 + seed) * 0.5 + 0.5) * W;
                        const y = 60 + (Math.sin(seconds * 0.17 + seed * 1.3) * 0.5 + 0.5) * (FLOOR_Y - 140);
                        const twinkle = Math.max(0, Math.sin(seconds * 2 + seed));
                        ctx.globalAlpha = 0.3 + twinkle * 0.6;
                        ctx.beginPath();
                        ctx.arc(x, y, 1.6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else if (bg === "cave") {
                    ctx.fillStyle = "rgba(196,181,253,0.85)";
                    for (let i = 0; i < 12; i++) {
                        const seed = i * 119.3;
                        const x = (Math.sin(seconds * 0.22 + seed) * 0.5 + 0.5) * W;
                        const y = 80 + (Math.sin(seconds * 0.13 + seed * 1.7) * 0.5 + 0.5) * (FLOOR_Y - 160);
                        const twinkle = Math.max(0, Math.sin(seconds * 1.6 + seed));
                        ctx.globalAlpha = 0.25 + twinkle * 0.65;
                        ctx.beginPath();
                        ctx.arc(x, y, 1.8, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else if (bg === "volcanic") {
                    ctx.fillStyle = "rgba(251,146,60,0.8)";
                    for (let i = 0; i < 12; i++) {
                        const seed = i * 83.1;
                        const x = ((seed * 53) % W) + Math.sin(seconds * 0.5 + seed) * 12;
                        const y = FLOOR_Y - ((seconds * 26 + seed * 31) % (FLOOR_Y - 60));
                        const flicker = Math.max(0, Math.sin(seconds * 3 + seed));
                        ctx.globalAlpha = 0.35 + flicker * 0.5;
                        ctx.beginPath();
                        ctx.arc(x, y, 1.7, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else if (bg === "cliffs") {
                    ctx.strokeStyle = "rgba(51,65,85,0.6)";
                    ctx.lineWidth = 2;
                    ctx.lineCap = "round";
                    for (let i = 0; i < 4; i++) {
                        const seed = i * 211.7;
                        const x = ((seconds * 18 + seed) % (W + 120)) - 60;
                        const y = 70 + (Math.sin(seconds * 0.25 + seed) * 0.5 + 0.5) * 100;
                        ctx.beginPath();
                        ctx.moveTo(x - 8, y);
                        ctx.quadraticCurveTo(x - 4, y - 5, x, y);
                        ctx.quadraticCurveTo(x + 4, y - 5, x + 8, y);
                        ctx.stroke();
                    }
                } else {
                    ctx.fillStyle = "rgba(255,255,255,0.4)";
                    for (let i = 0; i < 10; i++) {
                        const seed = i * 91.7;
                        const x = ((seconds * 12 + seed * 40) % (W + 40)) - 20;
                        const y = 40 + (Math.sin(seconds * 0.4 + seed) * 0.5 + 0.5) * (FLOOR_Y - 100);
                        ctx.beginPath();
                        ctx.arc(x, y, 1.4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.restore();
            }

            // Split into a distant "far" layer (sky, sun/moon, stars) and a
            // closer "near" layer (hills/canopy, trees), so each can pan at
            // its own rate for a real depth cue instead of the whole scene
            // sliding as one flat sheet. The ground-level strip right above
            // the floor is drawn in drawFloor() instead, fixed in place -
            // it touches the (also fixed) floor bricks, so panning it
            // separately created a visible seam between the two.
            function drawBackground(c = ctx, layer = "all") {
                const bg = LEVELS[levelIndex].bg;
                const far = layer === "all" || layer === "far";
                const near = layer === "all" || layer === "near";

                if (highContrastMode) {
                    if (far) {
                        c.fillStyle = "#0f172a";
                        c.fillRect(-PARALLAX_MARGIN, 0, W + PARALLAX_MARGIN * 2, FLOOR_Y);
                    }
                    return;
                }

                if (bg === "meadow") {
                    if (far) {
                        c.fillStyle = THEME.env.skyMeadow;
                        c.fillRect(-PARALLAX_MARGIN, 0, W + PARALLAX_MARGIN * 2, FLOOR_Y);
                    }

                    if (near) {
                        c.fillStyle = THEME.env.canopyDark;
                        c.beginPath();
                        c.moveTo(-PARALLAX_MARGIN, FLOOR_Y - 90);
                        c.lineTo(0, FLOOR_Y - 90);
                        c.quadraticCurveTo(140, FLOOR_Y - 150, 300, FLOOR_Y - 95);
                        c.quadraticCurveTo(440, FLOOR_Y - 140, 620, FLOOR_Y - 100);
                        c.quadraticCurveTo(760, FLOOR_Y - 130, W, FLOOR_Y - 85);
                        c.lineTo(W + PARALLAX_MARGIN, FLOOR_Y - 85);
                        c.lineTo(W + PARALLAX_MARGIN, FLOOR_Y);
                        c.lineTo(-PARALLAX_MARGIN, FLOOR_Y);
                        c.closePath();
                        c.fill();

                        c.fillStyle = THEME.env.canopyMid;
                        for (let x = 20 - 70; x < W + PARALLAX_MARGIN; x += 70) {
                            const bumpY = FLOOR_Y - 95 - Math.sin(x * 0.02) * 30;
                            c.beginPath();
                            c.arc(x, bumpY, 34, 0, Math.PI * 2);
                            c.fill();
                        }
                    }
                    return;
                }

                if (bg === "sunset") {
                    if (far) {
                        const grad = c.createLinearGradient(0, 0, 0, FLOOR_Y);
                        grad.addColorStop(0, "#f97316");
                        grad.addColorStop(0.45, "#fb7185");
                        grad.addColorStop(1, "#7c3aed");
                        c.fillStyle = grad;
                        c.fillRect(-PARALLAX_MARGIN, 0, W + PARALLAX_MARGIN * 2, FLOOR_Y);

                        const sunGrad = c.createRadialGradient(W - 140, 100, 0, W - 140, 100, 50);
                        sunGrad.addColorStop(0, "#fffbeb");
                        sunGrad.addColorStop(0.5, "rgba(255,240,150,0.9)");
                        sunGrad.addColorStop(1, "rgba(255,220,120,0)");
                        c.beginPath();
                        c.arc(W - 140, 100, 50, 0, Math.PI * 2);
                        c.fillStyle = sunGrad;
                        c.fill();

                        c.beginPath();
                        c.arc(W - 140, 100, 22, 0, Math.PI * 2);
                        c.fillStyle = "#fff7c2";
                        c.fill();
                    }

                    if (near) {
                        c.fillStyle = THEME.env.canopyDark;
                        drawTreeSilhouette(c, 220, FLOOR_Y, 26, 150);
                        drawTreeSilhouette(c, 560, FLOOR_Y, 34, 190);
                        drawTreeSilhouette(c, 720, FLOOR_Y, 22, 130);
                    }
                    return;
                }

                if (bg === "night") {
                    if (far) {
                        const grad = c.createLinearGradient(0, 0, 0, FLOOR_Y);
                        grad.addColorStop(0, "#020617");
                        grad.addColorStop(1, "#0f172a");
                        c.fillStyle = grad;
                        c.fillRect(-PARALLAX_MARGIN, 0, W + PARALLAX_MARGIN * 2, FLOOR_Y);

                        const moonGrad = c.createRadialGradient(W - 120, 90, 0, W - 120, 90, 45);
                        moonGrad.addColorStop(0, "#ffffff");
                        moonGrad.addColorStop(0.55, "rgba(226,232,240,0.55)");
                        moonGrad.addColorStop(1, "rgba(226,232,240,0)");
                        c.beginPath();
                        c.arc(W - 120, 90, 45, 0, Math.PI * 2);
                        c.fillStyle = moonGrad;
                        c.fill();

                        c.beginPath();
                        c.arc(W - 120, 90, 28, 0, Math.PI * 2);
                        c.fillStyle = "#f8fafc";
                        c.fill();

                        c.fillStyle = "rgba(255,255,255,0.8)";
                        for (const [x, y] of BACKGROUND_NIGHT_STARS) {
                            c.fillRect(x, y, 2, 2);
                        }
                    }

                    if (near) {
                        c.fillStyle = "#0b1a12";
                        for (let x = 10; x < W; x += 60) {
                            drawTreeSilhouette(c, x, FLOOR_Y, 20, 55 + (x % 120 === 0 ? 30 : 10));
                        }
                    }
                    return;
                }

                if (bg === "cliffs") {
                    if (far) {
                        const grad = c.createLinearGradient(0, 0, 0, FLOOR_Y);
                        grad.addColorStop(0, "#0ea5e9");
                        grad.addColorStop(1, "#cffafe");
                        c.fillStyle = grad;
                        c.fillRect(-PARALLAX_MARGIN, 0, W + PARALLAX_MARGIN * 2, FLOOR_Y);

                        const sunGrad = c.createRadialGradient(W - 130, 90, 0, W - 130, 90, 46);
                        sunGrad.addColorStop(0, "#ffffff");
                        sunGrad.addColorStop(0.5, "rgba(255,255,240,0.85)");
                        sunGrad.addColorStop(1, "rgba(255,255,240,0)");
                        c.beginPath();
                        c.arc(W - 130, 90, 46, 0, Math.PI * 2);
                        c.fillStyle = sunGrad;
                        c.fill();

                        c.beginPath();
                        c.arc(W - 130, 90, 20, 0, Math.PI * 2);
                        c.fillStyle = "#fffdf5";
                        c.fill();
                    }

                    if (near) {
                        // Distant, paler ridge behind a closer, darker one with
                        // snow-cap highlights - two silhouettes at slightly
                        // different heights read as depth without needing a
                        // third parallax layer.
                        c.fillStyle = "#94a3b8";
                        c.beginPath();
                        c.moveTo(-PARALLAX_MARGIN, FLOOR_Y - 60);
                        c.lineTo(60, FLOOR_Y - 110);
                        c.lineTo(180, FLOOR_Y - 60);
                        c.lineTo(300, FLOOR_Y - 130);
                        c.lineTo(420, FLOOR_Y - 65);
                        c.lineTo(560, FLOOR_Y - 115);
                        c.lineTo(680, FLOOR_Y - 55);
                        c.lineTo(W, FLOOR_Y - 90);
                        c.lineTo(W + PARALLAX_MARGIN, FLOOR_Y - 60);
                        c.lineTo(W + PARALLAX_MARGIN, FLOOR_Y);
                        c.lineTo(-PARALLAX_MARGIN, FLOOR_Y);
                        c.closePath();
                        c.fill();

                        c.fillStyle = "#64748b";
                        c.beginPath();
                        c.moveTo(-PARALLAX_MARGIN, FLOOR_Y - 40);
                        c.lineTo(120, FLOOR_Y - 140);
                        c.lineTo(260, FLOOR_Y - 50);
                        c.lineTo(400, FLOOR_Y - 160);
                        c.lineTo(540, FLOOR_Y - 60);
                        c.lineTo(700, FLOOR_Y - 150);
                        c.lineTo(W, FLOOR_Y - 50);
                        c.lineTo(W + PARALLAX_MARGIN, FLOOR_Y - 80);
                        c.lineTo(W + PARALLAX_MARGIN, FLOOR_Y);
                        c.lineTo(-PARALLAX_MARGIN, FLOOR_Y);
                        c.closePath();
                        c.fill();

                        c.fillStyle = "rgba(248,250,252,0.85)";
                        for (const [px, py] of [[120, FLOOR_Y - 140], [400, FLOOR_Y - 160], [700, FLOOR_Y - 150]]) {
                            c.beginPath();
                            c.moveTo(px - 16, py + 20);
                            c.lineTo(px, py);
                            c.lineTo(px + 16, py + 20);
                            c.closePath();
                            c.fill();
                        }

                        c.fillStyle = "#166534";
                        drawPineSilhouette(c, 90, FLOOR_Y, 26, 70);
                        drawPineSilhouette(c, 250, FLOOR_Y, 20, 55);
                        drawPineSilhouette(c, 630, FLOOR_Y, 24, 65);
                        drawPineSilhouette(c, 800, FLOOR_Y, 18, 50);
                    }
                    return;
                }

                if (bg === "cave") {
                    if (far) {
                        const grad = c.createLinearGradient(0, 0, 0, FLOOR_Y);
                        grad.addColorStop(0, "#0c0a1f");
                        grad.addColorStop(1, "#1e1b3a");
                        c.fillStyle = grad;
                        c.fillRect(-PARALLAX_MARGIN, 0, W + PARALLAX_MARGIN * 2, FLOOR_Y);

                        const crystalGrad = c.createRadialGradient(W - 160, 130, 0, W - 160, 130, 70);
                        crystalGrad.addColorStop(0, "rgba(165,243,252,0.5)");
                        crystalGrad.addColorStop(1, "rgba(165,243,252,0)");
                        c.beginPath();
                        c.arc(W - 160, 130, 70, 0, Math.PI * 2);
                        c.fillStyle = crystalGrad;
                        c.fill();

                        c.fillStyle = "rgba(103,232,249,0.9)";
                        for (const [x, y] of CAVE_CRYSTAL_GLINTS) {
                            c.beginPath();
                            c.arc(x, y, 2.2, 0, Math.PI * 2);
                            c.fill();
                        }
                    }

                    if (near) {
                        // A silhouette color that's actually lighter than the
                        // sky gradient, and stalagmites/crystals tall enough
                        // to clear the ground strip drawn on top afterward in
                        // drawFloor() - both were getting nearly swallowed.
                        c.fillStyle = "#3b2564";
                        for (let x = 10 - 90; x < W + PARALLAX_MARGIN; x += 90) {
                            const len = 40 + Math.sin(x * 0.05) * 20;
                            c.beginPath();
                            c.moveTo(x - 22, 0);
                            c.lineTo(x + 22, 0);
                            c.lineTo(x, len);
