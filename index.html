<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Slime Siege</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #111;
            color: #ddd;
            font-family: system-ui, sans-serif;
            touch-action: manipulation;
        }

        body {
            overflow: hidden;
        }

        #gameShell {
            position: fixed;
            inset: 0;
            background: #030712;
            display: grid;
            place-items: center;
        }

        canvas {
            position: absolute;
            background: #0b0f1a;
            box-shadow:
                0 0 0 6px #1d4ed8,
                0 0 30px rgba(59, 130, 246, 0.35);
            touch-action: none;
            will-change: transform;
        }

        .hint {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 30px;
            text-align: center;
            font-size: 14px;
            opacity: .8;
        }

        .touch-controls {
            position: fixed;
            left: 0;
            right: 0;
            bottom: max(14px, env(safe-area-inset-bottom));
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 16px;
            pointer-events: none;
        }

        .touch-cluster {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }

        .touch-btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 2px solid rgba(191, 219, 254, 0.85);
            background: rgba(30, 41, 59, 0.5);
            color: #fff;
            font-weight: 700;
            font-size: 24px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .touch-btn.fire {
            width: 84px;
            height: 84px;
            font-size: 20px;
        }

        @media (pointer: coarse) {
            .touch-controls {
                display: flex;
            }

            .hint {
                bottom: calc(112px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>

            // decoded once up front; each trigger is a cheap
            // AudioBufferSourceNode.start() with no media-session overhead,
            // and overlapping triggers don't need pooling.
            const SFX_SOURCES = {
                shoot: "sounds/shoot.wav",
                pop: "sounds/pop.wav",
                death: "sounds/death.wav",
                level: "sounds/level.wav",
                powerup: "sounds/powerup.wav",
                bomb: "sounds/bomb.wav"

            let audioCtx = null;
            const sfxBuffers = {};

            function getAudioContext() {
                if (!audioCtx) {
                    const Ctx = window.AudioContext || window.webkitAudioContext;
                    audioCtx = Ctx ? new Ctx() : null;
                }
                return audioCtx;
            }

            function unlockAudio() {
                const ctx = getAudioContext();
                if (ctx && ctx.state === "suspended") {
                    ctx.resume().catch(() => { });
                }
            }

            // iOS requires AudioContext creation/resume to happen inside a
            // genuine user gesture, so hook the first one anywhere on the page.
            const _unlockAudioOnce = () => unlockAudio();
            addEventListener("keydown", _unlockAudioOnce, { once: true, capture: true });
            addEventListener("pointerdown", _unlockAudioOnce, { once: true, capture: true });
            addEventListener("touchstart", _unlockAudioOnce, { once: true, capture: true });

            (async function loadSfxBuffers() {
                const ctx = getAudioContext();
                if (!ctx) return;
                await Promise.all(Object.entries(SFX_SOURCES).map(async ([key, src]) => {
                    try {
                        const response = await fetch(src);
                        const arrayBuffer = await response.arrayBuffer();
                        sfxBuffers[key] = await ctx.decodeAudioData(arrayBuffer);
                    } catch (err) {
                        // sfxBuffers[key] stays unset; playSound() no-ops for it
                        console.error(`Failed to load SFX "${key}" (${src}):`, err);

                },
                {
                    name: "Storm Channels",
                    bg: "sunset",
                    challenge: "score_attack",
                    balls: [
                        { size: 0, x: 160, y: 90, dir: 1 },
                        { size: 0, x: 740, y: 90, dir: -1 }
                    ],
                    platforms: [
                        { x: 100, y: 280, w: 210, h: 16, type: "solid" },
                        { x: 345, y: 220, w: 210, h: 16, type: "breakable", gate: { onRatio: 0.5, cycle: 2.6 } },
                        { x: 590, y: 280, w: 210, h: 16, type: "solid" }
                    ],
                    modifiers: {
                        wind: -42
                    }
                },
                {
                    name: "Final Relay",
                    bg: "night",
                    challenge: "survive",
                    balls: [
                        { size: 1, x: 160, y: 100, dir: 1 },
                        { size: 2, x: 320, y: 150, dir: -1 },
                        { size: 2, x: 580, y: 150, dir: 1 },
                        { size: 1, x: 740, y: 100, dir: -1 }
                    ],
                    platforms: [
                        { x: 120, y: 250, w: 150, h: 16, type: "solid", move: { axis: "y", amp: 45, speed: 1.2 } },
                        { x: 380, y: 220, w: 140, h: 16, type: "breakable", gate: { onRatio: 0.48, cycle: 2.8 } },
                        { x: 630, y: 250, w: 150, h: 16, type: "solid", move: { axis: "y", amp: 45, speed: 1.2, phase: Math.PI } }
                    ],
                    modifiers: {
                        hazards: [
                            { x: 260, y: FLOOR_Y - 16, w: 120, h: 12 },
                            { x: 520, y: FLOOR_Y - 16, w: 120, h: 12 }
                        ]
                    }
                }
            ];

            const BACKGROUND_NIGHT_STARS = [
                [80, 60], [160, 110], [240, 70], [320, 130], [420, 55],
                [520, 95], [610, 60], [730, 120], [810, 75]
            ];

            const ACTION_KEYS = {
                left: new Set(["ArrowLeft", "KeyA"]),
                right: new Set(["ArrowRight", "KeyD"]),
                fire: new Set(["Space"])
            };

            // --- input ---
            const pressedKeys = new Set();
            const touchState = {
                left: false,
                right: false,
                fire: false
            };
            const actionState = {
                left: false,
                right: false,
                fire: false
            };

            addEventListener("keydown", (e) => {
                if (gameState === "gameover" && enteringScore) {
                    if (e.code === "Tab") {
                        e.preventDefault();
                        initialsIndex = (initialsIndex + (e.shiftKey ? 2 : 1)) % 3;
                        return;
                    }

                    if (e.code === "Backspace") {
                        e.preventDefault();
                        initials[initialsIndex] = "A";
                        if (initialsIndex > 0) initialsIndex--;
                        return;
                    }

                    if (e.code === "ArrowLeft") {
                        e.preventDefault();
                        initialsIndex = Math.max(0, initialsIndex - 1);
                        return;
                    }

                    if (e.code === "ArrowRight") {
                        e.preventDefault();
                        initialsIndex = Math.min(2, initialsIndex + 1);
                        return;
                    }

                    if (e.code === "ArrowUp") {
                        e.preventDefault();
                        const c = initials[initialsIndex].charCodeAt(0);
                        initials[initialsIndex] = c >= 90 ? "A" : String.fromCharCode(c + 1);
                        return;
                    }

                    if (e.code === "ArrowDown") {
                        e.preventDefault();
                        const c = initials[initialsIndex].charCodeAt(0);
                        initials[initialsIndex] = c <= 65 ? "Z" : String.fromCharCode(c - 1);
                        return;
                    }

                    if (/^[a-zA-Z]$/.test(e.key)) {
                        e.preventDefault();
                        initials[initialsIndex] = e.key.toUpperCase();
                        if (initialsIndex < 2) initialsIndex++;
                        return;
                    }

                    if (e.code === "Enter" || e.code === "Space") {
                        e.preventDefault();
                        submitScore();
                        enteringScore = false;
                        return;
                    }
                }

                if (e.code === "KeyP") {
                    paused = !paused;
                    return;
                }

                if (e.code === "KeyM") {
                    musicMuted = !musicMuted;
                    for (const track of Object.values(musicTracks)) {
                        track.muted = musicMuted;
                    }
                    if (!musicMuted && currentMusicTrack && currentMusicTrack.paused) {
                        currentMusicTrack.play().catch(() => { });
                    }
                    return;
                }

                if (e.code === "KeyS") {
                    sfxMuted = !sfxMuted;
                    return;
                }

                if (e.code === "KeyR") {
                    reduceMotion = !reduceMotion;
                    return;
                }

                if (e.code === "KeyC") {
                    highContrastMode = !highContrastMode;
                    rebuildBgCache();
                    return;
                }

                if (e.code === "KeyG") {
                    aimAssist = !aimAssist;
                    return;
                }

                if (e.code === "KeyT") {
                    timerAssist = !timerAssist;
                    return;
                }

                if (gameState === "startup" && (e.code === "KeyQ" || e.code === "KeyE")) {
                    const delta = e.code === "KeyE" ? 1 : -1;
                    selectedLoadoutIndex = (selectedLoadoutIndex + delta + LOADOUTS.length) % LOADOUTS.length;
                    return;
                }

                if (isHandledKey(e.code)) e.preventDefault();
                pressedKeys.add(e.code);
                updateActionState();
            });

            addEventListener("keyup", (e) => {
                pressedKeys.delete(e.code);
                updateActionState();
            });

            function isHandledKey(code) {
                return ACTION_KEYS.left.has(code) ||
                    ACTION_KEYS.right.has(code) ||
                    ACTION_KEYS.fire.has(code);
            }

            function updateActionState() {
                actionState.left = hasAnyKey(ACTION_KEYS.left) || touchState.left;
                actionState.right = hasAnyKey(ACTION_KEYS.right) || touchState.right;
                actionState.fire = hasAnyKey(ACTION_KEYS.fire) || touchState.fire;
            }

            function hasAnyKey(keySet) {
                for (const code of keySet) {
                    if (pressedKeys.has(code)) return true;
                }
                return false;
            }

            function consumeFirePress() {
                if (!actionState.fire) return false;

                for (const code of ACTION_KEYS.fire) {
                    pressedKeys.delete(code);
                }

                updateActionState();
                return true;
            }

            function bindTouchControl(button, key) {
                if (!button) return;

                const set = (value, event) => {
                    event.preventDefault();
                    touchState[key] = value;
                    updateActionState();
                };

                const release = (event) => {
                    set(false, event);
                    if (button.hasPointerCapture?.(event.pointerId)) {
                        button.releasePointerCapture(event.pointerId);
                    }
                };

                button.addEventListener("pointerdown", event => {
                    set(true, event);
                    if (button.setPointerCapture) {
                        button.setPointerCapture(event.pointerId);
                    }
                });
                button.addEventListener("pointerup", release);
                button.addEventListener("pointercancel", release);
                button.addEventListener("lostpointercapture", event => set(false, event));
                button.addEventListener("pointerleave", event => {
                    if (event.pointerType === "mouse") {
                        set(false, event);
                    }
                });
                button.addEventListener("contextmenu", event => event.preventDefault());
            }

            // --- entities ---
            const player = {
                w: PLAYER.width,
                h: PLAYER.height,
                x: W * 0.5,
                y: FLOOR_Y - 48,
                prevX: W * 0.5,
                vx: 0,
                speed: PLAYER.speed,
                facing: 1,
                moving: false
            };

            function createBall(size, x, y, dir = 1, vy = 0) {
                return {
                    size,
                    r: BALL_SIZES[size],
                    x,
                    y,
                    prevX: x,
                    prevY: y,
                    vx: BALL_VX[size] * dir,
                    vy,
                    squash: 0
                };
            }

            // --- game state ---
            let balls = [];
            let pops = [];
            let harpoons = [];
            let scorePopups = [];
            let particles = [];
            let footstepTimer = 0;
            let platforms = [];
            let hazardStrips = [];
            let powerUps = [];
            let bullets = [];
            let highScores = [];

            let gameState = "startup";
            let startupBlinkTimer = 0;
            let stageCardTimer = 1.5;
            let comboCallout = "";
            let comboCalloutTimer = 0;
            let weaponCallout = "";
            let weaponCalloutTimer = 0;
            let weaponCalloutColor = "#ffffff";
            let score = 0;
            let comboTimer = 0;
            let comboCount = 0;
            let lives = STARTING_LIVES;
            let levelClear = false;
            let levelClearTimer = 0;
            let playerDead = false;
            let deathTimer = 0;
            let invulnTimer = 0;
            let levelIndex = 0;
            let timeLeft = START_TIME;
            let levelTimeBudget = START_TIME;
            let currentMusicTrack = null;

            let weaponType = "harpoon";
            let harpoonSpeed = 900;
            let bulletCooldownFactor = 1;
            let bulletCooldown = 0;

            let flashTimer = 0;
            let shakeTimer = 0;
            let shakeStrength = 0;
            let freezeTimer = 0;
            let hitStopTimer = 0;

            let bgCache = null;

            let last = performance.now();
            let accumulator = 0;
            let renderAlpha = 1;
            let simulationTime = 0;

            let musicMuted = false;
            let sfxMuted = false;
            let paused = false;
            let reduceMotion = isTouchDevice || window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            let highContrastMode = false;
            let aimAssist = false;
            let timerAssist = false;
            let levelWind = 0;
            let challengeType = null;
            let surviveTimer = 0;
            let selectedLoadoutIndex = 0;

            let sessionToken = null;
            let enteringScore = false;
            let initials = ["A", "A", "A"];
            let initialsIndex = 0;
            let scoreSubmitted = false;

            const LOADOUTS = [
                { name: "Balanced", playerSpeed: PLAYER.speed, harpoonSpeed: 900, cooldownFactor: 1 },
                { name: "Rapid", playerSpeed: PLAYER.speed - 20, harpoonSpeed: 980, cooldownFactor: 0.78 },
                { name: "Control", playerSpeed: PLAYER.speed + 25, harpoonSpeed: 820, cooldownFactor: 1.12 }
            ];
            const CHAPTERS = [
                { upToLevel: 9, name: "Chapter 1 · Arcade Echoes" },
                { upToLevel: 18, name: "Chapter 2 · Split Routes" },
                { upToLevel: 27, name: "Chapter 3 · Remix Arena" },
                { upToLevel: 31, name: "Chapter 4 · Hazard Run" }
            ];
            // 0-based level indices where a new chapter begins (every boundary
            // except the last, which just ends the run) - reaching one of these
            // awards a bonus life, a predictable milestone rather than a random drop.
            const CHAPTER_BONUS_LIFE_INDICES = new Set(CHAPTERS.slice(0, -1).map(c => c.upToLevel));

            // --- helpers ---

            function resizeCanvasToViewport() {
                const viewportW = Math.max(320, window.innerWidth);
                const viewportH = Math.max(240, window.innerHeight);
                const scale = Math.min(viewportW / W, viewportH / H);
                const displayW = Math.max(1, Math.floor(W * scale));
                const displayH = Math.max(1, Math.floor(H * scale));
                const offsetX = Math.floor((viewportW - displayW) / 2);
                const offsetY = Math.floor((viewportH - displayH) / 2);
                const dpr = Math.max(1, Math.min(MAX_CANVAS_DPR, window.devicePixelRatio || 1));

                canvas.style.width = `${displayW}px`;
                canvas.style.height = `${displayH}px`;
                canvas.style.left = `${offsetX}px`;
                canvas.style.top = `${offsetY}px`;

                canvas.width = Math.max(1, Math.floor(displayW * dpr));
                canvas.height = Math.max(1, Math.floor(displayH * dpr));

                ctx.setTransform((displayW / W) * dpr, 0, 0, (displayH / H) * dpr, 0, 0);
            }

            function triggerImpactFeedback({ flash = 0.12, shake = 0.16, strength = 8, hitStop = 0.025 } = {}) {
                if (reduceMotion) {
                    flash = Math.min(flash, 0.05);
                    shake = 0;
                    strength = 0;
                    hitStop = 0;
                }
                flashTimer = Math.max(flashTimer, flash);
                shakeTimer = Math.max(shakeTimer, shake);
                shakeStrength = Math.max(shakeStrength, strength);
                hitStopTimer = Math.max(hitStopTimer, hitStop);
            }

            function getChapterName(index) {
                for (const chapter of CHAPTERS) {
                    if (index + 1 <= chapter.upToLevel) return chapter.name;
                }
                return CHAPTERS[CHAPTERS.length - 1].name;
            }

            function applySelectedLoadout() {
                const loadout = LOADOUTS[selectedLoadoutIndex];
                player.speed = loadout.playerSpeed;
                harpoonSpeed = loadout.harpoonSpeed;
                bulletCooldownFactor = loadout.cooldownFactor;
            }

            // Local high-score board (localStorage). No backend to talk to -
            // this is what CrazyGames' Leaderboards SDK will replace once
            // the game is integrated into the platform.
            const HIGH_SCORE_KEY = "slimeSiegeHighScores";

            async function loadHighScores() {
                try {
                    const raw = localStorage.getItem(HIGH_SCORE_KEY);
                    highScores = raw ? JSON.parse(raw) : [];
                } catch {
                    highScores = [];
                }
            }

            async function startScoreSession() {
                sessionToken = "local";
            }

            async function submitScore() {
                if (!sessionToken || scoreSubmitted) return;

                highScores.push({
                    initials: initials.join(""),
                    points: score,
                    level: levelIndex + 1
                });
                highScores.sort((a, b) => b.points - a.points || b.level - a.level);
                highScores = highScores.slice(0, 10);

                try {
                    localStorage.setItem(HIGH_SCORE_KEY, JSON.stringify(highScores));
                } catch {
                    // storage unavailable (private mode, quota) - keep the in-memory list
                }
                scoreSubmitted = true;
            }

            function qualifiesForHighScore() {
                if (highScores.length < 10) return true;

                const last = highScores[highScores.length - 1];
                const lastPoints = last.points ?? 0;
                const lastLevel = last.level ?? 0;

                return score > lastPoints || (score === lastPoints && (levelIndex + 1) > lastLevel);
            }

            function clamp(value, min, max) {
                return Math.max(min, Math.min(max, value));
            }

            function lerp(a, b, t) {
                return a + (b - a) * t;
            }

            function playSound(key) {
                if (sfxMuted) return;
                const ctx = audioCtx;
                const buffer = sfxBuffers[key];
                if (!ctx || !buffer) return;
                const source = ctx.createBufferSource();
                source.buffer = buffer;
                source.connect(ctx.destination);
                source.start(0);
            }

            function resetWeaponState() {
                const loadout = LOADOUTS[selectedLoadoutIndex];
                weaponType = "harpoon";
                harpoonSpeed = loadout.harpoonSpeed;
                clearProjectiles();
            }

            // Clears in-flight shots without resetting the equipped weapon -
            // used on level transitions so the weapon persists across rounds
            // (only dying should cost you your weapon).
            function clearProjectiles() {
                bulletCooldown = 0;
                bullets = [];
                harpoons = [];
            }

            function resetRunState() {
                score = 0;
                lives = STARTING_LIVES;
                levelIndex = 0;
                simulationTime = 0;
                applySelectedLoadout();
                resetWeaponState();
                freezeTimer = 0;
                gameState = "playing";
            }

            function resetLevelState() {
                clearProjectiles();
                powerUps = [];
                pops = [];
                scorePopups = [];
                particles = [];
                comboCallout = "";
                comboCalloutTimer = 0;
                weaponCallout = "";
                weaponCalloutTimer = 0;

                player.x = W * 0.5;
                player.prevX = W * 0.5;
                playerDead = false;
                deathTimer = 0;
                levelClear = false;
                levelClearTimer = 0;
                timeLeft = levelTimeBudget;
                freezeTimer = 0;
                // Balls reset to their level-start positions on every respawn too,
                // and several levels spawn one right above the player's fixed
                // spawn point - without a grace window a respawn could walk
                // straight into a ball that's already falling through center.
                invulnTimer = RESPAWN_INVULN_TIME;
            }

            function hitsToClearBall(size) {
                return Math.pow(2, BALL_SIZES.length - size) - 1;
            }

            function computeLevelTimeBudget(level, index) {
                const totalHits = level.balls.reduce((sum, ball) => sum + hitsToClearBall(ball.size), 0);
                const platformCount = (level.platforms || []).length;
                const base = TIME_BUDGET_BASE_SECONDS + totalHits * TIME_PER_HIT_SECONDS + platformCount * TIME_PER_PLATFORM_SECONDS;

                const graceT = Math.max(0, Math.min(1, index / EARLY_GRACE_LEVELS));
                const grace = 1 + EARLY_GRACE_BONUS * (1 - graceT);

                const seconds = Math.max(MIN_LEVEL_SECONDS, Math.min(MAX_LEVEL_SECONDS, base * grace));
                return seconds * TIME_DRAIN_PER_SECOND;
            }

            async function startGame() {
                await startScoreSession();

                enteringScore = false;
                initials = ["A", "A", "A"];
                initialsIndex = 0;
                scoreSubmitted = false;

                resetRunState();
                loadLevel(levelIndex);
            }

            function resetLevel() {
                loadLevel(levelIndex);
            }

            function playLevelMusic() {
                const bg = LEVELS[levelIndex].bg;
                const track = musicTracks[bg];

                if (currentMusicTrack === track) return;

                if (currentMusicTrack) {
                    currentMusicTrack.pause();
                    currentMusicTrack.currentTime = 0;
                }

                currentMusicTrack = track;
                if (musicMuted) return;

                // Defer play() to a separate task. loadLevel() (and this call)
                // can run synchronously inside tick()'s fixed-step simulation
                // loop on level transitions; starting playback here forces the
                // browser to fetch/buffer/decode a not-yet-loaded track (music
                // files are 600KB-1.7MB) inside that frame, stalling it before
                // draw() and the next requestAnimationFrame run. This was the
                // source of the judder observed on iOS Safari.
                setTimeout(() => currentMusicTrack.play().catch(() => { }), 0);
            }

            function preparePlatforms(platformList = []) {
                return platformList.map(platform => ({
                    ...platform,
                    baseX: platform.x,
                    baseY: platform.y,
                    movePhase: platform.move?.phase ?? Math.random() * Math.PI * 2,
                    active: true
                }));
            }

            function loadLevel(index) {
                const level = LEVELS[index];

                balls = level.balls.map(ball => createBall(ball.size, ball.x, ball.y, ball.dir));
                platforms = preparePlatforms(level.platforms || []);
                hazardStrips = (level.modifiers?.hazards || []).map(strip => ({ ...strip }));
                levelWind = level.modifiers?.wind || 0;
                challengeType = level.challenge ?? null;
                surviveTimer = challengeType === "survive" ? 25 : 0;
                stageCardTimer = 1.7;
                levelTimeBudget = computeLevelTimeBudget(level, index);

                playLevelMusic();

                rebuildBgCache();
                resetLevelState();
            }

            function spawnPop(x, y, r) {
                pops.push({
                    x,
                    y,
                    prevX: x,
                    prevY: y,
                    r,
                    life: POP_DURATION
                });
            }

            function spawnScore(x, y, value) {
                scorePopups.push({
                    x,
                    y,
                    prevY: y,
                    value,
                    life: SCORE_POPUP_LIFE
                });
            }

            function spawnSparkBurst(x, y, count, radius, life, speed) {
                for (let i = 0; i < count; i++) {
                    pops.push({
                        x,
                        y,
                        prevX: x,
                        prevY: y,
                        r: radius,
                        life,
                        vx: (Math.random() - 0.5) * speed,
                        vy: (Math.random() - 0.5) * speed,
                        spark: true
                    });
                }
            }

            // Generic one-shot debris/dust particles (footstep dust, platform
            // break chips, powerup pickup bursts) - separate from spawnSparkBurst
            // since those are ball-pop specific and always the same color.
            function spawnParticles(x, y, { count, radius, life, speed, color, gravity = 0 }) {
                for (let i = 0; i < count; i++) {
                    const lifeJitter = 0.75 + Math.random() * 0.5;
                    particles.push({
                        x,
                        y,
                        prevX: x,
                        prevY: y,
                        vx: (Math.random() - 0.5) * speed,
                        vy: -Math.random() * speed * 0.6,
                        gravity,
                        r: radius * (0.75 + Math.random() * 0.5),
                        life: life * lifeJitter,
                        maxLife: life * lifeJitter,
                        color
                    });
                }
            }

            function pickWeighted(entries) {
                const total = entries.reduce((sum, e) => sum + e.weight, 0);
                let roll = Math.random() * total;
                for (const entry of entries) {
                    if (roll < entry.weight) return entry.type;
                    roll -= entry.weight;
                }
                return entries[entries.length - 1].type;
            }

            const POWERUP_POOL = [
                { type: "freeze", weight: 18 },
                { type: "bomb", weight: 10 },
                { type: "twin", weight: 20 },
                { type: "gun", weight: 20 },
                { type: "pierceHarpoon", weight: 12 },
                { type: "tripleHarpoon", weight: 8 },
                { type: "rapidGun", weight: 7 },
                { type: "stickyHarpoon", weight: 5 }
            ];

            function maybeSpawnPowerUp(x, y, chance = POWERUP.spawnChance) {
                if (challengeType === "no_powerups") return;
                if (Math.random() > chance) return;

                const type = pickWeighted(POWERUP_POOL);

                powerUps.push({
                    x,
                    y,
                    prevY: y,
                    vy: POWERUP.fallSpeed,
                    type,
                    grounded: false,
                    life: POWERUP.life,
                    anim: Math.random() * Math.PI * 2
                });
            }

            function splitBall(ball) {
                const nextSize = ball.size + 1;
                if (nextSize >= BALL_SIZES.length) return;

                const kick = -BALL_BOUNCE_VY[nextSize] * 0.25;
                balls.push(createBall(nextSize, ball.x - 8, ball.y - 4, -1, kick));
                balls.push(createBall(nextSize, ball.x + 8, ball.y - 4, 1, kick));
            }

            function destroyBall(ballIndex, skipHitStop = false) {
                const ball = balls[ballIndex];

                comboCount++;
                comboTimer = COMBO_RESET_TIME;
                if (comboCount >= 2) {
                    comboCallout = `${comboCount}x COMBO`;
                    comboCalloutTimer = 0.7;
                }

                triggerImpactFeedback({
                    flash: 0.12,
                    shake: 0,
                    strength: 0,
                    hitStop: skipHitStop ? 0 : 0.02
                });

                playSound("pop");
                spawnSparkBurst(ball.x, ball.y, 8, 2, 0.22, 340);

                const points = 100 * comboCount;
                score += points;

                spawnPop(ball.x, ball.y, ball.r);
                spawnScore(ball.x, ball.y, points);
                maybeSpawnPowerUp(ball.x, ball.y);

                balls.splice(ballIndex, 1);
                splitBall(ball);
            }

            function breakPlatform(platformIndex) {
                const platform = platforms[platformIndex];
                const cx = platform.x + platform.w / 2;
                const cy = platform.y + platform.h / 2;
                platforms.splice(platformIndex, 1);
                score += 50;
                spawnScore(cx, platform.y, 50);
                spawnParticles(cx, cy, {
                    count: 6,
                    radius: 2.5,
                    life: 0.4,
                    speed: 160,
                    gravity: 320,
                    color: THEME.env.platformBreakEdge
                });
                maybeSpawnPowerUp(cx, platform.y, POWERUP.platformSpawnChance);
            }

            function killPlayer() {
                if (playerDead) return;

                playSound("death");
                triggerImpactFeedback({ flash: 0.2, shake: 0.24, strength: 14, hitStop: 0.05 });
                playerDead = true;
                deathTimer = DEATH_TIME;
                resetWeaponState();
                lives--;
            }

            function startLevelClear() {
                levelClear = true;
                levelClearTimer = LEVEL_CLEAR_TIME;
                comboCallout = "WAVE CLEAR";
                comboCalloutTimer = 1.4;

                playSound("level");

                const timeBonus = Math.ceil(timeLeft) * 10;
                score += timeBonus;
                spawnScore(W / 2, H / 2 + 40, `BONUS ${timeBonus}`);
            }

            const GUN_COOLDOWN_MULT = { gun: 1, rapidGun: 0.45 };

            function fireWeapon() {
                if (weaponType === "gun" || weaponType === "rapidGun") {
                    if (bulletCooldown > 0) return;

                    playSound("shoot");

                    bullets.push({
                        x: player.x - PLAYER.shootOffsetX,
                        y: player.y + PLAYER.shootOffsetY,
                        prevY: player.y + PLAYER.shootOffsetY,
                        vy: BULLET.speedY
                    });
                    bullets.push({
                        x: player.x + PLAYER.shootOffsetX,
                        y: player.y + PLAYER.shootOffsetY,
                        prevY: player.y + PLAYER.shootOffsetY,
                        vy: BULLET.speedY
                    });

                    bulletCooldown = BULLET.cooldown * bulletCooldownFactor * GUN_COOLDOWN_MULT[weaponType];
                    return;
                }

                if (harpoons.length > 0) return;

                playSound("shoot");

                if (weaponType === "twinHarpoon") {
                    harpoons.push(createHarpoon(clamp(player.x - PLAYER.twinHarpoonOffsetX, 6, W - 6)));
                    harpoons.push(createHarpoon(clamp(player.x + PLAYER.twinHarpoonOffsetX, 6, W - 6)));
                    return;
                }

                if (weaponType === "tripleHarpoon") {
                    harpoons.push(createHarpoon(clamp(player.x - PLAYER.twinHarpoonOffsetX, 6, W - 6)));
                    harpoons.push(createHarpoon(player.x));
                    harpoons.push(createHarpoon(clamp(player.x + PLAYER.twinHarpoonOffsetX, 6, W - 6)));
                    return;
                }

                if (weaponType === "pierceHarpoon") {
                    harpoons.push(createHarpoon(player.x, { pierce: true }));
                    return;
                }

                if (weaponType === "stickyHarpoon") {
                    harpoons.push(createHarpoon(player.x, { sticky: true }));
                    return;
                }

                harpoons.push(createHarpoon(player.x));
            }

            function createHarpoon(x, opts = {}) {
                return {
                    x,
                    yTop: FLOOR_Y,
                    prevYTop: FLOOR_Y,
                    yBottom: FLOOR_Y,
                    maxTop: 0,
                    speed: harpoonSpeed,
                    pierce: opts.pierce || false,
                    sticky: opts.sticky || false,
                    stuck: false,
                    stickTimer: 0
                };
            }

            function triggerBomb() {
                if (balls.length === 0) return;

                const newBalls = [];

                for (const ball of balls) {
                    playSound("pop");

                    spawnPop(ball.x, ball.y, ball.r);
                    spawnSparkBurst(ball.x, ball.y, 12, 3, 0.25, 420);

                    // Smallest balls explode completely
                    if (ball.size === SMALLEST_BALL_SIZE) {
                        const points = 100;
                        score += points;
                        spawnScore(ball.x, ball.y, points);
                        continue;
                    }

                    // Larger balls split down to smallest size
                    const splitsNeeded = SMALLEST_BALL_SIZE - ball.size;
                    const count = Math.pow(2, splitsNeeded);

                    for (let i = 0; i < count; i++) {
                        const dir = i % 2 === 0 ? -1 : 1;
                        const spread = (i - (count - 1) / 2) * 14;

                        newBalls.push(
                            createBall(
                                SMALLEST_BALL_SIZE,
                                ball.x + spread,
                                ball.y - 6,
                                dir,
                                -BALL_BOUNCE_VY[SMALLEST_BALL_SIZE] * (0.2 + Math.random() * 0.15)
                            )
                        );
                    }
                }

                balls = newBalls;
            }

            function pointInRect(x, y, rectX, rectY, rectW, rectH) {
                return x >= rectX && x <= rectX + rectW && y >= rectY && y <= rectY + rectH;
            }

            function circleHitsVerticalLine(ball, lineX, topY) {
                return Math.abs(ball.x - lineX) < ball.r && (ball.y + ball.r) > topY;
            }

            function circleIntersectsPlayer(ball) {
                const closestX = Math.max(player.x + PLAYER.collisionLeft, Math.min(ball.x, player.x + PLAYER.collisionRight));
                const closestY = Math.max(player.y + PLAYER.collisionTop, Math.min(ball.y, player.y + PLAYER.collisionBottom));
                const dx = ball.x - closestX;
                const dy = ball.y - closestY;
                const hitR = ball.r * PLAYER_HIT_FORGIVENESS;
                return (dx * dx + dy * dy) < (hitR * hitR);
            }

            function getWeaponLabel() {
                if (weaponType === "gun") return "Wand";
                if (weaponType === "rapidGun") return "Rapid Wand";
                if (weaponType === "twinHarpoon") return "Twin Lance";
                if (weaponType === "tripleHarpoon") return "Triple Lance";
                if (weaponType === "pierceHarpoon") return "Piercing Lance";
                if (weaponType === "stickyHarpoon") return "Sticky Lance";
                return "Lance";
            }

            const POWERUP_LABELS = {
                twin: "TWIN",
                gun: "WAND",
                pierceHarpoon: "PIERCE",
                tripleHarpoon: "TRIPLE",
                rapidGun: "RAPID",
                stickyHarpoon: "STICKY",
                freeze: "FREEZE",
                bomb: "FLASK"
            };

            // --- update ---

            function tick(now) {
                const frameDt = Math.min(0.1, (now - last) / 1000);
                last = now;
                accumulator += frameDt;

                let steps = 0;
                while (accumulator >= FIXED_DT && steps < MAX_STEPS_PER_FRAME) {
                    savePrevPositions();
                    if (hitStopTimer > 0) {
                        updateTimers(FIXED_DT);
                        hitStopTimer = Math.max(0, hitStopTimer - FIXED_DT);
                    } else {
                        simulateStep(FIXED_DT);
                    }
                    accumulator -= FIXED_DT;
                    steps++;
                }

                // Allow up to 2 steps of leftover time so a single late frame
                // doesn't discard simulation time and cause a visible hitch.
                if (accumulator >= FIXED_DT) {
                    accumulator = Math.min(accumulator, 2 * FIXED_DT);
                }

                renderAlpha = accumulator / FIXED_DT;
                draw();
                requestAnimationFrame(tick);
            }

            function savePrevPositions() {
                player.prevX = player.x;
                for (const ball of balls) {
                    ball.prevX = ball.x;
                    ball.prevY = ball.y;
                }
                for (const harpoon of harpoons) {
                    harpoon.prevYTop = harpoon.yTop;
                }
                for (const bullet of bullets) {
                    bullet.prevY = bullet.y;
                }
                for (const pop of pops) {
                    pop.prevX = pop.x;
                    pop.prevY = pop.y;
                }
                for (const popup of scorePopups) {
                    popup.prevY = popup.y;
                }
                for (const powerUp of powerUps) {
                    powerUp.prevY = powerUp.y;
                }
            }

            function simulateStep(dt) {
                updateTimers(dt);
                simulationTime += dt;

                if (gameState === "startup") {
                    updateStartupState();
                    return;
                }

                if (gameState === "gameover") {
                    updateGameOverState();
                    return;
                }

                if (paused && gameState === "playing") return;

                if (playerDead) {
                    updateDeathState(dt);
                    return;
                }

                updateRoundState(dt);
                updatePlatforms(dt);
                updatePlayer(dt);
                updateBalls(dt);
                updatePlayerBallCollision();
                updateHazards(dt);
                updatePowerUps(dt);
                updateBullets(dt);
                updateHarpoons(dt);
                updateEffects(dt);
            }

            function updateTimers(dt) {
                flashTimer = Math.max(0, flashTimer - dt);
                shakeTimer = Math.max(0, shakeTimer - dt);
                stageCardTimer = Math.max(0, stageCardTimer - dt);
                comboCalloutTimer = Math.max(0, comboCalloutTimer - dt);
                weaponCalloutTimer = Math.max(0, weaponCalloutTimer - dt);
                comboTimer = Math.max(0, comboTimer - dt);
                freezeTimer = Math.max(0, freezeTimer - dt);
                invulnTimer = Math.max(0, invulnTimer - dt);
                bulletCooldown = Math.max(0, bulletCooldown - dt);
                startupBlinkTimer += dt;
                if (shakeTimer === 0) shakeStrength = 0;

                if (comboTimer === 0) comboCount = 0;
            }

            function updateGameOverState() {
                if (enteringScore) return;

                if (consumeFirePress()) {
                    startGame();
                }
            }

            function updateDeathState(dt) {
                deathTimer -= dt;
                if (deathTimer <= 0) {
                    if (lives > 0) {
                        resetLevel();
                    } else {
                        if (currentMusicTrack) {
                            currentMusicTrack.pause();
                            currentMusicTrack.currentTime = 0;
                            currentMusicTrack = null;
                        }

                        enteringScore = qualifiesForHighScore();
                        gameState = "gameover";
                    }
                }
            }

            function updateRoundState(dt) {
                if (!levelClear && !playerDead) {
                    const assistFactor = timerAssist ? 0.72 : 1;
                    const challengeFactor = challengeType === "score_attack" ? 1.35 : 1;
                    timeLeft -= dt * TIME_DRAIN_PER_SECOND * assistFactor * challengeFactor;
                    if (timeLeft <= 0) {
                        timeLeft = 0;
                        playerDead = true;
                        deathTimer = DEATH_TIME;
                        resetWeaponState();
                        lives--;
                    }
                }

                if (balls.length === 0 && !levelClear) {
                    startLevelClear();
                }

                if (challengeType === "survive" && !levelClear) {
                    surviveTimer = Math.max(0, surviveTimer - dt);
                    if (surviveTimer <= 0) {
                        startLevelClear();
                    }
                }

                if (levelClear) {
                    levelClearTimer -= dt;
                    if (levelClearTimer <= 0) {
                        levelIndex = (levelIndex + 1) % LEVELS.length;
                        const awardBonusLife = CHAPTER_BONUS_LIFE_INDICES.has(levelIndex);
                        loadLevel(levelIndex);
                        // loadLevel() -> resetLevelState() clears comboCallout, so the
                        // banner has to be set after the level load, not before.
                        if (awardBonusLife) {
                            lives++;
                            playSound("powerup");
                            comboCallout = "EXTRA LIFE!";
                            comboCalloutTimer = 1.6;
                        }
                    }
                }
            }

            function updatePlayer(dt) {
                let dir = 0;
                if (actionState.left) dir -= 1;
                if (actionState.right) dir += 1;

                player.moving = dir !== 0;
                if (dir !== 0) player.facing = dir;
                player.vx = dir * player.speed + levelWind * 0.35;
                player.x += player.vx * dt;
                player.x = clamp(player.x, player.w / 2, W - player.w / 2);

                footstepTimer -= dt;
                if (player.moving && footstepTimer <= 0 && !playerDead) {
                    footstepTimer = 0.16;
                    // drawPlayer() renders the knight at 1.5x scale around
                    // (player.x, player.y), so the on-screen feet sit ~1.5x
                    // further from player.y than the local sprite coordinates
                    // (boots drawn around local y+30) - match that here so
                    // dust spawns at the feet, not the waist.
                    spawnParticles(player.x, player.y + 45, {
                        count: 3,
                        radius: 3.5,
                        life: 0.5,
                        speed: 16,
                        gravity: 0,
                        color: "rgba(212,209,204,0.85)"
                    });
                }

                if (actionState.fire) {
                    fireWeapon();
                }
            }

            function updateBalls(dt) {
                for (const ball of balls) {
                    const prevX = ball.x;
                    const prevY = ball.y;

                    if (freezeTimer <= 0) {
                        if (levelWind !== 0) {
                            ball.vx += levelWind * dt;
                            ball.vx = clamp(ball.vx, -260, 260);
                        }
                        ball.vy += GRAVITY * dt;
                        ball.x += ball.vx * dt;
                        ball.y += ball.vy * dt;
                    }

                    ball.squash = Math.max(0, ball.squash - dt * 8);

                    if (freezeTimer <= 0) {
                        handleBallWallBounce(ball);
                        handleBallPlatformBounce(ball, prevX, prevY);
                        handleBallFloorBounce(ball);
                    }
                }
            }

            function handleBallWallBounce(ball) {
                if (ball.x - ball.r < 0) {
                    ball.x = ball.r;
                    ball.vx *= -1;
                }

                if (ball.x + ball.r > W) {
                    ball.x = W - ball.r;
                    ball.vx *= -1;
                }
            }

            function handleBallPlatformBounce(ball, prevX, prevY) {
                for (const platform of platforms) {
                    if (platform.active === false) continue;
                    const hitHoriz = ball.x + ball.r > platform.x && ball.x - ball.r < platform.x + platform.w;
                    const hitVert = ball.y + ball.r > platform.y && ball.y - ball.r < platform.y + platform.h;

                    if (!hitHoriz || !hitVert) continue;

                    const wasAbove = prevY + ball.r <= platform.y;
                    const wasBelow = prevY - ball.r >= platform.y + platform.h;
                    const wasLeft = prevX + ball.r <= platform.x;
                    const wasRight = prevX - ball.r >= platform.x + platform.w;

                    if (wasAbove) {
                        ball.y = platform.y - ball.r;
                        ball.vy = -BALL_BOUNCE_VY[ball.size];
                        ball.squash = 1;
                    } else if (wasBelow) {
                        ball.y = platform.y + platform.h + ball.r;
                        ball.vy = Math.abs(ball.vy);
                    } else if (wasLeft) {
                        ball.x = platform.x - ball.r;
                        ball.vx = -Math.abs(ball.vx);
                    } else if (wasRight) {
                        ball.x = platform.x + platform.w + ball.r;
                        ball.vx = Math.abs(ball.vx);
                    }
                }
            }

            function handleBallFloorBounce(ball) {
                if (ball.y + ball.r > FLOOR_Y) {
                    ball.y = FLOOR_Y - ball.r;
                    ball.vy = -BALL_BOUNCE_VY[ball.size];
                    ball.squash = 1;
                }
            }

            function updatePlatforms(dt) {
                if (gameState !== "playing") return;
                const time = simulationTime;

                for (const platform of platforms) {
                    platform.x = platform.baseX;
                    platform.y = platform.baseY;
                    platform.active = true;

                    if (platform.move) {
                        const phase = (platform.movePhase || 0) + time * platform.move.speed;
                        const offset = Math.sin(phase) * platform.move.amp;
                        if (platform.move.axis === "x") platform.x = platform.baseX + offset;
                        else platform.y = platform.baseY + offset;
                    }

                    if (platform.gate) {
                        const phase = (time + (platform.gate.phase || 0)) % platform.gate.cycle;
                        platform.active = phase <= platform.gate.cycle * platform.gate.onRatio;
                    }
                }
            }

            function updateHazards() {
                if (playerDead || levelClear || invulnTimer > 0) return;

                for (const strip of hazardStrips) {
                    const active = Math.floor(simulationTime / 0.28) % 2 === 0;
                    strip.active = active;
                    if (!active) continue;

                    if (pointInRect(player.x, player.y + PLAYER.collisionBottom - 2, strip.x, strip.y, strip.w, strip.h)) {
                        killPlayer();
                        return;
                    }
                }
            }

            function updatePlayerBallCollision() {
                if (playerDead || freezeTimer > 0 || invulnTimer > 0) return;

                for (const ball of balls) {
                    if (circleIntersectsPlayer(ball)) {
                        killPlayer();
                        break;
                    }
                }
            }

            function updatePowerUps(dt) {
                for (let i = powerUps.length - 1; i >= 0; i--) {
                    const powerUp = powerUps[i];
                    powerUp.anim = (powerUp.anim || 0) + dt * 4;

                    if (!powerUp.grounded) {
                        powerUp.y += powerUp.vy * dt;

                        if (powerUp.y >= POWERUP.groundY) {
                            powerUp.y = POWERUP.groundY;
                            powerUp.vy = 0;
                            powerUp.grounded = true;
                        }
                    }

                    powerUp.life -= dt;

                    const playerLeft = player.x - PLAYER.pickupHalfWidth;
                    const playerTop = player.y;
                    const playerWidth = PLAYER.pickupHalfWidth * 2;
                    const playerHeight = FLOOR_Y - player.y;

                    if (pointInRect(powerUp.x, powerUp.y, playerLeft, playerTop, playerWidth, playerHeight)) {
                        applyPowerUp(powerUp);
                        powerUps.splice(i, 1);
                        continue;
                    }

                    if (powerUp.life <= 0) {
                        powerUps.splice(i, 1);
                    }
                }
            }

            // Equipping any new weapon clears the current shot in flight -
            // this is what lets picking up a fresh weapon cancel a sticky
            // lance's lockout early, and applies uniformly to every weapon.
            function equipWeapon(type, label, color, powerUp) {
                weaponType = type;
                harpoons = [];
                spawnScore(powerUp.x, powerUp.y, label);
                spawnParticles(powerUp.x, powerUp.y, { count: 8, radius: 2.5, life: 0.35, speed: 200, color });

                // The pickup-site score popup fades in under a second and is easy
                // to miss mid-dodge - back it up with a bigger, longer banner so
                // the player actually registers what they just picked up.
                weaponCallout = `${label.toUpperCase()} EQUIPPED`;
                weaponCalloutTimer = 1.6;
                weaponCalloutColor = color;
            }

            function applyPowerUp(powerUp) {

                if (powerUp.type === "bomb") {
                    playSound("bomb");

                    triggerBomb();
                    score += 200;
                    spawnScore(W / 2, H / 2, "FLASK!");
                    triggerImpactFeedback({ flash: 0.2, shake: 0.24, strength: 16, hitStop: 0.045 });
                    return;
                }

                // normal powerups
                playSound("powerup");

                if (powerUp.type === "twin") {
                    equipWeapon("twinHarpoon", POWERUP_LABELS.twin, THEME.weapon.lanceTip, powerUp);
                    return;
                }

                if (powerUp.type === "gun") {
                    equipWeapon("gun", POWERUP_LABELS.gun, THEME.weapon.boltGlow, powerUp);
                    return;
                }

                if (powerUp.type === "pierceHarpoon") {
                    equipWeapon("pierceHarpoon", POWERUP_LABELS.pierceHarpoon, THEME.weapon.pierceTip, powerUp);
                    return;
                }

                if (powerUp.type === "tripleHarpoon") {
                    equipWeapon("tripleHarpoon", POWERUP_LABELS.tripleHarpoon, THEME.weapon.lanceTip, powerUp);
                    return;
                }

                if (powerUp.type === "rapidGun") {
                    equipWeapon("rapidGun", POWERUP_LABELS.rapidGun, THEME.weapon.boltGlow, powerUp);
                    return;
                }

                if (powerUp.type === "stickyHarpoon") {
                    equipWeapon("stickyHarpoon", POWERUP_LABELS.stickyHarpoon, THEME.weapon.stickyColor, powerUp);
                    return;
                }

                if (powerUp.type === "freeze") {
                    freezeTimer = POWERUP.freezeDuration;
                    spawnScore(powerUp.x, powerUp.y, POWERUP_LABELS.freeze);
                    spawnParticles(powerUp.x, powerUp.y, { count: 8, radius: 2.5, life: 0.35, speed: 200, color: "#67e8f9" });
                }
            }

            function updateBullets(dt) {
                for (let bulletIndex = bullets.length - 1; bulletIndex >= 0; bulletIndex--) {
                    const bullet = bullets[bulletIndex];
                    bullet.y += bullet.vy * dt;

                    if (bullet.y < 0) {
                        bullets.splice(bulletIndex, 1);
                        continue;
                    }

                    if (handleBulletPowerUpCollision(bulletIndex, bullet)) continue;
                    if (handleBulletPlatformCollision(bulletIndex, bullet)) continue;

                    handleBulletBallCollision(bulletIndex, bullet);
                }
            }

            function handleBulletPowerUpCollision(bulletIndex, bullet) {
                for (let powerUpIndex = powerUps.length - 1; powerUpIndex >= 0; powerUpIndex--) {
                    const powerUp = powerUps[powerUpIndex];
                    const dx = powerUp.x - bullet.x;
                    const dy = powerUp.y - bullet.y;
                    const r = 20; // matches the round pickup visuals closely enough

                    if ((dx * dx + dy * dy) < (r * r)) {
                        applyPowerUp(powerUp);
                        powerUps.splice(powerUpIndex, 1);
                        bullets.splice(bulletIndex, 1);
                        return true;
                    }
                }

                return false;
            }

            function handleBulletPlatformCollision(bulletIndex, bullet) {
                for (let platformIndex = platforms.length - 1; platformIndex >= 0; platformIndex--) {
                    const platform = platforms[platformIndex];
                    if (platform.active === false) continue;
                    if (!pointInRect(bullet.x, bullet.y, platform.x, platform.y, platform.w, platform.h)) continue;

                    if (platform.type === "breakable") {
                        breakPlatform(platformIndex);
                    }

                    bullets.splice(bulletIndex, 1);
                    return true;
                }

                return false;
            }

            function handleBulletBallCollision(bulletIndex, bullet) {
                for (let ballIndex = 0; ballIndex < balls.length; ballIndex++) {
                    const ball = balls[ballIndex];
                    const dx = ball.x - bullet.x;
                    const dy = ball.y - bullet.y;
                    const assist = aimAssist ? 8 : 0;

                    if ((dx * dx + dy * dy) < ((ball.r + assist) * (ball.r + assist))) {
                        bullets.splice(bulletIndex, 1);
                        destroyBall(ballIndex, true);
                        return true;
                    }
                }

                return false;
            }

            function updateHarpoons(dt) {
                for (let harpoonIndex = harpoons.length - 1; harpoonIndex >= 0; harpoonIndex--) {
                    const harpoon = harpoons[harpoonIndex];
                    // A harpoon colliding with a weapon powerup mid-loop can
                    // trigger applyPowerUp() -> harpoons = [] (equipping a new
                    // weapon clears the shot in flight), reassigning the array
                    // out from under this iteration - guard against that.
                    if (!harpoon) continue;

                    if (harpoon.stuck) {
                        harpoon.stickTimer -= dt;
                        if (harpoon.stickTimer <= 0) {
                            harpoons.splice(harpoonIndex, 1);
                            continue;
                        }
                        handleHarpoonBallCollision(harpoonIndex, harpoon);
                        continue;
                    }

                    harpoon.yTop -= harpoon.speed * dt;

                    if (harpoon.yTop <= harpoon.maxTop) {
                        harpoon.yTop = harpoon.maxTop;
                    }

                    if (harpoon.yTop <= 0) {
                        if (harpoon.sticky) {
                            harpoon.stuck = true;
                            harpoon.stickTimer = STICKY_HARPOON_DURATION;
                            continue;
                        }
                        harpoons.splice(harpoonIndex, 1);
                        continue;
                    }
                    if (handleHarpoonPowerUpCollision(harpoonIndex, harpoon)) continue;
                    if (handleHarpoonPlatformCollision(harpoonIndex, harpoon)) continue;

                    handleHarpoonBallCollision(harpoonIndex, harpoon);
                }
            }

            function handleHarpoonPowerUpCollision(harpoonIndex, harpoon) {
                for (let powerUpIndex = powerUps.length - 1; powerUpIndex >= 0; powerUpIndex--) {
                    const powerUp = powerUps[powerUpIndex];
                    const r = 20;

                    const withinX = Math.abs(powerUp.x - harpoon.x) < r;
                    const withinY = powerUp.y >= harpoon.yTop && powerUp.y <= harpoon.yBottom;

                    if (withinX && withinY) {
                        applyPowerUp(powerUp);
                        powerUps.splice(powerUpIndex, 1);
                        harpoons.splice(harpoonIndex, 1);
                        return true;
                    }
                }

                return false;
            }

            function handleHarpoonPlatformCollision(harpoonIndex, harpoon) {
                for (let platformIndex = platforms.length - 1; platformIndex >= 0; platformIndex--) {
                    const platform = platforms[platformIndex];
                    if (platform.active === false) continue;
                    const withinX = harpoon.x >= platform.x && harpoon.x <= platform.x + platform.w;
                    const withinY = harpoon.yTop <= platform.y + platform.h && harpoon.yBottom >= platform.y;

                    if (!withinX || !withinY) continue;

                    if (platform.type === "breakable") {
                        breakPlatform(platformIndex);
                    }

                    harpoons.splice(harpoonIndex, 1);
                    return true;
                }

                return false;
            }

            function handleHarpoonBallCollision(harpoonIndex, harpoon) {
                for (let ballIndex = 0; ballIndex < balls.length; ballIndex++) {
                    const ball = balls[ballIndex];
                    const assist = aimAssist ? 6 : 0;
                    const hits = Math.abs(ball.x - harpoon.x) < (ball.r + assist) && (ball.y + ball.r) > harpoon.yTop;
                    if (hits) {
                        if (!harpoon.pierce && !harpoon.stuck) {
                            harpoons.splice(harpoonIndex, 1);
                        }
                        destroyBall(ballIndex);
                        return true;
                    }
                }

                return false;
            }

            function updateEffects(dt) {
                for (let i = pops.length - 1; i >= 0; i--) {
                    const pop = pops[i];
                    pop.life -= dt;

                    if (pop.vx !== undefined) {
                        pop.x += pop.vx * dt;
                        pop.y += pop.vy * dt;
                    }

                    if (pop.life <= 0) {
                        pops.splice(i, 1);
                    }
                }

                for (let i = scorePopups.length - 1; i >= 0; i--) {
                    const popup = scorePopups[i];
                    popup.life -= dt;
                    popup.y -= 40 * dt;

                    if (popup.life <= 0) {
                        scorePopups.splice(i, 1);
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.prevX = p.x;
                    p.prevY = p.y;
                    p.vy += p.gravity * dt;
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.life -= dt;

                    if (p.life <= 0) {
                        particles.splice(i, 1);
                    }
                }
            }

            // --- draw ---

            function draw() {
                // The accessibility hotkey hint (R/C/G/T) and the canvas-drawn
                // credit line only ever need to coexist if both are visible at
                // once; making them mutually exclusive by game state avoids
                // any pixel-level coordination between a fixed-position HTML
                // element and the dynamically-scaled canvas beneath it.
                hintEl.style.display = gameState === "playing" ? "" : "none";

                ctx.save();

                applyScreenShake();
                if (bgCache) {
                    ctx.drawImage(bgCache, 0, 0, W, H);
                } else {
                    drawBackground();
                    drawFloor();
                }
                if (gameState === "playing" || gameState === "startup") {
                    drawAmbientParticles(LEVELS[levelIndex].bg, last / 1000);
                }
                drawHazards();
                drawPlatforms();
                drawPlayer();
                drawPlayerDeathMarker();
                drawHarpoons();
                drawBullets();
                drawBallShadows();
                drawBalls();
                drawPops();
                drawParticles();
                drawScorePopups();
                drawLevelClear();
                drawPowerUps();
                drawComboCallout();
                drawWeaponCallout();
                drawStageCard();
                drawHud();
                drawLives();
                drawScreens();

                ctx.restore();

                drawFlash();
                drawFrame();
                drawBorderText();
            }

            function drawTopScores(x, y) {
                ctx.textAlign = "center";

                ctx.font = "bold 20px system-ui, sans-serif";
                ctx.fillStyle = "#fde68a";
                ctx.fillText("TOP 3", x, y);

                for (let i = 0; i < 3; i++) {
                    const entry = highScores[i];
                    const yy = y + 30 + i * 24;

                    let color = "#e5e7eb";
                    if (i === 0) color = "#fde68a";
                    else if (i === 1) color = "#d1d5db";
                    else if (i === 2) color = "#fdba74";

                    ctx.font = "bold 16px system-ui, sans-serif";
                    ctx.fillStyle = color;

                    if (entry) {
                        const initials = entry.initials ?? entry.Initials;
                        const points = entry.points ?? entry.Points;
                        ctx.fillText(`${i + 1}. ${initials}  ${points}`, x, yy);
                    } else {
                        ctx.fillText(`${i + 1}. ---  0`, x, yy);
                    }
                }

                ctx.textAlign = "left";
            }

            function drawFullScores(x, y) {
                ctx.textAlign = "center";

                ctx.fillStyle = "#fde68a";
                ctx.font = "bold 30px system-ui, sans-serif";
                ctx.fillText("HIGH SCORES", x, y);

                const startY = y + 40;
                const rankX = x - 220;
                const initialsX = x - 110;
                const scoreX = x + 30;
                const levelX = x + 170;

                ctx.textAlign = "left";
                ctx.font = "bold 16px system-ui, sans-serif";
                ctx.fillStyle = THEME.hud.frameInner;
                ctx.fillText("RK", rankX, startY);
                ctx.fillText("NAME", initialsX, startY);
                ctx.fillText("SCORE", scoreX, startY);
                ctx.fillText("LEVEL", levelX, startY);

                for (let i = 0; i < 10; i++) {
                    const entry = highScores[i];
                    const rowY = startY + 30 + i * 24;

                    let color = "#e5e7eb";
                    if (i === 0) color = "#fde68a";
                    else if (i === 1) color = "#d1d5db";
                    else if (i === 2) color = "#fdba74";

                    ctx.fillStyle = "rgba(15, 23, 42, 0.35)";
                    ctx.fillRect(rankX - 12, rowY - 17, 470, 20);

                    ctx.fillStyle = color;
                    ctx.font = "bold 15px system-ui, sans-serif";
                    ctx.fillText(`${i + 1}.`, rankX, rowY);

                    if (entry) {
                        const initials = entry.initials ?? entry.Initials;
                        const points = entry.points ?? entry.Points;
                        const level = entry.level ?? entry.Level;

                        ctx.fillText(initials, initialsX, rowY);
                        ctx.fillText(String(points), scoreX, rowY);
                        ctx.fillText(String(level), levelX, rowY);
                    } else {
                        ctx.fillStyle = "#64748b";
                        ctx.fillText("---", initialsX, rowY);
                        ctx.fillText("0", scoreX, rowY);
                        ctx.fillText("-", levelX, rowY);
                    }
                }

                ctx.textAlign = "left";
            }

            function applyScreenShake() {
                let shakeX = 0;
                let shakeY = 0;

                if (shakeTimer > 0 && !reduceMotion) {
                    const amplitude = Math.max(2, shakeStrength);
                    const t = simulationTime;
                    shakeX = Math.sin(t * 97.3) * amplitude * (shakeTimer / 0.16);
                    shakeY = Math.sin(t * 79.1 + 1.7) * amplitude * (shakeTimer / 0.16);
                }

                ctx.translate(shakeX, shakeY);
            }

            function rebuildBgCache() {
                const oc = document.createElement("canvas");
                oc.width = W;
                oc.height = H;
                const oc_ctx = oc.getContext("2d");
                drawBackground(oc_ctx);
                drawFloor(oc_ctx);
                bgCache = oc;
            }

            // Trunk + overlapping-circle canopy, reused across all three
            // background themes for tree silhouettes.
            function drawTreeSilhouette(c, x, groundY, canopyR, height) {
                c.fillRect(x - 6, groundY - height * 0.4, 12, height * 0.4);
                c.beginPath();
                c.arc(x, groundY - height, canopyR, 0, Math.PI * 2);
                c.arc(x - canopyR * 0.6, groundY - height + canopyR * 0.4, canopyR * 0.7, 0, Math.PI * 2);
                c.arc(x + canopyR * 0.6, groundY - height + canopyR * 0.4, canopyR * 0.7, 0, Math.PI * 2);
                c.fill();
            }

            // Ambient atmosphere (fireflies at night, drifting pollen otherwise).
            // Deliberately a pure function of elapsed time rather than mutable
            // per-particle state, so it stays fully decoupled from the
            // fixed-timestep simulation loop - purely cosmetic, drawn straight
            // onto the live canvas (not cached in bgCache) so it animates.
            function drawAmbientParticles(bg, seconds) {
                if (highContrastMode) return;

                ctx.save();

                if (bg === "night") {
                    ctx.fillStyle = "rgba(190,255,180,0.85)";
                    for (let i = 0; i < 14; i++) {
                        const seed = i * 137.5;
                        const x = (Math.sin(seconds * 0.3 + seed) * 0.5 + 0.5) * W;
                        const y = 60 + (Math.sin(seconds * 0.17 + seed * 1.3) * 0.5 + 0.5) * (FLOOR_Y - 140);
                        const twinkle = Math.max(0, Math.sin(seconds * 2 + seed));
                        ctx.globalAlpha = 0.3 + twinkle * 0.6;
                        ctx.beginPath();
                        ctx.arc(x, y, 1.6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else {
                    ctx.fillStyle = "rgba(255,255,255,0.4)";
                    for (let i = 0; i < 10; i++) {
                        const seed = i * 91.7;
                        const x = ((seconds * 12 + seed * 40) % (W + 40)) - 20;
                        const y = 40 + (Math.sin(seconds * 0.4 + seed) * 0.5 + 0.5) * (FLOOR_Y - 100);
                        ctx.beginPath();
                        ctx.arc(x, y, 1.4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.restore();
            }

            function drawBackground(c = ctx) {
                const bg = LEVELS[levelIndex].bg;
                if (highContrastMode) {
                    c.fillStyle = "#0f172a";
                    c.fillRect(0, 0, W, FLOOR_Y);
                    c.fillStyle = "#1e3a8a";
                    c.fillRect(0, FLOOR_Y - 30, W, 30);
                    return;
                }

                if (bg === "meadow") {
                    c.fillStyle = THEME.env.skyMeadow;
                    c.fillRect(0, 0, W, FLOOR_Y);

                    c.fillStyle = THEME.env.canopyDark;
                    c.beginPath();
                    c.moveTo(0, FLOOR_Y - 90);
                    c.quadraticCurveTo(140, FLOOR_Y - 150, 300, FLOOR_Y - 95);
                    c.quadraticCurveTo(440, FLOOR_Y - 140, 620, FLOOR_Y - 100);
                    c.quadraticCurveTo(760, FLOOR_Y - 130, W, FLOOR_Y - 85);
                    c.lineTo(W, FLOOR_Y);
                    c.lineTo(0, FLOOR_Y);
                    c.closePath();
                    c.fill();

                    c.fillStyle = THEME.env.canopyMid;
                    for (let x = 20; x < W; x += 70) {
                        const bumpY = FLOOR_Y - 95 - Math.sin(x * 0.02) * 30;
                        c.beginPath();
                        c.arc(x, bumpY, 34, 0, Math.PI * 2);
                        c.fill();
                    }

                    c.fillStyle = THEME.env.grassGround;
                    c.fillRect(0, FLOOR_Y - 35, W, 35);
                    return;
                }

                if (bg === "sunset") {
                    const grad = c.createLinearGradient(0, 0, 0, FLOOR_Y);
                    grad.addColorStop(0, "#f97316");
                    grad.addColorStop(0.45, "#fb7185");
                    grad.addColorStop(1, "#7c3aed");
                    c.fillStyle = grad;
                    c.fillRect(0, 0, W, FLOOR_Y);

                    const sunGrad = c.createRadialGradient(W - 140, 100, 0, W - 140, 100, 50);
                    sunGrad.addColorStop(0, "#fffbeb");
                    sunGrad.addColorStop(0.5, "rgba(255,240,150,0.9)");
                    sunGrad.addColorStop(1, "rgba(255,220,120,0)");
                    c.beginPath();
                    c.arc(W - 140, 100, 50, 0, Math.PI * 2);
                    c.fillStyle = sunGrad;
                    c.fill();

                    c.beginPath();
                    c.arc(W - 140, 100, 22, 0, Math.PI * 2);
                    c.fillStyle = "#fff7c2";
                    c.fill();

                    c.fillStyle = THEME.env.canopyDark;
                    drawTreeSilhouette(c, 220, FLOOR_Y, 26, 150);
                    drawTreeSilhouette(c, 560, FLOOR_Y, 34, 190);
                    drawTreeSilhouette(c, 720, FLOOR_Y, 22, 130);

                    c.fillStyle = THEME.env.grassGround;
                    c.fillRect(0, FLOOR_Y - 28, W, 28);
                    return;
                }

                if (bg === "night") {
                    const grad = c.createLinearGradient(0, 0, 0, FLOOR_Y);
                    grad.addColorStop(0, "#020617");
                    grad.addColorStop(1, "#0f172a");
                    c.fillStyle = grad;
                    c.fillRect(0, 0, W, FLOOR_Y);

                    const moonGrad = c.createRadialGradient(W - 120, 90, 0, W - 120, 90, 45);
                    moonGrad.addColorStop(0, "#ffffff");
                    moonGrad.addColorStop(0.55, "rgba(226,232,240,0.55)");
                    moonGrad.addColorStop(1, "rgba(226,232,240,0)");
                    c.beginPath();
                    c.arc(W - 120, 90, 45, 0, Math.PI * 2);
                    c.fillStyle = moonGrad;
                    c.fill();

                    c.beginPath();
                    c.arc(W - 120, 90, 28, 0, Math.PI * 2);
                    c.fillStyle = "#f8fafc";
                    c.fill();

                    c.fillStyle = "rgba(255,255,255,0.8)";
                    for (const [x, y] of BACKGROUND_NIGHT_STARS) {
                        c.fillRect(x, y, 2, 2);
                    }

                    c.fillStyle = "#14251c";
                    c.fillRect(0, FLOOR_Y - 55, W, 55);

                    c.fillStyle = "#0b1a12";
                    for (let x = 10; x < W; x += 60) {
                        drawTreeSilhouette(c, x, FLOOR_Y, 20, 55 + (x % 120 === 0 ? 30 : 10));
                    }
                }
            }

            function drawFloor(c = ctx) {
                c.fillStyle = THEME.env.floorBase;
                c.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);

                const brickW = 28;
                const brickH = 10;

                for (let row = 0; row < Math.ceil((H - FLOOR_Y) / brickH); row++) {
                    for (let col = 0; col < Math.ceil(W / brickW) + 1; col++) {
                        const offset = (row % 2) * (brickW / 2);
                        const x = col * brickW - offset;
                        const y = FLOOR_Y + row * brickH;

                        c.strokeStyle = THEME.env.floorMortar;
                        c.lineWidth = 1;
                        c.strokeRect(x, y, brickW, brickH);
                    }
                }
            }

            function drawHazards() {
                for (const strip of hazardStrips) {
                    const active = strip.active !== false;
                    ctx.fillStyle = active ? "rgba(239,68,68,0.85)" : "rgba(239,68,68,0.25)";
                    ctx.fillRect(strip.x, strip.y, strip.w, strip.h);

                    ctx.strokeStyle = active ? "#fecaca" : "rgba(254,202,202,0.4)";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(strip.x, strip.y, strip.w, strip.h);
                }
            }
