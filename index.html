                            c.closePath();
                            c.fill();
                        }

                        for (let x = 55 - 100; x < W + PARALLAX_MARGIN; x += 100) {
                            const len = 70 + Math.cos(x * 0.04) * 20;
                            c.beginPath();
                            c.moveTo(x - 20, FLOOR_Y);
                            c.lineTo(x + 20, FLOOR_Y);
                            c.lineTo(x, FLOOR_Y - len);
                            c.closePath();
                            c.fill();
                        }

                        c.fillStyle = "#a855f7";
                        drawCrystalCluster(c, 195, FLOOR_Y, 60);
                        drawCrystalCluster(c, 630, FLOOR_Y, 52);
                    }
                    return;
                }

                if (bg === "volcanic") {
                    if (far) {
                        const grad = c.createLinearGradient(0, 0, 0, FLOOR_Y);
                        grad.addColorStop(0, "#1c1917");
                        grad.addColorStop(0.55, "#7c2d12");
                        grad.addColorStop(1, "#ea580c");
                        c.fillStyle = grad;
                        c.fillRect(-PARALLAX_MARGIN, 0, W + PARALLAX_MARGIN * 2, FLOOR_Y);

                        c.fillStyle = "#1c1917";
                        c.beginPath();
                        c.moveTo(W - 260, FLOOR_Y - 40);
                        c.lineTo(W - 150, FLOOR_Y - 190);
                        c.lineTo(W - 40, FLOOR_Y - 40);
                        c.closePath();
                        c.fill();

                        const glowGrad = c.createRadialGradient(W - 150, FLOOR_Y - 190, 0, W - 150, FLOOR_Y - 190, 50);
                        glowGrad.addColorStop(0, "rgba(253,186,116,0.9)");
                        glowGrad.addColorStop(1, "rgba(253,186,116,0)");
                        c.beginPath();
                        c.arc(W - 150, FLOOR_Y - 190, 50, 0, Math.PI * 2);
                        c.fillStyle = glowGrad;
                        c.fill();
                    }

                    if (near) {
                        c.fillStyle = "#0c0a09";
                        c.beginPath();
                        c.moveTo(-PARALLAX_MARGIN, FLOOR_Y - 60);
                        c.lineTo(0, FLOOR_Y - 60);
                        c.lineTo(90, FLOOR_Y - 120);
                        c.lineTo(180, FLOOR_Y - 55);
                        c.lineTo(300, FLOOR_Y - 135);
                        c.lineTo(420, FLOOR_Y - 60);
                        c.lineTo(560, FLOOR_Y - 115);
                        c.lineTo(700, FLOOR_Y - 55);
                        c.lineTo(W, FLOOR_Y - 90);
                        c.lineTo(W + PARALLAX_MARGIN, FLOOR_Y - 60);
                        c.lineTo(W + PARALLAX_MARGIN, FLOOR_Y);
                        c.lineTo(-PARALLAX_MARGIN, FLOOR_Y);
                        c.closePath();
                        c.fill();

                        c.strokeStyle = "#fb923c";
                        c.lineWidth = 3;
                        c.lineCap = "round";
                        for (const [sx, sy, ex, ey] of VOLCANIC_LAVA_CRACKS) {
                            c.beginPath();
                            c.moveTo(sx, sy);
                            c.lineTo(ex, ey);
                            c.stroke();
                        }
                    }
                }
            }

            function drawFloor(c = ctx) {
                const bg = LEVELS[levelIndex].bg;
                if (highContrastMode) {
                    c.fillStyle = "#1e3a8a";
                    c.fillRect(0, FLOOR_Y - 30, W, 30);
                } else if (bg === "meadow") {
                    c.fillStyle = THEME.env.grassGround;
                    c.fillRect(0, FLOOR_Y - 35, W, 35);
                } else if (bg === "sunset") {
                    c.fillStyle = THEME.env.grassGround;
                    c.fillRect(0, FLOOR_Y - 28, W, 28);
                } else if (bg === "night") {
                    c.fillStyle = "#14251c";
                    c.fillRect(0, FLOOR_Y - 55, W, 55);
                } else if (bg === "cliffs") {
                    c.fillStyle = "#78716c";
                    c.fillRect(0, FLOOR_Y - 30, W, 30);
                } else if (bg === "cave") {
                    c.fillStyle = "#1c1917";
                    c.fillRect(0, FLOOR_Y - 40, W, 40);
                } else if (bg === "volcanic") {
                    c.fillStyle = "#1c1917";
                    c.fillRect(0, FLOOR_Y - 45, W, 45);
                    c.fillStyle = "#f97316";
                    c.fillRect(0, FLOOR_Y - 45, W, 4);
                }

                c.fillStyle = THEME.env.floorBase;
                c.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);

                const brickW = 28;
                const brickH = 10;

                for (let row = 0; row < Math.ceil((H - FLOOR_Y) / brickH); row++) {
                    for (let col = 0; col < Math.ceil(W / brickW) + 1; col++) {
                        const offset = (row % 2) * (brickW / 2);
                        const x = col * brickW - offset;
                        const y = FLOOR_Y + row * brickH;

                        c.strokeStyle = THEME.env.floorMortar;
                        c.lineWidth = 1;
                        c.strokeRect(x, y, brickW, brickH);
                    }
                }
            }

            function drawHazards() {
                for (const strip of hazardStrips) {
                    const active = strip.active !== false;
                    ctx.fillStyle = active ? "rgba(239,68,68,0.85)" : "rgba(239,68,68,0.25)";
                    ctx.fillRect(strip.x, strip.y, strip.w, strip.h);

                    ctx.strokeStyle = active ? "#fecaca" : "rgba(254,202,202,0.4)";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(strip.x, strip.y, strip.w, strip.h);
                }
            }

            function drawScreens() {
                if (paused && gameState === "playing") {
                    ctx.fillStyle = "rgba(0,0,0,0.45)";
                    ctx.fillRect(0, 0, W, H);

                    ctx.fillStyle = "#ffffff";
                    ctx.textAlign = "center";

                    ctx.font = "bold 56px system-ui, sans-serif";
                    ctx.fillText("PAUSED", W / 2, H / 2);

                    ctx.font = "20px system-ui, sans-serif";
                    ctx.fillText("Press P to Resume", W / 2, H / 2 + 40);

                    ctx.textAlign = "left";
                }

                if (gameState === "startup") {
                    ctx.fillStyle = "rgba(0,0,0,0.45)";
                    ctx.fillRect(0, 0, W, H);

                    ctx.textAlign = "center";

                    ctx.fillStyle = "#fde68a";
                    ctx.font = "bold 56px system-ui, sans-serif";
                    ctx.fillText("EYES ON STALKS", W / 2, 92);

                    ctx.fillStyle = "#ffffff";
                    ctx.font = "18px system-ui, sans-serif";
                    ctx.fillText("An Eye-Popping Arcade Adventure", W / 2, 122);

                    ctx.fillStyle = THEME.hud.textDim;
                    ctx.font = "18px system-ui, sans-serif";
                    ctx.fillText("Move: A/D or Touch  ·  Fire: Space or Touch", W / 2, 165);

                    ctx.fillStyle = THEME.hud.frameInner;
                    ctx.font = "16px system-ui, sans-serif";
                    ctx.fillText(`Loadout: ${LOADOUTS[selectedLoadoutIndex].name}  (Q/E to change)`, W / 2, 192);

                    if (Math.floor(startupBlinkTimer * 2) % 2 === 0) {
                        ctx.fillStyle = "#ffffff";
                        ctx.font = "bold 30px system-ui, sans-serif";
                        ctx.fillText(startupActionText, W / 2, 240);
                    }

                    ctx.textAlign = "left";
                }

                if (gameState === "gameover") {
                    ctx.fillStyle = "rgba(0,0,0,0.6)";
                    ctx.fillRect(0, 0, W, H);

                    ctx.fillStyle = "#ffffff";
                    ctx.textAlign = "center";

                    ctx.font = "bold 52px system-ui, sans-serif";
                    ctx.fillText("GAME OVER", W / 2, 60);

                    ctx.font = "24px system-ui, sans-serif";
                    ctx.fillText(`Your Score: ${score}`, W / 2, 95);
                    ctx.fillText(`Level Reached: ${levelIndex + 1}`, W / 2, 125);

                    if (crazySdkReady) {
                        ctx.font = "bold 22px system-ui, sans-serif";
                        ctx.fillStyle = "#fde68a";
                        ctx.fillText(adInProgress ? "Loading ad..." : continueActionText, W / 2, 170);
                    }

                    ctx.font = "22px system-ui, sans-serif";
                    ctx.fillStyle = "#ffffff";
                    ctx.fillText(restartActionText, W / 2, H - 28);

                    ctx.textAlign = "left";
                }
            }

            // Covers Lance (1, no tint), Twin (2), Triple (3), and Pierce/Sticky
            // (1, tinted) - one shape, tint matches drawHarpoons()'s convention.
            // scale defaults to the small HUD-row size; falling pickups pass 1.
            function drawHudLanceIcon(count, tint, scale = 0.65) {
                ctx.save();
                ctx.scale(scale, scale);

                const positions = count === 1 ? [0] : count === 2 ? [-10, 10] : [-12, 0, 12];
                for (const ox of positions) {
                    ctx.strokeStyle = tint || THEME.weapon.lanceShaft;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(ox, 14);
                    ctx.lineTo(ox, -8);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(ox, -14);
                    ctx.lineTo(ox - 5, -4);
                    ctx.lineTo(ox + 5, -4);
                    ctx.closePath();
                    ctx.fillStyle = tint || THEME.weapon.lanceTip;
                    ctx.fill();
                }

                ctx.restore();
            }

            function drawHudGunIcon(tint) {
                ctx.save();
                ctx.scale(0.65, 0.65);
                drawGunPowerUp(tint);
                ctx.restore();
            }

            function updateStartupState() {
                if (consumeFirePress()) {
                    startGame();
                }
            }

            function drawPlatforms() {
                for (const platform of platforms) {
                    if (platform.active === false) {
                        ctx.save();
                        ctx.globalAlpha = 0.25;
                        ctx.strokeStyle = THEME.hud.textDim;
                        ctx.lineWidth = 2;
                        ctx.setLineDash([8, 6]);
                        ctx.strokeRect(platform.x, platform.y, platform.w, platform.h);
                        ctx.restore();
                        continue;
                    }
                    const isSolid = platform.type === "solid";
                    let fill = isSolid ? THEME.env.platformSolid : THEME.env.platformBreak;
                    let top = isSolid ? THEME.env.platformSolidHi : THEME.env.platformBreakHi;
                    let edge = isSolid ? THEME.env.platformSolidEdge : THEME.env.platformBreakEdge;

                    if (platform.reinforced) {
                        fill = THEME.env.platformReinforced;
                        top = THEME.env.platformReinforcedHi;
                        edge = THEME.env.platformReinforcedEdge;
                    }

                    const platGrad = ctx.createLinearGradient(0, platform.y, 0, platform.y + platform.h);
                    platGrad.addColorStop(0, top);
                    platGrad.addColorStop(0.35, fill);
                    platGrad.addColorStop(1, edge);
                    ctx.fillStyle = platGrad;
                    ctx.fillRect(platform.x, platform.y, platform.w, platform.h);

                    ctx.fillStyle = top;
                    ctx.fillRect(platform.x + 2, platform.y + 2, platform.w - 4, 4);

                    ctx.fillStyle = edge;
                    ctx.fillRect(platform.x + 2, platform.y + platform.h - 5, platform.w - 4, 3);

                    ctx.lineWidth = 3;
                    ctx.strokeStyle = "rgba(255,255,255,0.85)";
                    ctx.strokeRect(platform.x, platform.y, platform.w, platform.h);

                    ctx.strokeStyle = "rgba(255,255,255,0.18)";
                    ctx.lineWidth = 1;
                    for (let x = platform.x + 24; x < platform.x + platform.w; x += 24) {
                        ctx.beginPath();
                        ctx.moveTo(x, platform.y + 3);
                        ctx.lineTo(x, platform.y + platform.h - 3);
                        ctx.stroke();
                    }

                    if (platform.cracked) {
                        const midY = platform.y + platform.h / 2;
                        ctx.strokeStyle = "rgba(15,23,42,0.75)";
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(platform.x + platform.w * 0.25, platform.y + 2);
                        ctx.lineTo(platform.x + platform.w * 0.35, midY);
                        ctx.lineTo(platform.x + platform.w * 0.22, platform.y + platform.h - 2);
                        ctx.moveTo(platform.x + platform.w * 0.65, platform.y + 2);
                        ctx.lineTo(platform.x + platform.w * 0.58, midY);
                        ctx.lineTo(platform.x + platform.w * 0.72, platform.y + platform.h - 2);
                        ctx.stroke();
                    }
                }
            }

            function drawPlayer() {
                if (playerDead) return;
                if (invulnTimer > 0 && Math.floor(invulnTimer * 10) % 2 === 0) return;

                const px = lerp(player.prevX, player.x, renderAlpha);
                const py = player.y;
                const scale = 1.5;

                ctx.save();
                ctx.translate(px, py);
                ctx.scale(scale, scale);
                ctx.translate(-px, -py);

                if (horseTimer > 0) {
                    drawHorse(px, py, player.moving, player.facing, simulationTime * 16);
                }

                if (!player.moving) {
                    drawIdlePlayer(px, py);
                } else {
                    drawMovingPlayer(px, py);
                }

                ctx.restore();
            }

            // Drawn behind the knight sprite (same local coordinate space,
            // same py+N offsets) when horseTimer is active - the knight's own
            // draw is untouched, its boots just end up resting on the
            // horse's back instead of the ground, which reads fine as
            // "riding" without needing a separate mounted pose.
            function drawHorse(px, py, moving, facing, phase) {
                const bodyCX = px - facing * 2;
                const bodyCY = py + 21;
                const strideA = moving ? Math.sin(phase) * 8 : 0;
                const strideB = moving ? Math.sin(phase + Math.PI) * 8 : 0;

                ctx.strokeStyle = "#1c1917";
                ctx.lineWidth = 3;
                ctx.lineCap = "round";
                for (const [ox, stride] of [[-10, strideA], [-4, strideB], [4, strideA], [10, strideB]]) {
                    ctx.beginPath();
                    ctx.moveTo(bodyCX + ox, bodyCY + 8);
                    ctx.lineTo(bodyCX + ox + stride * 0.4, bodyCY + 20);
                    ctx.stroke();
                }

                ctx.strokeStyle = "#451a03";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(bodyCX - facing * 17, bodyCY - 2);
                ctx.quadraticCurveTo(bodyCX - facing * 26, bodyCY + 6, bodyCX - facing * 22, bodyCY + 16);
                ctx.stroke();

                const bodyGrad = ctx.createLinearGradient(bodyCX, bodyCY - 9, bodyCX, bodyCY + 9);
                bodyGrad.addColorStop(0, "#b45309");
                bodyGrad.addColorStop(1, "#78350f");
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.ellipse(bodyCX, bodyCY, 17, 9, 0, 0, Math.PI * 2);
                ctx.fill();

                const neckBaseX = bodyCX + facing * 14;
                const headX = neckBaseX + facing * 10;
                const headY = bodyCY - 18;

                ctx.fillStyle = "#92400e";
                ctx.beginPath();
                ctx.moveTo(neckBaseX - facing * 4, bodyCY - 8);
                ctx.lineTo(neckBaseX + facing * 4, bodyCY - 10);
                ctx.lineTo(headX + facing * 3, headY + 4);
                ctx.lineTo(headX - facing * 4, headY + 6);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.ellipse(headX, headY, 6, 4.5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.ellipse(headX + facing * 6, headY + 2, 3.5, 2.5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(headX - facing * 1, headY - 4);
                ctx.lineTo(headX - facing * 3, headY - 9);
                ctx.lineTo(headX + facing * 1, headY - 5);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = "#451a03";
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(headX - facing * 2, headY - 3);
                ctx.lineTo(neckBaseX, bodyCY - 9);
                ctx.stroke();
            }

            // Shared knight sprite used by the idle/moving player poses and by
            // the HUD lives icons (previously three separate copies of the
            // same body/head/hat/boots primitives).
            function drawKnightSprite(px, py, moving, facing) {
                const k = THEME.knight;
                const bodyW = moving ? 14 : 16;
                const bodyX = px - bodyW / 2;

                const armorGrad = ctx.createLinearGradient(bodyX, py + 10, bodyX + bodyW, py + 28);
                armorGrad.addColorStop(0, k.armorHi);
                armorGrad.addColorStop(0.5, k.armor);
                armorGrad.addColorStop(1, k.armorLo);
                ctx.fillStyle = armorGrad;
                ctx.fillRect(bodyX, py + 10, bodyW, 18);

                ctx.fillStyle = k.trim;
                ctx.fillRect(bodyX, py + 17, bodyW, 3);

                ctx.fillStyle = k.skin;
                ctx.beginPath();
                ctx.arc(px, py + 6, 7, 0, Math.PI * 2);
                ctx.fill();

                const helmetGrad = ctx.createRadialGradient(px - 3, py, 1, px, py + 3, 9);
                helmetGrad.addColorStop(0, "#f1f5f9");
                helmetGrad.addColorStop(0.5, k.helmet);
                helmetGrad.addColorStop(1, k.armorLo);
                ctx.fillStyle = helmetGrad;
                ctx.beginPath();
                ctx.arc(px, py + 3, 8, Math.PI, 0);
                ctx.fill();

                // Cheek guards hang down from the helmet's edge to flank the
                // face, instead of a horizontal brim (which read as a
                // rice-paddy hat rather than a knight's helm).
                ctx.fillStyle = k.helmet;
                ctx.fillRect(px - 8, py + 2, 3, 8);
                ctx.fillRect(px + 5, py + 2, 3, 8);

                ctx.fillStyle = k.armorLo;
                ctx.fillRect(px - 1, py + 1, 2, 7);

                ctx.fillStyle = "rgba(255,255,255,0.7)";
                ctx.beginPath();
                ctx.ellipse(px - 3, py, 2, 1.2, -0.4, 0, Math.PI * 2);
                ctx.fill();

                // Plume as a tall curved crest running front-to-back over the
                // dome, like a Spartan-style helm crest - reads as "knight"
                // much more clearly than the old small flat triangle did.
                ctx.fillStyle = k.plume;
                ctx.beginPath();
                ctx.moveTo(px - 2, py - 4);
                ctx.quadraticCurveTo(px - 3, py - 13, px, py - 15);
                ctx.quadraticCurveTo(px + 3, py - 13, px + 2, py - 4);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = k.boots;
                ctx.fillRect(px - 7, py + 28, 6, 4);
                ctx.fillRect(px + 1, py + 28, 6, 4);

                ctx.strokeStyle = k.outline;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(px - 3, py + 14);
                ctx.lineTo(px - 3, py + 24);
                ctx.moveTo(px + 3, py + 14);
                ctx.lineTo(px + 3, py + 24);
                ctx.stroke();

                if (moving) {
                    ctx.fillStyle = k.skin;
                    if (facing === 1) {
                        ctx.fillRect(px + 5, py + 5, 3, 2);
                    } else {
                        ctx.fillRect(px - 8, py + 5, 3, 2);
                    }

                    ctx.strokeStyle = k.helmet;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(px, py + 16);
                    ctx.lineTo(px + (facing * 12), py + 14);
                    ctx.stroke();
                }
            }

            function drawIdlePlayer(px, py) {
                drawKnightSprite(px, py, false, player.facing);
            }

            function drawMovingPlayer(px, py) {
                drawKnightSprite(px, py, true, player.facing);
            }

            function drawPlayerDeathMarker() {
                if (!playerDead) return;

                const px = lerp(player.prevX, player.x, renderAlpha);
                const py = player.y;
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(px - 12, py + 4);
                ctx.lineTo(px + 12, py + 28);
                ctx.moveTo(px + 12, py + 4);
                ctx.lineTo(px - 12, py + 28);
                ctx.stroke();
            }

            function drawHarpoons() {
                for (const harpoon of harpoons) {
                    if (harpoon.stuck && harpoon.stickTimer < STICKY_HARPOON_FLICKER_AT) {
                        const visible = Math.floor(harpoon.stickTimer * 10) % 2 === 0;
                        if (!visible) continue;
                    }

                    const yTop = lerp(harpoon.prevYTop, harpoon.yTop, renderAlpha);
                    const tint = harpoon.sticky ? THEME.weapon.stickyColor
                        : harpoon.pierce ? THEME.weapon.pierceTip
                        : null;

                    ctx.strokeStyle = tint || THEME.weapon.lanceShaft;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(harpoon.x, harpoon.yBottom);
                    ctx.lineTo(harpoon.x, yTop + 6);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(harpoon.x, yTop - 6);
                    ctx.lineTo(harpoon.x - 5, yTop + 6);
                    ctx.lineTo(harpoon.x + 5, yTop + 6);
                    ctx.closePath();
                    ctx.fillStyle = tint || THEME.weapon.lanceTip;
                    ctx.fill();
                }
            }

            function drawBullets() {
                for (const bullet of bullets) {
                    const by = lerp(bullet.prevY, bullet.y, renderAlpha);

                    ctx.fillStyle = THEME.weapon.boltCore;
                    ctx.beginPath();
                    ctx.ellipse(bullet.x, by - 4, 3, 7, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = THEME.weapon.boltGlow;
                    ctx.beginPath();
                    ctx.ellipse(bullet.x, by - 9, 1.5, 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawBallShadows() {
                for (const ball of balls) {
                    const bx = lerp(ball.prevX, ball.x, renderAlpha);
                    const by = lerp(ball.prevY, ball.y, renderAlpha);
                    const groundDist = FLOOR_Y - (by + ball.r);
                    const t = Math.max(0, Math.min(1, 1 - groundDist / 260));

                    const shadowW = ball.r * (0.5 + t * 0.5);
                    const shadowH = ball.r * 0.2 * (0.35 + t * 0.65);
                    const alpha = 0.14 + t * 0.32;

                    ctx.beginPath();
                    ctx.ellipse(bx, FLOOR_Y - 4, shadowW, shadowH, 0, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0,0,0,${alpha})`;
                    ctx.fill();
                }
            }

            function drawBonusEntity() {
                if (!bonusEntity) return;
                const e = bonusEntity;
                const x = lerp(e.prevX, e.x, renderAlpha);
                const y = lerp(e.prevY, e.y, renderAlpha);

                ctx.save();
                ctx.translate(x, y);

                const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 32);
                glow.addColorStop(0, "rgba(253,224,71,0.35)");
                glow.addColorStop(1, "rgba(253,224,71,0)");
                ctx.beginPath();
                ctx.arc(0, 0, 32, 0, Math.PI * 2);
                ctx.fillStyle = glow;
                ctx.fill();

                const flapScale = 0.5 + Math.abs(Math.sin(e.t * 14)) * 0.5;
                ctx.fillStyle = "rgba(224,242,254,0.75)";
                for (const side of [-1, 1]) {
                    ctx.beginPath();
                    ctx.ellipse(side * 12, -2, 10, 5 * flapScale, side * -0.4, 0, Math.PI * 2);
                    ctx.fill();
                }

                const bodyGrad = ctx.createRadialGradient(-5, -5, 2, 0, 0, BONUS_ENTITY_RADIUS);
                bodyGrad.addColorStop(0, "#fffbeb");
                bodyGrad.addColorStop(0.5, "#fbbf24");
                bodyGrad.addColorStop(1, "#b45309");
                ctx.beginPath();
                ctx.arc(0, 0, BONUS_ENTITY_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = bodyGrad;
                ctx.fill();
                ctx.strokeStyle = "#78350f";
                ctx.lineWidth = 2;
                ctx.stroke();

                for (const side of [-1, 1]) {
                    ctx.beginPath();
                    ctx.arc(side * 6, -2, 3.5, 0, Math.PI * 2);
                    ctx.fillStyle = "#fefce8";
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(side * 6 + side, -1, 2, 0, Math.PI * 2);
                    ctx.fillStyle = "#422006";
                    ctx.fill();
                }

                ctx.restore();
            }

            // A single stalk, not a pair of legs - two thin dark limbs read as
            // insect/spider legs, which was the creepy part. One thicker green
            // stem stays upright, only leaning gently with horizontal motion
            // (like it's trailing in the air) and compressing briefly on
            // landing - no per-ball flailing, which looked too busy/samey.
            function drawBallStalk(ball) {
                const r = ball.r;
                const hopT = ball.squash;
                const lean = clamp(ball.vx * 0.0015, -0.35, 0.35);

                const baseX = 0;
                const baseY = r * 0.9;
                const stalkLen = r * (0.85 - hopT * 0.3);
                const tipX = baseX + Math.sin(lean) * stalkLen;
                const tipY = baseY + Math.cos(lean) * stalkLen;
                const midX = (baseX + tipX) / 2 + Math.sin(lean) * stalkLen * 0.2;
                const midY = (baseY + tipY) / 2;
                const width = Math.max(4, r * 0.22) * (1 - hopT * 0.25);

                ctx.lineCap = "round";

                // Dark outline pass first so the stalk reads clearly against
                // the green grass instead of blending into it.
                ctx.strokeStyle = "#14532d";
                ctx.lineWidth = width + 3;
                ctx.beginPath();
                ctx.moveTo(baseX, baseY);
                ctx.quadraticCurveTo(midX, midY, tipX, tipY);
                ctx.stroke();

                ctx.strokeStyle = "#22c55e";
                ctx.lineWidth = width;
                ctx.beginPath();
                ctx.moveTo(baseX, baseY);
                ctx.quadraticCurveTo(midX, midY, tipX, tipY);
                ctx.stroke();

                ctx.fillStyle = "#4ade80";
                ctx.strokeStyle = "#14532d";
                ctx.lineWidth = 1.5;
                for (const side of [-1, 1]) {
                    ctx.beginPath();
                    ctx.ellipse(midX + side * r * 0.22, midY + r * 0.04, r * 0.2, r * 0.09, side * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }
            }

            function drawBalls() {
                for (const ball of balls) {
                    const bx = lerp(ball.prevX, ball.x, renderAlpha);
                    const by = lerp(ball.prevY, ball.y, renderAlpha);
                    const stretch = Math.max(0, -ball.vy * 0.0008);
                    const squashX = 1 + ball.squash * 0.18 - stretch * 0.15;
                    const squashY = 1 - ball.squash * 0.18 + stretch * 0.3;
                    const tierColor = THEME.slimeTiers[ball.size] ?? THEME.slimeTiers[THEME.slimeTiers.length - 1];

                    ctx.save();
                    ctx.translate(bx, by);

                    drawBallStalk(ball);

                    ctx.save();
                    ctx.scale(squashX, squashY);

                    if (!isTouchDevice) {
                        ctx.shadowBlur = 12;
                        ctx.shadowColor = "rgba(20, 83, 45, 0.4)";
                    }

                    // Flat sclera fill, not a lit/shaded gradient - a shaded
                    // glossy ball reads as a real eyeball/marble instead of a
                    // toy. A single small highlight patch (drawn after the
                    // rim below) does the "cartoon shiny" job instead.
                    ctx.beginPath();
                    ctx.arc(0, 0, ball.r, 0, Math.PI * 2);
                    ctx.fillStyle = "#ffffff";
                    ctx.fill();

                    if (freezeTimer > 0 && shouldShowFrozenOverlay()) {
                        ctx.beginPath();
                        ctx.arc(0, 0, ball.r, 0, Math.PI * 2);
                        ctx.fillStyle = "rgba(180, 240, 255, 0.28)";
                        ctx.fill();
                    }

                    ctx.shadowBlur = 0;

                    // Bold dark cartoon outline, with a thinner tier-color
                    // ring just inside it so size is still readable.
                    ctx.lineWidth = 5 / Math.max(squashX, squashY);
                    ctx.strokeStyle = "#1e293b";
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(0, 0, ball.r - 3.5 / Math.max(squashX, squashY), 0, Math.PI * 2);
                    ctx.lineWidth = 2.5 / Math.max(squashX, squashY);
                    ctx.strokeStyle = tierColor;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.ellipse(-ball.r * 0.4, -ball.r * 0.45, ball.r * 0.22, ball.r * 0.12, -0.6, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
                    ctx.fill();

                    // One big eye tracking the player, rather than two small ones
                    // on a face - the creature IS the eye now, not a blob with one.
                    const lookDx = player.x - bx;
                    const lookDy = (player.y + PLAYER.height * 0.5) - by;
                    const lookDist = Math.hypot(lookDx, lookDy) || 1;

                    const irisR = ball.r * 0.52;
                    const pupilR = irisR * 0.42;
                    const lookRange = (ball.r - irisR) * 0.7;
                    const lookX = (lookDx / lookDist) * lookRange;
                    const lookY = (lookDy / lookDist) * lookRange;

                    let eyeOpen = 1;
                    if (ball.blinkTimer <= 0) {
                        const t = Math.min(1, -ball.blinkTimer / BLINK_DURATION);
                        eyeOpen = Math.abs(t - 0.5) * 2;
                    }

                    ctx.save();
                    ctx.translate(lookX, lookY);
                    ctx.scale(1, Math.max(0.05, eyeOpen));

                    // Flat colors and no outline between iris/pupil - a dark
                    // ring around the iris is literally the "limbal ring"
                    // trick used to make a drawn eye look photoreal, so it
                    // stayed too realistic even after flattening the shading.
                    // A big plain pupil dominating a thin color ring reads
                    // as a toy/googly-eye instead.
                    ctx.beginPath();
                    ctx.arc(0, 0, irisR, 0, Math.PI * 2);
                    ctx.fillStyle = tierColor;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(0, 0, pupilR * 1.6, 0, Math.PI * 2);
                    ctx.fillStyle = THEME.slime.eyePupil;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(-irisR * 0.3, -irisR * 0.32, irisR * 0.22, 0, Math.PI * 2);
                    ctx.fillStyle = "#ffffff";
                    ctx.fill();

                    ctx.restore();
                    ctx.restore();
                    ctx.restore();
                }
            }

            function shouldShowFrozenOverlay() {
                if (freezeTimer >= 2) return true;
                return Math.floor(freezeTimer * 10) % 2 === 0;
            }

            function drawPops() {
                for (const pop of pops) {
                    const t = pop.life / (pop.spark ? 0.22 : POP_DURATION);
                    const px = lerp(pop.prevX ?? pop.x, pop.x, renderAlpha);
                    const py = lerp(pop.prevY ?? pop.y, pop.y, renderAlpha);

                    if (pop.spark) {
                        ctx.beginPath();
                        ctx.arc(px, py, pop.r + (1 - t) * 1.5, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(134,239,172,${t})`;
                        ctx.fill();
                    } else {
                        const rr = pop.r * (1.2 - t * 0.4);

                        ctx.beginPath();
                        ctx.arc(px, py, rr, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(74,222,128,${t})`;
                        ctx.lineWidth = 3;
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(px, py, rr * 0.6, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(22,101,52,${t * 0.8})`;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                }
            }

            function drawParticles() {
                for (const p of particles) {
                    const t = Math.max(0, p.life / p.maxLife);
                    const px = lerp(p.prevX, p.x, renderAlpha);
                    const py = lerp(p.prevY, p.y, renderAlpha);

                    ctx.globalAlpha = t;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(px, py, p.r * t, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            function drawScorePopups() {
                for (const popup of scorePopups) {
                    const py = lerp(popup.prevY ?? popup.y, popup.y, renderAlpha);
                    ctx.fillStyle = `rgba(255,255,180,${popup.life})`;
                    ctx.font = "bold 18px system-ui, sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(popup.value, popup.x, py);
                }
                ctx.textAlign = "left";
            }

            function drawLevelClear() {
                if (!levelClear) return;

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 44px system-ui, sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("LEVEL CLEAR", W / 2, H / 2 - 14);

                ctx.fillStyle = "#bbf7d0";
                ctx.font = "bold 22px system-ui, sans-serif";
                ctx.fillText(`Wave ${levelIndex + 1}: ${LEVELS[levelIndex].name}`, W / 2, H / 2 + 20);

                ctx.fillStyle = "#fde68a";
                ctx.font = "bold 24px system-ui, sans-serif";
                ctx.fillText(`TIME BONUS ${Math.ceil(timeLeft) * 10}`, W / 2, H / 2 + 54);

                ctx.textAlign = "left";
            }

            function drawComboCallout() {
                if (comboCalloutTimer <= 0) return;
                const alpha = Math.min(1, comboCalloutTimer / 0.7);
                ctx.fillStyle = `rgba(253, 224, 71, ${alpha})`;
                ctx.font = "bold 28px system-ui, sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(comboCallout, W / 2, H * 0.36);
                ctx.textAlign = "left";
            }

            function drawWeaponCallout() {
                if (weaponCalloutTimer <= 0) return;
                const alpha = Math.min(1, weaponCalloutTimer / 0.4);
                ctx.font = "bold 26px system-ui, sans-serif";
                ctx.textAlign = "center";

                ctx.lineWidth = 4;
                ctx.strokeStyle = `rgba(15, 23, 42, ${alpha * 0.8})`;
                ctx.strokeText(weaponCallout, W / 2, H * 0.44);

                ctx.fillStyle = weaponCalloutColor;
                ctx.globalAlpha = alpha;
                ctx.fillText(weaponCallout, W / 2, H * 0.44);
                ctx.globalAlpha = 1;

                ctx.textAlign = "left";
            }

            function drawStageCard() {
                if (stageCardTimer <= 0 || gameState !== "playing" || levelClear) return;
                const alpha = Math.min(1, stageCardTimer / 0.45);
                const level = LEVELS[levelIndex];
                const challengeLabels = {
                    score_attack: "Score Attack",
                    survive: "Survive Wave",
                    no_powerups: "No Powerups"
                };
                const chapter = getChapterName(levelIndex);

                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = "rgba(2, 6, 23, 0.55)";
                ctx.fillRect(W / 2 - 220, 70, 440, 84);
                ctx.strokeStyle = THEME.hud.frameInner;
                ctx.lineWidth = 2;
                ctx.strokeRect(W / 2 - 220, 70, 440, 84);

                ctx.textAlign = "center";
                ctx.fillStyle = THEME.hud.gold;
                ctx.font = "bold 30px system-ui, sans-serif";
                ctx.fillText(`Wave ${levelIndex + 1}: ${level.name}`, W / 2, 106);

                ctx.fillStyle = THEME.hud.textDim;
                ctx.font = "bold 16px system-ui, sans-serif";
                const windText = levelWind === 0 ? "" : ` · Wind ${levelWind > 0 ? "→" : "←"}`;
                const challengeText = challengeType ? challengeLabels[challengeType] : "Standard";
                ctx.fillText(`${chapter} · ${challengeText}${windText}`, W / 2, 132);
                ctx.restore();
                ctx.textAlign = "left";
            }

            function drawPowerUps() {
                for (const powerUp of powerUps) {
                    if (powerUp.life < 3) {
                        const blinkOn = Math.floor(powerUp.life * 8) % 2 === 0;
                        if (!blinkOn) continue;
                    }

                    ctx.save();
                    ctx.translate(powerUp.x, lerp(powerUp.prevY ?? powerUp.y, powerUp.y, renderAlpha) + Math.sin(powerUp.anim || 0) * 2);
                    ctx.beginPath();
                    ctx.arc(0, 0, 26, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255,255,255,0.08)";
                    ctx.fill();

                    drawPowerUpIcon(powerUp.type);

                    ctx.restore();
                }

                ctx.textAlign = "left";
            }

            function drawPowerUpIcon(type) {
                if (type === "freeze") {
                    drawFreezePowerUp();
                } else if (type === "bomb") {
                    drawFlaskPowerUp();
                } else if (type === "gun") {
                    drawGunPowerUp(null);
                } else if (type === "rapidGun") {
                    drawGunPowerUp(THEME.weapon.rapidTint);
                } else if (type === "twin") {
                    drawHudLanceIcon(2, null, 1);
                } else if (type === "tripleHarpoon") {
                    drawHudLanceIcon(3, null, 1);
                } else if (type === "pierceHarpoon") {
                    drawHudLanceIcon(1, THEME.weapon.pierceTip, 1);
                } else if (type === "stickyHarpoon") {
                    drawHudLanceIcon(1, THEME.weapon.stickyColor, 1);
                }
            }

            // tint set => Rapid Blaster: same shape, cyan instead of purple,
            // plus extra speed-lines trailing the shaft so it doesn't just
            // look like a recolored Blaster at a glance.
            function drawGunPowerUp(tint) {
                ctx.save();

                // blaster shaft
                ctx.strokeStyle = THEME.weapon.lanceShaft;
                ctx.lineWidth = 4;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(-10, 14);
                ctx.lineTo(6, -10);
                ctx.stroke();
                ctx.lineCap = "butt";

                // glowing tip
                ctx.fillStyle = tint || THEME.weapon.boltGlow;
                ctx.beginPath();
                ctx.arc(9, -14, 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = tint ? "#ffffff" : THEME.weapon.boltCore;
                ctx.beginPath();
                ctx.arc(9, -14, 4, 0, Math.PI * 2);
                ctx.fill();

                // sparkle accents
                ctx.strokeStyle = tint || THEME.weapon.boltGlow;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(9, -25);
                ctx.lineTo(9, -21);
                ctx.moveTo(-3, -14);
                ctx.lineTo(1, -14);
                ctx.moveTo(15, -7);
                ctx.lineTo(19, -7);
                ctx.stroke();

                if (tint) {
                    ctx.beginPath();
                    ctx.moveTo(-14, 12);
                    ctx.lineTo(-19, 17);
                    ctx.moveTo(-7, 7);
                    ctx.lineTo(-12, 12);
                    ctx.stroke();
                }

                ctx.restore();
            }

            function drawFlaskPowerUp() {
                ctx.save();

                ctx.fillStyle = "#78350f";
                ctx.fillRect(-4, -22, 8, 5);
                ctx.fillStyle = THEME.hud.gold;
                ctx.fillRect(-3, -18, 6, 8);

                ctx.beginPath();
                ctx.moveTo(-3, -10);
                ctx.lineTo(3, -10);
                ctx.lineTo(11, 8);
                ctx.quadraticCurveTo(11, 16, 0, 16);
                ctx.quadraticCurveTo(-11, 16, -11, 8);
                ctx.closePath();

                const grad = ctx.createLinearGradient(0, -10, 0, 16);
                grad.addColorStop(0, "rgba(249,115,22,0.35)");
                grad.addColorStop(1, THEME.weapon.flaskLiquid);
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.strokeStyle = "rgba(255,255,255,0.75)";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = "rgba(255,255,255,0.65)";
                ctx.beginPath();
                ctx.arc(-3, 6, 2, 0, Math.PI * 2);
                ctx.arc(3, 10, 1.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            function drawFreezePowerUp() {
                ctx.fillStyle = "#67e8f9";
                ctx.beginPath();
                ctx.arc(0, 0, 20, 0, Math.PI * 2);
                ctx.fill();

                ctx.lineWidth = 3;
                ctx.strokeStyle = "rgba(255,255,255,0.95)";
                ctx.stroke();

                ctx.strokeStyle = "#083344";
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, -6);
                ctx.moveTo(0, 0);
                ctx.lineTo(5, 2);
                ctx.stroke();

                ctx.strokeStyle = "#e0f2fe";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-14, 0);
                ctx.lineTo(-18, 0);
                ctx.moveTo(14, 0);
                ctx.lineTo(18, 0);
                ctx.moveTo(0, -14);
                ctx.lineTo(0, -18);
                ctx.moveTo(0, 14);
                ctx.lineTo(0, 18);
                ctx.stroke();
            }

            function drawHud() {
                if (gameState !== "playing") return;

                const x = 24;
                const y = 34;
                const gap = 26;
                const labelColor = THEME.hud.text;
                const valueColor = "#ffffff";

                ctx.save();

                function row(i, label, value, color = valueColor) {
                    const yy = y + i * gap;

                    ctx.font = "bold 12px system-ui, sans-serif";
                    ctx.fillStyle = labelColor;
                    ctx.fillText(label, x, yy);

                    ctx.font = "bold 16px system-ui, sans-serif";
                    ctx.fillStyle = color;
                    ctx.fillText(value, x + 78, yy);
                }

                let rowIndex = 0;
                row(rowIndex++, "SCORE", String(score), "#fde047");
                row(rowIndex++, "LEVEL", LEVELS[levelIndex].name);
                row(rowIndex++, "CHAPTER", getChapterName(levelIndex).split("·")[1].trim(), THEME.hud.frameInner);
                if (challengeType === "survive") {
                    row(rowIndex++, "SURVIVE", `${surviveTimer.toFixed(1)}s`, "#67e8f9");
                }

                {
                    let timeColor = "#86efac";
                    if (timeLeft <= 20) timeColor = "#fbbf24";
                    if (timeLeft <= 10) timeColor = "#fb7185";
                    row(rowIndex++, "TIME", String(Math.ceil(timeLeft)), timeColor);
                }

                {
                    const yy = y + gap * rowIndex;

                    ctx.font = "bold 12px system-ui, sans-serif";
                    ctx.fillStyle = labelColor;
                    ctx.fillText("WEAPON", x, yy);

                    ctx.font = "bold 16px system-ui, sans-serif";
                    ctx.fillStyle = "#ffffff";
                    ctx.fillText(getWeaponLabel(), x + 78, yy);

                    const iconX = x + 210;
                    const iconY = yy - 2;

                    ctx.save();
                    ctx.translate(iconX, iconY);

                    if (weaponType === "gun") {
                        drawHudGunIcon(null);
                    } else if (weaponType === "rapidGun") {
                        drawHudGunIcon(THEME.weapon.rapidTint);
                    } else if (weaponType === "twinHarpoon") {
                        drawHudLanceIcon(2, null);
                    } else if (weaponType === "tripleHarpoon") {
                        drawHudLanceIcon(3, null);
                    } else if (weaponType === "pierceHarpoon") {
                        drawHudLanceIcon(1, THEME.weapon.pierceTip);
                    } else if (weaponType === "stickyHarpoon") {
                        drawHudLanceIcon(1, THEME.weapon.stickyColor);
                    } else {
                        drawHudLanceIcon(1, null);
                    }

                    ctx.restore();
                }

                // Both status rows share this counter (rather than each
                // hard-coding rowIndex+1.1) so freeze and horse stack
                // cleanly under WEAPON instead of overlapping if both happen
                // to be active at once.
                let statusRow = 1;

                if (freezeTimer > 0) {
                    const shouldDraw = freezeTimer >= 2 || Math.floor(freezeTimer * 10) % 2 === 0;
                    if (shouldDraw) {
                        const yy = y + gap * (rowIndex + statusRow + 0.1);

                        ctx.font = "bold 12px system-ui, sans-serif";
                        ctx.fillStyle = labelColor;
                        ctx.fillText("FREEZE", x, yy);

                        ctx.save();
                        ctx.translate(x + 86, yy - 4);
                        ctx.scale(0.45, 0.45);
                        drawFreezePowerUp();
                        ctx.restore();

                        ctx.font = "bold 16px system-ui, sans-serif";
                        ctx.fillStyle = "#67e8f9";
                        ctx.fillText(`${freezeTimer.toFixed(1)}s`, x + 124, yy);
                    }
                    statusRow++;
                }

                if (horseTimer > 0) {
                    const yy = y + gap * (rowIndex + statusRow + 0.1);

                    ctx.font = "bold 12px system-ui, sans-serif";
                    ctx.fillStyle = labelColor;
                    ctx.fillText("HORSE", x, yy);

                    ctx.save();
                    ctx.translate(x + 86, yy - 4);
                    ctx.scale(0.4, 0.4);
                    drawHorse(0, -21, false, 1, 0);
                    ctx.restore();

                    ctx.font = "bold 16px system-ui, sans-serif";
                    ctx.fillStyle = "#d97706";
                    ctx.fillText(`${horseTimer.toFixed(1)}s`, x + 124, yy);
                    statusRow++;
                }

                ctx.restore();
            }

            function drawLives() {
                if (gameState !== "playing") return;

                const startX = W - 34;
                const y = 26;
                const spacing = 26;
                const scale = 0.75;

                ctx.save();

                for (let i = 0; i < lives; i++) {
                    const px = startX - i * spacing;
                    const py = y;

                    ctx.save();
                    ctx.translate(px, py);
                    ctx.scale(scale, scale);
                    ctx.translate(-px, -py);

                    drawKnightSprite(px, py, false, 1);

                    ctx.restore();
                }

                if (lives === 0) {
                    ctx.font = "bold 16px system-ui, sans-serif";
                    ctx.fillStyle = "#ffffff";
                    ctx.fillText("0", W - 28, 42);
                }

                ctx.restore();
            }

            function drawFlash() {
                if (flashTimer <= 0) return;

                const alpha = flashTimer / 0.18;
                ctx.fillStyle = `rgba(255,255,255,${alpha * 0.35})`;
                ctx.fillRect(0, 0, W, H);
            }

            function drawFrame() {
                ctx.lineWidth = BORDER;
                ctx.strokeStyle = THEME.hud.frameOuter;
                ctx.strokeRect(BORDER / 2, BORDER / 2, W - BORDER, H - BORDER);

                ctx.lineWidth = 3;
                ctx.strokeStyle = THEME.hud.frameInner;
                ctx.strokeRect(BORDER, BORDER, W - BORDER * 2, H - BORDER * 2);
            }

            function drawBorderText() {
                if (gameState !== "startup" && gameState !== "gameover") return;

                ctx.save();
                ctx.textAlign = "center";
                ctx.font = "12px system-ui, sans-serif";
                ctx.fillStyle = THEME.hud.text;
                ctx.fillText("© Datahandler Games", W / 2, H - BORDER - 4);
                ctx.restore();
            }

            bindTouchControl(touchButtons.left, "left");
            bindTouchControl(touchButtons.right, "right");
            bindTouchControl(touchButtons.fire, "fire");

            touchAdButton?.addEventListener("pointerdown", (event) => {
                event.preventDefault();
                requestContinueAd();
            });

            let lastTouchStart = 0;
            addEventListener("touchstart", (event) => {
                if (!event.cancelable || event.touches.length !== 1) return;
                const now = performance.now();
                if (now - lastTouchStart < 350) {
                    event.preventDefault();
                }
                lastTouchStart = now;
            }, { passive: false, capture: true });

            addEventListener("touchmove", (event) => {
                if (!event.cancelable) return;
                if (event.touches.length > 1) {
                    event.preventDefault();
                }
            }, { passive: false, capture: true });

            addEventListener("gesturestart", (event) => {
                if (event.cancelable) event.preventDefault();
            }, { passive: false, capture: true });

            addEventListener("gesturechange", (event) => {
                if (event.cancelable) event.preventDefault();
            }, { passive: false, capture: true });

            addEventListener("gestureend", (event) => {
                if (event.cancelable) event.preventDefault();
            }, { passive: false, capture: true });

            addEventListener("dblclick", (event) => {
                if (event.cancelable) event.preventDefault();
            }, { capture: true });

            addEventListener("resize", resizeCanvasToViewport);
            addEventListener("orientationchange", resizeCanvasToViewport);
            document.addEventListener("visibilitychange", () => {
                if (!document.hidden) {
                    last = performance.now();
                    accumulator = 0;
                }
            });
            resizeCanvasToViewport();
            rebuildBgCache();
            notifyLoadingStop();
            requestAnimationFrame(tick);
        })();
    </script>
</body>

</html>
