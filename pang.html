                {
                    name: "Arcade Panic",
                    bg: "night",
                    balls: [
                        { size: 1, x: 160, y: 90, dir: 1 },
                        { size: 2, x: 300, y: 130, dir: -1 },
                        { size: 3, x: 450, y: 190, dir: 1 },
                        { size: 2, x: 600, y: 130, dir: 1 },
                        { size: 1, x: 740, y: 90, dir: -1 }
                    ],
                    platforms: [
                        { x: 140, y: 260, w: 150, h: 16, type: "solid" },
                        { x: 375, y: 215, w: 150, h: 16, type: "breakable" },
                        { x: 610, y: 260, w: 150, h: 16, type: "solid" }
                    ]
                }
            ];

            const BACKGROUND_NIGHT_STARS = [
                [80, 60], [160, 110], [240, 70], [320, 130], [420, 55],
                [520, 95], [610, 60], [730, 120], [810, 75]
            ];

            const ACTION_KEYS = {
                left: new Set(["ArrowLeft", "KeyA"]),
                right: new Set(["ArrowRight", "KeyD"]),
                fire: new Set(["Space"])
            };

            // --- input ---
            const pressedKeys = new Set();
            const actionState = {
                left: false,
                right: false,
                fire: false
            };

            addEventListener("keydown", (e) => {
                if (gameState === "gameover" && enteringScore) {
                    if (e.code === "Tab") {
                        e.preventDefault();
                        initialsIndex = (initialsIndex + (e.shiftKey ? 2 : 1)) % 3;
                        return;
                    }

                    if (e.code === "Backspace") {
                        e.preventDefault();
                        initials[initialsIndex] = "A";
                        if (initialsIndex > 0) initialsIndex--;
                        return;
                    }

                    if (e.code === "ArrowLeft") {
                        e.preventDefault();
                        initialsIndex = Math.max(0, initialsIndex - 1);
                        return;
                    }

                    if (e.code === "ArrowRight") {
                        e.preventDefault();
                        initialsIndex = Math.min(2, initialsIndex + 1);
                        return;
                    }

                    if (e.code === "ArrowUp") {
                        e.preventDefault();
                        const c = initials[initialsIndex].charCodeAt(0);
                        initials[initialsIndex] = c >= 90 ? "A" : String.fromCharCode(c + 1);
                        return;
                    }

                    if (e.code === "ArrowDown") {
                        e.preventDefault();
                        const c = initials[initialsIndex].charCodeAt(0);
                        initials[initialsIndex] = c <= 65 ? "Z" : String.fromCharCode(c - 1);
                        return;
                    }

                    if (/^[a-zA-Z]$/.test(e.key)) {
                        e.preventDefault();
                        initials[initialsIndex] = e.key.toUpperCase();
                        if (initialsIndex < 2) initialsIndex++;
                        return;
                    }

                    if (e.code === "Enter" || e.code === "Space") {
                        e.preventDefault();
                        submitScore();
                        enteringScore = false;
                        return;
                    }
                }

                if (e.code === "KeyP") {
                    paused = !paused;
                    return;
                }

                if (e.code === "KeyM") {
                    musicMuted = !musicMuted;
                    for (const track of Object.values(musicTracks)) {
                        track.muted = musicMuted;
                    }
                    return;
                }

                if (e.code === "KeyS") {
                    sfxMuted = !sfxMuted;
                    return;
                }

                if (isHandledKey(e.code)) e.preventDefault();
                pressedKeys.add(e.code);
                updateActionState();
            });

            addEventListener("keyup", (e) => {
                pressedKeys.delete(e.code);
                updateActionState();
            });

            function isHandledKey(code) {
                return ACTION_KEYS.left.has(code) ||
                    ACTION_KEYS.right.has(code) ||
                    ACTION_KEYS.fire.has(code);
            }

            function updateActionState() {
                actionState.left = hasAnyKey(ACTION_KEYS.left);
                actionState.right = hasAnyKey(ACTION_KEYS.right);
                actionState.fire = hasAnyKey(ACTION_KEYS.fire);
            }

            function hasAnyKey(keySet) {
                for (const code of keySet) {
                    if (pressedKeys.has(code)) return true;
                }
                return false;
            }

            function consumeFirePress() {
                if (!actionState.fire) return false;

                for (const code of ACTION_KEYS.fire) {
                    pressedKeys.delete(code);
                }

                updateActionState();
                return true;
            }

            // --- entities ---
            const player = {
                w: PLAYER.width,
                h: PLAYER.height,
                x: W * 0.5,
                y: FLOOR_Y - 48,
                vx: 0,
                speed: PLAYER.speed,
                facing: 1,
                moving: false
            };

            function createBall(size, x, y, dir = 1, vy = 0) {
                return {
                    size,
                    r: BALL_SIZES[size],
                    x,
                    y,
                    vx: BALL_VX[size] * dir,
                    vy,
                    squash: 0
                };
            }

            // --- game state ---
            let balls = [];
            let pops = [];
            let harpoons = [];
            let scorePopups = [];
            let platforms = [];
            let powerUps = [];
            let bullets = [];
            let highScores = [];

            let gameState = "startup";
            let startupBlinkTimer = 0;
            let score = 0;
            let comboTimer = 0;
            let comboCount = 0;
            let lives = 3;
            let levelClear = false;
            let levelClearTimer = 0;
            let playerDead = false;
            let deathTimer = 0;
            let levelIndex = 0;
            let timeLeft = START_TIME;
            let currentMusicTrack = null;

            let weaponType = "harpoon";
            let harpoonSpeed = 900;
            let bulletCooldown = 0;

            let flashTimer = 0;
            let shakeTimer = 0;
            let freezeTimer = 0;

            let last = performance.now();
            let musicMuted = false;
            let sfxMuted = false;
            let paused = false;

            let sessionToken = null;
            let enteringScore = false;
            let initials = ["A", "A", "A"];
            let initialsIndex = 0;
            let scoreSubmitted = false;

            // --- helpers ---

            async function loadHighScores() {
                try {
                    const res = await fetch("/scores");
                    if (!res.ok) return;
                    highScores = await res.json();
                } catch {
                    highScores = [];
                }
            }

            async function startScoreSession() {
                try {
                    const res = await fetch("/session");
                    if (!res.ok) {
                        sessionToken = null;
                        return;
                    }

                    const data = await res.json();
                    sessionToken = data.token;
                } catch {
                    sessionToken = null;
                }
            }

            async function submitScore() {
                if (!sessionToken || scoreSubmitted) return;

                try {
                    const res = await fetch("/scores", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-Game-Token": sessionToken
                        },
                        body: JSON.stringify({
                            initials: initials.join(""),
                            points: score,
                            level: levelIndex + 1
                        })
                    });

                    if (res.ok) {
                        highScores = await res.json();
                        scoreSubmitted = true;
                    }
                } catch {
                    // ignore for now
                }
            }

            function qualifiesForHighScore() {
                if (highScores.length < 10) return true;

                const last = highScores[highScores.length - 1];
                const lastPoints = last.points ?? last.Points ?? 0;
                const lastLevel = last.level ?? last.Level ?? 0;

                return score > lastPoints || (score === lastPoints && (levelIndex + 1) > lastLevel);
            }

            function clamp(value, min, max) {
                return Math.max(min, Math.min(max, value));
            }

            function playSound(sound) {
                if (sfxMuted) return;
                sound.currentTime = 0;
                sound.play();
            }

            function resetWeaponState() {
                weaponType = "harpoon";
                harpoonSpeed = 900;
                bulletCooldown = 0;
                bullets = [];
                harpoons = [];
            }

            function resetRunState() {
                score = 0;
                lives = 3;
                levelIndex = 0;
                resetWeaponState();
                freezeTimer = 0;
                gameState = "playing";
            }

            function resetLevelState() {
                resetWeaponState();
                powerUps = [];
                pops = [];
                scorePopups = [];

                player.x = W * 0.5;
                playerDead = false;
                deathTimer = 0;
                levelClear = false;
                levelClearTimer = 0;
                timeLeft = START_TIME;
                freezeTimer = 0;
            }

            async function startGame() {
                await startScoreSession();

                enteringScore = false;
                initials = ["A", "A", "A"];
                initialsIndex = 0;
                scoreSubmitted = false;

                resetRunState();
                loadLevel(levelIndex);
            }

            function resetLevel() {
                loadLevel(levelIndex);
            }

            function playLevelMusic() {
                const bg = LEVELS[levelIndex].bg;
                const track = musicTracks[bg];

                if (currentMusicTrack === track) return;

                if (currentMusicTrack) {
                    currentMusicTrack.pause();
                    currentMusicTrack.currentTime = 0;
                }

                currentMusicTrack = track;
                currentMusicTrack.play();
            }

            function loadLevel(index) {
                const level = LEVELS[index];

                balls = level.balls.map(ball => createBall(ball.size, ball.x, ball.y, ball.dir));
                platforms = (level.platforms || []).map(platform => ({ ...platform }));

                playLevelMusic();

                resetLevelState();
            }

            function spawnPop(x, y, r) {
                pops.push({
                    x,
                    y,
                    r,
                    life: POP_DURATION
                });
            }

            function spawnScore(x, y, value) {
                scorePopups.push({
                    x,
                    y,
                    value,
                    life: SCORE_POPUP_LIFE
                });
            }

            function spawnSparkBurst(x, y, count, radius, life, speed) {
                for (let i = 0; i < count; i++) {
                    pops.push({
                        x,
                        y,
                        r: radius,
                        life,
                        vx: (Math.random() - 0.5) * speed,
                        vy: (Math.random() - 0.5) * speed,
                        spark: true
                    });
                }
            }

            function maybeSpawnPowerUp(x, y) {
                if (Math.random() > POWERUP.spawnChance) return;

                const roll = Math.random();
                let type;

                if (roll < 0.30) type = "freeze";
                else if (roll < 0.55) type = "twin";
                else if (roll < 0.80) type = "gun";
                else type = "bomb";

                powerUps.push({
                    x,
                    y,
                    vy: POWERUP.fallSpeed,
                    type,
                    grounded: false,
                    life: POWERUP.life,
                    anim: Math.random() * Math.PI * 2
                });
            }

            function splitBall(ball) {
                const nextSize = ball.size + 1;
                if (nextSize >= BALL_SIZES.length) return;

                const kick = -BALL_BOUNCE_VY[nextSize] * 0.25;
                balls.push(createBall(nextSize, ball.x - 8, ball.y - 4, -1, kick));
                balls.push(createBall(nextSize, ball.x + 8, ball.y - 4, 1, kick));
            }

            function destroyBall(ballIndex) {
                const ball = balls[ballIndex];

                comboCount++;
                comboTimer = COMBO_RESET_TIME;

                playSound(sounds.pop);
                spawnSparkBurst(ball.x, ball.y, 8, 2, 0.22, 340);

                const points = 100 * comboCount;
                score += points;

                spawnPop(ball.x, ball.y, ball.r);
                spawnScore(ball.x, ball.y, points);
                maybeSpawnPowerUp(ball.x, ball.y);

                balls.splice(ballIndex, 1);
                splitBall(ball);
            }

            function breakPlatform(platformIndex) {
                const platform = platforms[platformIndex];
                platforms.splice(platformIndex, 1);
                score += 50;
                spawnScore(platform.x + platform.w / 2, platform.y, 50);
            }

            function killPlayer() {
                if (playerDead) return;

                playSound(sounds.death);
                playerDead = true;
                deathTimer = DEATH_TIME;
                resetWeaponState();
                lives--;
            }

            function startLevelClear() {
                levelClear = true;
                levelClearTimer = LEVEL_CLEAR_TIME;

                playSound(sounds.level);

                const timeBonus = Math.ceil(timeLeft) * 10;
                score += timeBonus;
                spawnScore(W / 2, H / 2 + 40, `BONUS ${timeBonus}`);
            }

            function fireWeapon() {
                if (weaponType === "gun") {
                    if (bulletCooldown > 0) return;

                    playSound(sounds.shoot);

                    bullets.push({
                        x: player.x - PLAYER.shootOffsetX,
                        y: player.y + PLAYER.shootOffsetY,
                        vy: BULLET.speedY
                    });
                    bullets.push({
                        x: player.x + PLAYER.shootOffsetX,
                        y: player.y + PLAYER.shootOffsetY,
                        vy: BULLET.speedY
                    });

                    bulletCooldown = BULLET.cooldown;
                    return;
                }

                if (harpoons.length > 0) return;

                playSound(sounds.shoot);

                if (weaponType === "twinHarpoon") {
                    harpoons.push(createHarpoon(clamp(player.x - PLAYER.twinHarpoonOffsetX, 6, W - 6)));
                    harpoons.push(createHarpoon(clamp(player.x + PLAYER.twinHarpoonOffsetX, 6, W - 6)));
                    return;
                }

                harpoons.push(createHarpoon(player.x));
            }

            function createHarpoon(x) {
                return {
                    x,
                    yTop: FLOOR_Y,
                    yBottom: FLOOR_Y,
                    maxTop: 0,
                    speed: harpoonSpeed
                };
            }

            function triggerBomb() {
                if (balls.length === 0) return;

                const newBalls = [];

                for (const ball of balls) {
                    playSound(sounds.pop);

                    spawnPop(ball.x, ball.y, ball.r);
                    spawnSparkBurst(ball.x, ball.y, 12, 3, 0.25, 420);

                    // Smallest balls explode completely
                    if (ball.size === SMALLEST_BALL_SIZE) {
                        const points = 100;
                        score += points;
                        spawnScore(ball.x, ball.y, points);
                        continue;
                    }

                    // Larger balls split down to smallest size
                    const splitsNeeded = SMALLEST_BALL_SIZE - ball.size;
                    const count = Math.pow(2, splitsNeeded);

                    for (let i = 0; i < count; i++) {
                        const dir = i % 2 === 0 ? -1 : 1;
                        const spread = (i - (count - 1) / 2) * 14;

                        newBalls.push(
                            createBall(
                                SMALLEST_BALL_SIZE,
                                ball.x + spread,
                                ball.y - 6,
                                dir,
                                -BALL_BOUNCE_VY[SMALLEST_BALL_SIZE] * (0.2 + Math.random() * 0.15)
                            )
                        );
                    }
                }

                balls = newBalls;
            }

            function pointInRect(x, y, rectX, rectY, rectW, rectH) {
                return x >= rectX && x <= rectX + rectW && y >= rectY && y <= rectY + rectH;
            }

            function circleHitsVerticalLine(ball, lineX, topY) {
                return Math.abs(ball.x - lineX) < ball.r && (ball.y + ball.r) > topY;
            }

            function circleIntersectsPlayer(ball) {
                const closestX = Math.max(player.x + PLAYER.collisionLeft, Math.min(ball.x, player.x + PLAYER.collisionRight));
                const closestY = Math.max(player.y + PLAYER.collisionTop, Math.min(ball.y, player.y + PLAYER.collisionBottom));
                const dx = ball.x - closestX;
                const dy = ball.y - closestY;
                return (dx * dx + dy * dy) < (ball.r * ball.r);
            }

            function getWeaponLabel() {
                if (weaponType === "gun") return "Gun";
                if (weaponType === "twinHarpoon") return "Twin Harpoon";
                return "Harpoon";
            }

            // --- update ---

            function tick(now) {
                const dt = Math.min(0.033, (now - last) / 1000);
                last = now;

                updateTimers(dt);

                if (gameState === "startup") {
                    updateStartupState();
                    draw();
                    requestAnimationFrame(tick);
                    return;
                }

                if (gameState === "gameover") {
                    updateGameOverState();
                    draw();
                    requestAnimationFrame(tick);
                    return;
                }

                if (paused && gameState === "playing") {
                    draw();
                    requestAnimationFrame(tick);
                    return;
                }

                if (playerDead) {
                    updateDeathState(dt);
                    draw();
                    requestAnimationFrame(tick);
                    return;
                }

                updateRoundState(dt);
                updatePlayer(dt);
                updateBalls(dt);
                updatePlayerBallCollision();
                updatePowerUps(dt);
                updateBullets(dt);
                updateHarpoons(dt);
                updateEffects(dt);

                draw();
                requestAnimationFrame(tick);
            }

            function updateTimers(dt) {
                flashTimer = Math.max(0, flashTimer - dt);
                shakeTimer = Math.max(0, shakeTimer - dt);
                comboTimer = Math.max(0, comboTimer - dt);
                freezeTimer = Math.max(0, freezeTimer - dt);
                bulletCooldown = Math.max(0, bulletCooldown - dt);
                startupBlinkTimer += dt;

                if (comboTimer === 0) comboCount = 0;
            }

            function updateGameOverState() {
                if (enteringScore) return;

                if (consumeFirePress()) {
                    startGame();
                }
            }

            function updateDeathState(dt) {
                deathTimer -= dt;
                if (deathTimer <= 0) {
                    if (lives > 0) {
                        resetLevel();
                    } else {
                        if (currentMusicTrack) {
                            currentMusicTrack.pause();
                            currentMusicTrack.currentTime = 0;
                            currentMusicTrack = null;
                        }

                        enteringScore = qualifiesForHighScore();
                        gameState = "gameover";
                    }
                }
            }

            function updateRoundState(dt) {
                if (!levelClear && !playerDead) {
                    timeLeft -= dt * TIME_DRAIN_PER_SECOND;
                    if (timeLeft <= 0) {
                        timeLeft = 0;
                        playerDead = true;
                        deathTimer = DEATH_TIME;
                        resetWeaponState();
                        lives--;
                    }
                }

                if (balls.length === 0 && !levelClear) {
                    startLevelClear();
                }

                if (levelClear) {
                    levelClearTimer -= dt;
                    if (levelClearTimer <= 0) {
                        levelIndex = (levelIndex + 1) % LEVELS.length;
                        loadLevel(levelIndex);
                    }
                }
            }

            function updatePlayer(dt) {
                let dir = 0;
                if (actionState.left) dir -= 1;
                if (actionState.right) dir += 1;

                player.moving = dir !== 0;
                if (dir !== 0) player.facing = dir;
                player.vx = dir * player.speed;
                player.x += player.vx * dt;
                player.x = clamp(player.x, player.w / 2, W - player.w / 2);

                if (actionState.fire) {
                    fireWeapon();
                }
            }

            function updateBalls(dt) {
                for (const ball of balls) {
                    const prevX = ball.x;
                    const prevY = ball.y;

                    if (freezeTimer <= 0) {
                        ball.vy += GRAVITY * dt;
                        ball.x += ball.vx * dt;
                        ball.y += ball.vy * dt;
                    }

                    ball.squash = Math.max(0, ball.squash - dt * 8);

                    if (freezeTimer <= 0) {
                        handleBallWallBounce(ball);
                        handleBallPlatformBounce(ball, prevX, prevY);
                        handleBallFloorBounce(ball);
                    }
                }
            }

            function handleBallWallBounce(ball) {
                if (ball.x - ball.r < 0) {
                    ball.x = ball.r;
                    ball.vx *= -1;
                }

                if (ball.x + ball.r > W) {
                    ball.x = W - ball.r;
                    ball.vx *= -1;
                }
            }

            function handleBallPlatformBounce(ball, prevX, prevY) {
                for (const platform of platforms) {
                    const hitHoriz = ball.x + ball.r > platform.x && ball.x - ball.r < platform.x + platform.w;
                    const hitVert = ball.y + ball.r > platform.y && ball.y - ball.r < platform.y + platform.h;

                    if (!hitHoriz || !hitVert) continue;

                    const wasAbove = prevY + ball.r <= platform.y;
                    const wasBelow = prevY - ball.r >= platform.y + platform.h;
                    const wasLeft = prevX + ball.r <= platform.x;
                    const wasRight = prevX - ball.r >= platform.x + platform.w;

                    if (wasAbove) {
                        ball.y = platform.y - ball.r;
                        ball.vy = -BALL_BOUNCE_VY[ball.size];
                        ball.squash = 1;
                    } else if (wasBelow) {
                        ball.y = platform.y + platform.h + ball.r;
                        ball.vy = Math.abs(ball.vy);
                    } else if (wasLeft) {
                        ball.x = platform.x - ball.r;
                        ball.vx = -Math.abs(ball.vx);
                    } else if (wasRight) {
                        ball.x = platform.x + platform.w + ball.r;
                        ball.vx = Math.abs(ball.vx);
                    }
                }
            }

            function handleBallFloorBounce(ball) {
                if (ball.y + ball.r > FLOOR_Y) {
                    ball.y = FLOOR_Y - ball.r;
                    ball.vy = -BALL_BOUNCE_VY[ball.size];
                    ball.squash = 1;
                }
            }

            function updatePlayerBallCollision() {
                if (playerDead || freezeTimer > 0) return;

                for (const ball of balls) {
                    if (circleIntersectsPlayer(ball)) {
                        killPlayer();
                        break;
                    }
                }
            }

            function updatePowerUps(dt) {
                for (let i = powerUps.length - 1; i >= 0; i--) {
                    const powerUp = powerUps[i];
                    powerUp.anim = (powerUp.anim || 0) + dt * 4;

                    if (!powerUp.grounded) {
                        powerUp.y += powerUp.vy * dt;

                        if (powerUp.y >= POWERUP.groundY) {
                            powerUp.y = POWERUP.groundY;
                            powerUp.vy = 0;
                            powerUp.grounded = true;
                        }
                    }

                    powerUp.life -= dt;

                    const playerLeft = player.x - PLAYER.pickupHalfWidth;
                    const playerTop = player.y;
                    const playerWidth = PLAYER.pickupHalfWidth * 2;
                    const playerHeight = FLOOR_Y - player.y;

                    if (pointInRect(powerUp.x, powerUp.y, playerLeft, playerTop, playerWidth, playerHeight)) {
                        applyPowerUp(powerUp);
                        powerUps.splice(i, 1);
                        continue;
                    }

                    if (powerUp.life <= 0) {
                        powerUps.splice(i, 1);
                    }
                }
            }

            function applyPowerUp(powerUp) {

                if (powerUp.type === "bomb") {
                    playSound(sounds.bomb);

                    triggerBomb();
                    score += 200;
                    spawnScore(W / 2, H / 2, "BOMB!");
                    flashTimer = 0.18;
                    shakeTimer = 0.22;
                    return;
                }

                // normal powerups
                playSound(sounds.powerup);

                if (powerUp.type === "twin") {
                    weaponType = "twinHarpoon";
                    spawnScore(powerUp.x, powerUp.y, "TWIN");
                    return;
                }

                if (powerUp.type === "gun") {
                    weaponType = "gun";
                    spawnScore(powerUp.x, powerUp.y, "GUN");
                    return;
                }

                if (powerUp.type === "freeze") {
                    freezeTimer = POWERUP.freezeDuration;
                    spawnScore(powerUp.x, powerUp.y, "FREEZE");
                }
            }

            function updateBullets(dt) {
                for (let bulletIndex = bullets.length - 1; bulletIndex >= 0; bulletIndex--) {
                    const bullet = bullets[bulletIndex];
                    bullet.y += bullet.vy * dt;

                    if (bullet.y < 0) {
                        bullets.splice(bulletIndex, 1);
                        continue;
                    }

                    if (handleBulletPowerUpCollision(bulletIndex, bullet)) continue;
                    if (handleBulletPlatformCollision(bulletIndex, bullet)) continue;

                    handleBulletBallCollision(bulletIndex, bullet);
                }
            }

            function handleBulletPowerUpCollision(bulletIndex, bullet) {
                for (let powerUpIndex = powerUps.length - 1; powerUpIndex >= 0; powerUpIndex--) {
                    const powerUp = powerUps[powerUpIndex];
                    const dx = powerUp.x - bullet.x;
                    const dy = powerUp.y - bullet.y;
                    const r = 20; // matches the round pickup visuals closely enough

                    if ((dx * dx + dy * dy) < (r * r)) {
                        applyPowerUp(powerUp);
                        powerUps.splice(powerUpIndex, 1);
                        bullets.splice(bulletIndex, 1);
                        return true;
                    }
                }

                return false;
            }

            function handleBulletPlatformCollision(bulletIndex, bullet) {
                for (let platformIndex = platforms.length - 1; platformIndex >= 0; platformIndex--) {
                    const platform = platforms[platformIndex];
                    if (!pointInRect(bullet.x, bullet.y, platform.x, platform.y, platform.w, platform.h)) continue;

                    if (platform.type === "breakable") {
                        breakPlatform(platformIndex);
                    }

                    bullets.splice(bulletIndex, 1);
                    return true;
                }

                return false;
            }

            function handleBulletBallCollision(bulletIndex, bullet) {
                for (let ballIndex = 0; ballIndex < balls.length; ballIndex++) {
                    const ball = balls[ballIndex];
                    const dx = ball.x - bullet.x;
                    const dy = ball.y - bullet.y;

                    if ((dx * dx + dy * dy) < (ball.r * ball.r)) {
                        bullets.splice(bulletIndex, 1);
                        destroyBall(ballIndex);
                        return true;
                    }
                }

                return false;
            }

            function updateHarpoons(dt) {
                for (let harpoonIndex = harpoons.length - 1; harpoonIndex >= 0; harpoonIndex--) {
                    const harpoon = harpoons[harpoonIndex];
                    harpoon.yTop -= harpoon.speed * dt;

                    if (harpoon.yTop <= harpoon.maxTop) {
                        harpoon.yTop = harpoon.maxTop;
                    }

                    if (harpoon.yTop <= 0) {
                        harpoons.splice(harpoonIndex, 1);
                        continue;
                    }
                    if (handleHarpoonPowerUpCollision(harpoonIndex, harpoon)) continue;
                    if (handleHarpoonPlatformCollision(harpoonIndex, harpoon)) continue;

                    handleHarpoonBallCollision(harpoonIndex, harpoon);
                }
            }

            function handleHarpoonPowerUpCollision(harpoonIndex, harpoon) {
                for (let powerUpIndex = powerUps.length - 1; powerUpIndex >= 0; powerUpIndex--) {
                    const powerUp = powerUps[powerUpIndex];
                    const r = 20;

                    const withinX = Math.abs(powerUp.x - harpoon.x) < r;
                    const withinY = powerUp.y >= harpoon.yTop && powerUp.y <= harpoon.yBottom;

                    if (withinX && withinY) {
                        applyPowerUp(powerUp);
                        powerUps.splice(powerUpIndex, 1);
                        harpoons.splice(harpoonIndex, 1);
                        return true;
                    }
                }

                return false;
            }

            function handleHarpoonPlatformCollision(harpoonIndex, harpoon) {
                for (let platformIndex = platforms.length - 1; platformIndex >= 0; platformIndex--) {
                    const platform = platforms[platformIndex];
                    const withinX = harpoon.x >= platform.x && harpoon.x <= platform.x + platform.w;
                    const withinY = harpoon.yTop <= platform.y + platform.h && harpoon.yBottom >= platform.y;

                    if (!withinX || !withinY) continue;

                    if (platform.type === "breakable") {
                        breakPlatform(platformIndex);
                    }

                    harpoons.splice(harpoonIndex, 1);
                    return true;
                }

                return false;
            }

            function handleHarpoonBallCollision(harpoonIndex, harpoon) {
                for (let ballIndex = 0; ballIndex < balls.length; ballIndex++) {
                    const ball = balls[ballIndex];

                    if (circleHitsVerticalLine(ball, harpoon.x, harpoon.yTop)) {
                        harpoons.splice(harpoonIndex, 1);
                        destroyBall(ballIndex);
                        return true;
                    }
                }

                return false;
            }

            function updateEffects(dt) {
                for (let i = pops.length - 1; i >= 0; i--) {
                    const pop = pops[i];
                    pop.life -= dt;

                    if (pop.vx !== undefined) {
                        pop.x += pop.vx * dt;
                        pop.y += pop.vy * dt;
                    }

                    if (pop.life <= 0) {
                        pops.splice(i, 1);
                    }
                }

                for (let i = scorePopups.length - 1; i >= 0; i--) {
                    const popup = scorePopups[i];
                    popup.life -= dt;
                    popup.y -= 40 * dt;

                    if (popup.life <= 0) {
                        scorePopups.splice(i, 1);
                    }
                }
            }

            // --- draw ---

            function draw() {
                ctx.save();

                applyScreenShake();
                drawBackground();
                drawFloor();
                drawPlatforms();
                drawPlayer();
                drawPlayerDeathMarker();
                drawHarpoons();
                drawBullets();
                drawBallShadows();
                drawBalls();
                drawPops();
                drawScorePopups();
                drawLevelClear();
                drawPowerUps();
                drawHud();
                drawLives();
                drawScreens();

                ctx.restore();

                drawFlash();
                drawFrame();
                drawBorderText();
                drawAudioStatus();
            }

            function drawTopScores(x, y) {
                ctx.textAlign = "center";

                ctx.font = "bold 20px system-ui, sans-serif";
                ctx.fillStyle = "#fde68a";
                ctx.fillText("TOP 3", x, y);

                for (let i = 0; i < 3; i++) {
                    const entry = highScores[i];
                    const yy = y + 30 + i * 24;

                    let color = "#e5e7eb";
                    if (i === 0) color = "#fde68a";
                    else if (i === 1) color = "#d1d5db";
                    else if (i === 2) color = "#fdba74";

                    ctx.font = "bold 16px system-ui, sans-serif";
                    ctx.fillStyle = color;

                    if (entry) {
                        const initials = entry.initials ?? entry.Initials;
                        const points = entry.points ?? entry.Points;
                        ctx.fillText(`${i + 1}. ${initials}  ${points}`, x, yy);
                    } else {
                        ctx.fillText(`${i + 1}. ---  0`, x, yy);
                    }
                }

                ctx.textAlign = "left";
            }

            function drawFullScores(x, y) {
                ctx.textAlign = "center";

                ctx.fillStyle = "#fde68a";
                ctx.font = "bold 30px system-ui, sans-serif";
                ctx.fillText("HIGH SCORES", x, y);

                const startY = y + 40;
                const rankX = x - 220;
                const initialsX = x - 110;
                const scoreX = x + 30;
                const levelX = x + 170;

                ctx.textAlign = "left";
                ctx.font = "bold 16px system-ui, sans-serif";
                ctx.fillStyle = "#93c5fd";
                ctx.fillText("RK", rankX, startY);
                ctx.fillText("NAME", initialsX, startY);
                ctx.fillText("SCORE", scoreX, startY);
                ctx.fillText("LEVEL", levelX, startY);

                for (let i = 0; i < 10; i++) {
                    const entry = highScores[i];
                    const rowY = startY + 30 + i * 24;

                    let color = "#e5e7eb";
                    if (i === 0) color = "#fde68a";
                    else if (i === 1) color = "#d1d5db";
                    else if (i === 2) color = "#fdba74";

                    ctx.fillStyle = "rgba(15, 23, 42, 0.35)";
                    ctx.fillRect(rankX - 12, rowY - 17, 470, 20);

                    ctx.fillStyle = color;
                    ctx.font = "bold 15px system-ui, sans-serif";
                    ctx.fillText(`${i + 1}.`, rankX, rowY);

                    if (entry) {
                        const initials = entry.initials ?? entry.Initials;
                        const points = entry.points ?? entry.Points;
                        const level = entry.level ?? entry.Level;

                        ctx.fillText(initials, initialsX, rowY);
                        ctx.fillText(String(points), scoreX, rowY);
                        ctx.fillText(String(level), levelX, rowY);
                    } else {
                        ctx.fillStyle = "#64748b";
                        ctx.fillText("---", initialsX, rowY);
                        ctx.fillText("0", scoreX, rowY);
                        ctx.fillText("-", levelX, rowY);
                    }
                }

                ctx.textAlign = "left";
            }

            function applyScreenShake() {
                let shakeX = 0;
                let shakeY = 0;

                if (shakeTimer > 0) {
                    shakeX = (Math.random() - 0.5) * 8;
                    shakeY = (Math.random() - 0.5) * 8;
                }

                ctx.translate(shakeX, shakeY);
            }

            function drawBackground() {
                const bg = LEVELS[levelIndex].bg;

                if (bg === "meadow") {
                    ctx.fillStyle = "#38bdf8";
                    ctx.fillRect(0, 0, W, FLOOR_Y);

                    ctx.fillStyle = "#65a30d";
                    ctx.beginPath();
                    ctx.moveTo(0, FLOOR_Y - 90);
                    ctx.quadraticCurveTo(140, FLOOR_Y - 150, 300, FLOOR_Y - 95);
                    ctx.quadraticCurveTo(440, FLOOR_Y - 140, 620, FLOOR_Y - 100);
                    ctx.quadraticCurveTo(760, FLOOR_Y - 130, W, FLOOR_Y - 85);
                    ctx.lineTo(W, FLOOR_Y);
                    ctx.lineTo(0, FLOOR_Y);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = "#84cc16";
                    ctx.fillRect(0, FLOOR_Y - 35, W, 35);
                    return;
                }

                if (bg === "sunset") {
                    const grad = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
                    grad.addColorStop(0, "#f97316");
                    grad.addColorStop(0.45, "#fb7185");
                    grad.addColorStop(1, "#7c3aed");
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, W, FLOOR_Y);

                    ctx.beginPath();
                    ctx.arc(W - 140, 100, 45, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255,255,180,0.75)";
                    ctx.fill();

                    ctx.fillStyle = "#334155";
                    ctx.beginPath();
                    ctx.moveTo(80, FLOOR_Y);
                    ctx.lineTo(260, FLOOR_Y - 180);
                    ctx.lineTo(430, FLOOR_Y);
                    ctx.closePath();
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(320, FLOOR_Y);
                    ctx.lineTo(560, FLOOR_Y - 140);
                    ctx.lineTo(760, FLOOR_Y);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = "#166534";
                    ctx.fillRect(0, FLOOR_Y - 28, W, 28);
                    return;
                }

                if (bg === "night") {
                    const grad = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
                    grad.addColorStop(0, "#020617");
                    grad.addColorStop(1, "#0f172a");
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, W, FLOOR_Y);

                    ctx.beginPath();
                    ctx.arc(W - 120, 90, 30, 0, Math.PI * 2);
                    ctx.fillStyle = "#e2e8f0";
                    ctx.fill();

                    ctx.fillStyle = "rgba(255,255,255,0.8)";
                    for (const [x, y] of BACKGROUND_NIGHT_STARS) {
                        ctx.fillRect(x, y, 2, 2);
                    }

                    ctx.fillStyle = "#1e293b";
                    ctx.fillRect(0, FLOOR_Y - 55, W, 55);

                    ctx.fillStyle = "#0f172a";
                    for (let i = 0; i < W; i += 60) {
                        const h = 20 + (i % 120 === 0 ? 45 : 30);
                        ctx.fillRect(i, FLOOR_Y - h, 36, h);
                    }
                }
            }

            function drawFloor() {
                ctx.fillStyle = "#2563eb";
                ctx.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);

                const brickW = 28;
                const brickH = 10;

                for (let row = 0; row < Math.ceil((H - FLOOR_Y) / brickH); row++) {
                    for (let col = 0; col < Math.ceil(W / brickW) + 1; col++) {
                        const offset = (row % 2) * (brickW / 2);
                        const x = col * brickW - offset;
                        const y = FLOOR_Y + row * brickH;

                        ctx.strokeStyle = "#93c5fd";
                        ctx.lineWidth = 1;
                        ctx.strokeRect(x, y, brickW, brickH);
                    }
                }
            }

            function drawScreens() {
                if (paused && gameState === "playing") {
                    ctx.fillStyle = "rgba(0,0,0,0.45)";
                    ctx.fillRect(0, 0, W, H);

                    ctx.fillStyle = "#ffffff";
                    ctx.textAlign = "center";

                    ctx.font = "bold 56px system-ui, sans-serif";
                    ctx.fillText("PAUSED", W / 2, H / 2);

                    ctx.font = "20px system-ui, sans-serif";
                    ctx.fillText("Press P to Resume", W / 2, H / 2 + 40);

                    ctx.textAlign = "left";
                }

                if (gameState === "startup") {
                    ctx.fillStyle = "rgba(0,0,0,0.45)";
                    ctx.fillRect(0, 0, W, H);

                    ctx.textAlign = "center";

                    ctx.fillStyle = "#fde68a";
                    ctx.font = "bold 76px system-ui, sans-serif";
                    ctx.fillText("PANG", W / 2, 120);

                    ctx.fillStyle = "#ffffff";
                    ctx.font = "20px system-ui, sans-serif";
                    ctx.fillText("Internal Arcade Edition", W / 2, 155);

                    ctx.fillStyle = "#cbd5e1";
                    ctx.font = "24px system-ui, sans-serif";
                    ctx.fillText("Move: A / D or Arrow Keys", W / 2, 210);
                    ctx.fillText("Fire: Space", W / 2, 240);

                    ctx.fillStyle = "#93c5fd";
                    ctx.font = "18px system-ui, sans-serif";

                    if (Math.floor(startupBlinkTimer * 2) % 2 === 0) {
                        ctx.fillStyle = "#ffffff";
                        ctx.font = "bold 28px system-ui, sans-serif";
                        ctx.fillText("PRESS SPACE TO START", W / 2, 320);
                    }

                    drawTopScores(W / 2, 355);

                    ctx.textAlign = "left";
                }

                if (gameState === "gameover") {
                    ctx.fillStyle = "rgba(0,0,0,0.6)";
                    ctx.fillRect(0, 0, W, H);

                    ctx.fillStyle = "#ffffff";
                    ctx.textAlign = "center";

                    ctx.font = "bold 52px system-ui, sans-serif";
                    ctx.fillText("GAME OVER", W / 2, 60);

                    ctx.font = "24px system-ui, sans-serif";
                    ctx.fillText(`Your Score: ${score}`, W / 2, 95);
                    ctx.fillText(`Level Reached: ${levelIndex + 1}`, W / 2, 125);

                    if (enteringScore) {
                        drawInitialsEntry(W / 2, 165);
                    } else {
                        drawFullScores(W / 2, 170);

                        ctx.font = "22px system-ui, sans-serif";
                        ctx.fillStyle = "#ffffff";
                        ctx.fillText("Press Space to Restart", W / 2, H - 28);
                    }

                    ctx.textAlign = "left";
                }
            }

            function drawInitialsEntry(x, y) {
                ctx.textAlign = "center";

                ctx.fillStyle = "#fde68a";
                ctx.font = "bold 28px system-ui, sans-serif";
                ctx.fillText("NEW HIGH SCORE!", x, y);

                ctx.fillStyle = "#cbd5e1";
                ctx.font = "18px system-ui, sans-serif";
                ctx.fillText("Enter Your Initials", x, y + 32);

                const startX = x - 50;
                const boxY = y + 60;
                const boxW = 28;
                const boxH = 36;
                const gap = 18;

                for (let i = 0; i < 3; i++) {
                    const bx = startX + i * (boxW + gap);

                    ctx.fillStyle = i === initialsIndex ? "rgba(253, 230, 138, 0.25)" : "rgba(15, 23, 42, 0.45)";
                    ctx.fillRect(bx, boxY, boxW, boxH);

                    ctx.strokeStyle = i === initialsIndex ? "#fde68a" : "#93c5fd";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(bx, boxY, boxW, boxH);

                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 24px system-ui, sans-serif";
                    ctx.fillText(initials[i], bx + boxW / 2, boxY + 26);
                }

                ctx.fillStyle = "#cbd5e1";
                ctx.font = "16px system-ui, sans-serif";
                ctx.fillText("Type letters  •  Tab moves  •  Enter confirms", x, boxY + 62);

                drawFullScores(W / 2, boxY + 110);

                ctx.textAlign = "left";
            }

            function drawHudHarpoonIcon() {
                ctx.save();
                ctx.scale(0.65, 0.65);

                ctx.strokeStyle = "#d1d5db";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 14);
                ctx.lineTo(0, -8);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, -14);
                ctx.lineTo(-5, -4);
                ctx.lineTo(5, -4);
                ctx.closePath();
                ctx.fillStyle = "#d1d5db";
                ctx.fill();

                ctx.beginPath();
                ctx.arc(0, 2, 4, 0, Math.PI * 2);
                ctx.fillStyle = "#ef4444";
                ctx.fill();

                ctx.restore();
            }

            function drawHudTwinIcon() {
                ctx.save();
                ctx.scale(0.65, 0.65);
                drawTwinPowerUp();
                ctx.restore();
            }

            function drawHudGunIcon() {
                ctx.save();
                ctx.scale(0.65, 0.65);
                drawGunPowerUp();
                ctx.restore();
            }

            function updateStartupState() {
                if (consumeFirePress()) {
                    startGame();
                }
            }

            function drawPlatforms() {
                for (const platform of platforms) {
                    const isSolid = platform.type === "solid";
                    const fill = isSolid ? "#3b82f6" : "#f59e0b";
                    const top = isSolid ? "#93c5fd" : "#fde68a";
                    const edge = isSolid ? "#1d4ed8" : "#b45309";

                    ctx.fillStyle = fill;
                    ctx.fillRect(platform.x, platform.y, platform.w, platform.h);

                    ctx.fillStyle = top;
                    ctx.fillRect(platform.x + 2, platform.y + 2, platform.w - 4, 4);

                    ctx.fillStyle = edge;
                    ctx.fillRect(platform.x + 2, platform.y + platform.h - 5, platform.w - 4, 3);

                    ctx.lineWidth = 3;
                    ctx.strokeStyle = "rgba(255,255,255,0.85)";
                    ctx.strokeRect(platform.x, platform.y, platform.w, platform.h);

                    ctx.strokeStyle = "rgba(255,255,255,0.18)";
                    ctx.lineWidth = 1;
                    for (let x = platform.x + 24; x < platform.x + platform.w; x += 24) {
                        ctx.beginPath();
                        ctx.moveTo(x, platform.y + 3);
                        ctx.lineTo(x, platform.y + platform.h - 3);
                        ctx.stroke();
                    }
                }
            }

            function drawPlayer() {
                if (playerDead) return;

                const px = player.x;
                const py = player.y;
                const scale = 1.5;

                ctx.save();
                ctx.translate(px, py);
                ctx.scale(scale, scale);
                ctx.translate(-px, -py);

                if (!player.moving) {
                    drawIdlePlayer(px, py);
                } else {
                    drawMovingPlayer(px, py);
                }

                ctx.restore();
            }

            function drawIdlePlayer(px, py) {
                ctx.fillStyle = "#d6d3d1";
                ctx.fillRect(px - 8, py + 10, 16, 18);

                ctx.fillStyle = "#f5d0a9";
                ctx.beginPath();
                ctx.arc(px, py + 6, 7, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#2563eb";
                ctx.fillRect(px - 8, py - 1, 16, 5);

                ctx.fillStyle = "#fbbf24";
                ctx.fillRect(px - 7, py + 28, 6, 4);
                ctx.fillRect(px + 1, py + 28, 6, 4);

                ctx.strokeStyle = "#111827";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(px - 3, py + 14);
                ctx.lineTo(px - 3, py + 24);
                ctx.moveTo(px + 3, py + 14);
                ctx.lineTo(px + 3, py + 24);
                ctx.stroke();
            }

            function drawMovingPlayer(px, py) {
                const facing = player.facing;

                ctx.fillStyle = "#d6d3d1";
                ctx.fillRect(px - 7, py + 10, 14, 18);

                ctx.fillStyle = "#f5d0a9";
                ctx.beginPath();
                ctx.arc(px, py + 6, 7, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#2563eb";
                ctx.fillRect(px - 8, py - 1, 16, 5);

                ctx.fillStyle = "#fbbf24";
                ctx.fillRect(px - 6, py + 28, 6, 4);
                ctx.fillRect(px + 1, py + 28, 6, 4);

                ctx.fillStyle = "#f5d0a9";
                if (facing === 1) {
                    ctx.fillRect(px + 5, py + 5, 3, 2);
                } else {
                    ctx.fillRect(px - 8, py + 5, 3, 2);
                }

                ctx.strokeStyle = "#e5e7eb";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(px, py + 16);
                ctx.lineTo(px + (facing * 12), py + 14);
                ctx.stroke();
            }

            function drawPlayerDeathMarker() {
                if (!playerDead) return;

                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(player.x - 12, player.y + 4);
                ctx.lineTo(player.x + 12, player.y + 28);
                ctx.moveTo(player.x + 12, player.y + 4);
                ctx.lineTo(player.x - 12, player.y + 28);
                ctx.stroke();
            }

            function drawHarpoons() {
                for (const harpoon of harpoons) {
                    ctx.strokeStyle = "#d1d5db";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(harpoon.x, harpoon.yBottom);

                    for (let y = harpoon.yBottom; y >= harpoon.yTop; y -= 8) {
                        const offset = Math.sin((harpoon.yBottom - y) * 0.18) * 3;
                        ctx.lineTo(harpoon.x + offset, y);
                    }

                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(harpoon.x, harpoon.yTop - 6);
                    ctx.lineTo(harpoon.x - 5, harpoon.yTop + 4);
                    ctx.lineTo(harpoon.x + 5, harpoon.yTop + 4);
                    ctx.closePath();
                    ctx.fillStyle = "#d1d5db";
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(harpoon.x, harpoon.yTop + 10, 4, 0, Math.PI * 2);
                    ctx.fillStyle = "#ef4444";
                    ctx.fill();
                }
            }

            function drawBullets() {
                for (const bullet of bullets) {
                    ctx.fillStyle = "#fde68a";
                    ctx.fillRect(bullet.x - 2, bullet.y - 10, 4, 12);

                    ctx.fillStyle = "#fff7ed";
                    ctx.fillRect(bullet.x - 1, bullet.y - 14, 2, 4);
                }
            }

            function drawBallShadows() {
                for (const ball of balls) {
                    const groundDist = FLOOR_Y - (ball.y + ball.r);
                    const t = Math.max(0, Math.min(1, 1 - groundDist / 260));

                    const shadowW = ball.r * (0.55 + t * 0.45);
                    const shadowH = ball.r * 0.18 * (0.4 + t * 0.6);
                    const alpha = 0.06 + t * 0.16;

                    ctx.beginPath();
                    ctx.ellipse(ball.x, FLOOR_Y - 4, shadowW, shadowH, 0, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0,0,0,${alpha})`;
                    ctx.fill();
                }
            }

            function drawBalls() {
                for (const ball of balls) {
                    const stretch = Math.max(0, -ball.vy * 0.0008);
                    const squashX = 1 + ball.squash * 0.18 - stretch * 0.15;
                    const squashY = 1 - ball.squash * 0.18 + stretch * 0.3;

                    ctx.save();
                    ctx.translate(ball.x, ball.y);
                    ctx.scale(squashX, squashY);

                    ctx.shadowBlur = 32;
                    ctx.shadowColor = "rgba(255, 170, 230, 0.45)";
                    ctx.beginPath();
                    ctx.arc(0, 0, ball.r, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(244, 114, 182, 0.20)";
                    ctx.fill();

                    if (freezeTimer > 0 && shouldShowFrozenOverlay()) {
                        ctx.beginPath();
                        ctx.arc(0, 0, ball.r, 0, Math.PI * 2);
                        ctx.fillStyle = "rgba(180, 240, 255, 0.22)";
                        ctx.fill();
                    }

                    ctx.shadowBlur = 0;

                    ctx.lineWidth = 4 / Math.max(squashX, squashY);
                    ctx.strokeStyle = "rgba(244, 180, 220, 0.95)";
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(0, 0, ball.r - 4, 0, Math.PI * 2);
                    ctx.lineWidth = 1.5 / Math.max(squashX, squashY);
                    ctx.strokeStyle = "rgba(255, 220, 240, 0.35)";
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(-ball.r * 0.28, -ball.r * 0.28, ball.r * 0.18, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
                    ctx.fill();

                    ctx.restore();
                }
            }

            function shouldShowFrozenOverlay() {
                if (freezeTimer >= 2) return true;
                return Math.floor(freezeTimer * 10) % 2 === 0;
            }

            function drawPops() {
                for (const pop of pops) {
                    const t = pop.life / (pop.spark ? 0.22 : POP_DURATION);

                    if (pop.spark) {
                        ctx.beginPath();
                        ctx.arc(pop.x, pop.y, pop.r + (1 - t) * 1.5, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255,240,180,${t})`;
                        ctx.fill();
                    } else {
                        const rr = pop.r * (1.2 - t * 0.4);

                        ctx.beginPath();
                        ctx.arc(pop.x, pop.y, rr, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(255,255,255,${t})`;
                        ctx.lineWidth = 3;
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(pop.x, pop.y, rr * 0.6, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(255,200,220,${t * 0.8})`;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                }
            }

            function drawScorePopups() {
                for (const popup of scorePopups) {
                    ctx.fillStyle = `rgba(255,255,180,${popup.life})`;
                    ctx.font = "bold 18px system-ui, sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText(popup.value, popup.x, popup.y);
                }
                ctx.textAlign = "left";
            }

            function drawLevelClear() {
                if (!levelClear) return;

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 48px system-ui, sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("LEVEL CLEAR", W / 2, H / 2);

                ctx.fillStyle = "#fde68a";
                ctx.font = "bold 24px system-ui, sans-serif";
                ctx.fillText(`TIME BONUS ${Math.ceil(timeLeft) * 10}`, W / 2, H / 2 + 40);

                ctx.textAlign = "left";
            }

            function drawPowerUps() {
                for (const powerUp of powerUps) {
                    if (powerUp.life < 3) {
                        const blinkOn = Math.floor(powerUp.life * 8) % 2 === 0;
                        if (!blinkOn) continue;
                    }

                    ctx.save();
                    ctx.translate(powerUp.x, powerUp.y + Math.sin(powerUp.anim || 0) * 2);

                    if (powerUp.type === "twin") {
                        drawTwinPowerUp();
                    } else if (powerUp.type === "gun") {
                        drawGunPowerUp();
                    } else if (powerUp.type === "freeze") {
                        drawFreezePowerUp();
                    } else if (powerUp.type === "bomb") {
                        drawBombPowerUp();
                    }

                    ctx.restore();
                }

                ctx.textAlign = "left";
            }

            function drawTwinPowerUp() {
                ctx.save();

                ctx.strokeStyle = "#d1d5db";
                ctx.lineWidth = 3;

                // left cable
                ctx.beginPath();
                ctx.moveTo(-10, 14);
                ctx.lineTo(-10, -8);
                ctx.stroke();

                // left tip
                ctx.beginPath();
                ctx.moveTo(-10, -14);
                ctx.lineTo(-15, -4);
                ctx.lineTo(-5, -4);
                ctx.closePath();
                ctx.fillStyle = "#d1d5db";
                ctx.fill();

                // left red node
                ctx.beginPath();
                ctx.arc(-10, 2, 4, 0, Math.PI * 2);
                ctx.fillStyle = "#ef4444";
                ctx.fill();

                // right cable
                ctx.beginPath();
                ctx.moveTo(10, 14);
                ctx.lineTo(10, -8);
                ctx.stroke();

                // right tip
                ctx.beginPath();
                ctx.moveTo(10, -14);
                ctx.lineTo(5, -4);
                ctx.lineTo(15, -4);
                ctx.closePath();
                ctx.fillStyle = "#d1d5db";
                ctx.fill();

                // right red node
                ctx.beginPath();
                ctx.arc(10, 2, 4, 0, Math.PI * 2);
                ctx.fillStyle = "#ef4444";
                ctx.fill();

                ctx.restore();
            }

            function drawGunPowerUp() {
                ctx.save();

                // central turret body
                ctx.fillStyle = "#ea580c";
                ctx.fillRect(-8, -4, 16, 12);

                // twin barrels
                ctx.fillStyle = "#fde68a";
                ctx.fillRect(-16, -2, 8, 3);
                ctx.fillRect(-16, 3, 8, 3);

                // barrel ends
                ctx.fillStyle = "#fff7ed";
                ctx.fillRect(-17, -2, 2, 3);
                ctx.fillRect(-17, 3, 2, 3);

                // base / mount
                ctx.fillStyle = "#9a3412";
                ctx.fillRect(-4, 8, 8, 6);

                // top highlight
                ctx.fillStyle = "#fdba74";
                ctx.fillRect(-6, -2, 10, 3);

                // outline
                ctx.strokeStyle = "rgba(255,255,255,0.9)";
                ctx.lineWidth = 2;
                ctx.strokeRect(-8, -4, 16, 12);
                ctx.strokeRect(-16, -2, 8, 3);
                ctx.strokeRect(-16, 3, 8, 3);
                ctx.strokeRect(-4, 8, 8, 6);

                ctx.restore();
            }

            function drawFreezePowerUp() {
                ctx.fillStyle = "#67e8f9";
                ctx.beginPath();
                ctx.arc(0, 0, 20, 0, Math.PI * 2);
                ctx.fill();

                ctx.lineWidth = 3;
                ctx.strokeStyle = "rgba(255,255,255,0.95)";
                ctx.stroke();

                ctx.strokeStyle = "#083344";
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, -6);
                ctx.moveTo(0, 0);
                ctx.lineTo(5, 2);
                ctx.stroke();

                ctx.strokeStyle = "#e0f2fe";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-14, 0);
                ctx.lineTo(-18, 0);
                ctx.moveTo(14, 0);
                ctx.lineTo(18, 0);
                ctx.moveTo(0, -14);
                ctx.lineTo(0, -18);
                ctx.moveTo(0, 14);
                ctx.lineTo(0, 18);
                ctx.stroke();
            }

            function drawBombPowerUp() {
                ctx.fillStyle = "#dc2626";
                ctx.fillRect(-24, -16, 48, 32);

                ctx.lineWidth = 3;
                ctx.strokeStyle = "#fecaca";
                ctx.strokeRect(-24, -16, 48, 32);

                ctx.fillStyle = "#991b1b";
                ctx.fillRect(-24, -16, 48, 8);

                ctx.fillStyle = "#fff7ed";
                ctx.font = "bold 14px system-ui, sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("TNT", 0, 5);

                ctx.strokeStyle = "#f59e0b";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(12, -16);
                ctx.quadraticCurveTo(20, -26, 26, -18);
                ctx.stroke();

                ctx.fillStyle = "#fde047";
                ctx.beginPath();
                ctx.arc(26, -18, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            function drawHud() {
                if (gameState !== "playing") return;

                const x = 24;
                const y = 34;
                const gap = 26;
                const labelColor = "#dbeafe";
                const valueColor = "#ffffff";

                ctx.save();

                function row(i, label, value, color = valueColor) {
                    const yy = y + i * gap;

                    ctx.font = "bold 12px system-ui, sans-serif";
                    ctx.fillStyle = labelColor;
                    ctx.fillText(label, x, yy);

                    ctx.font = "bold 16px system-ui, sans-serif";
                    ctx.fillStyle = color;
                    ctx.fillText(value, x + 78, yy);
                }

                row(0, "SCORE", String(score), "#fde047");
                row(1, "LEVEL", LEVELS[levelIndex].name);

                {
                    let timeColor = "#86efac";
                    if (timeLeft <= 20) timeColor = "#fbbf24";
                    if (timeLeft <= 10) timeColor = "#fb7185";
                    row(2, "TIME", String(Math.ceil(timeLeft)), timeColor);
                }

                {
                    const yy = y + gap * 3;

                    ctx.font = "bold 12px system-ui, sans-serif";
                    ctx.fillStyle = labelColor;
                    ctx.fillText("WEAPON", x, yy);

                    const iconX = x + 86;
                    const iconY = yy - 2;

                    ctx.save();
                    ctx.translate(iconX, iconY);

                    if (weaponType === "gun") {
                        drawHudGunIcon();
                    } else if (weaponType === "twinHarpoon") {
                        drawHudTwinIcon();
                    } else {
                        drawHudHarpoonIcon();
                    }

                    ctx.restore();
                }

                if (freezeTimer > 0) {
                    const shouldDraw = freezeTimer >= 2 || Math.floor(freezeTimer * 10) % 2 === 0;
                    if (shouldDraw) {
                        const yy = y + gap * 4.1;

                        ctx.font = "bold 12px system-ui, sans-serif";
                        ctx.fillStyle = labelColor;
                        ctx.fillText("FREEZE", x, yy);

                        ctx.save();
                        ctx.translate(x + 86, yy - 4);
                        ctx.scale(0.45, 0.45);
                        drawFreezePowerUp();
                        ctx.restore();

                        ctx.font = "bold 16px system-ui, sans-serif";
                        ctx.fillStyle = "#67e8f9";
                        ctx.fillText(`${freezeTimer.toFixed(1)}s`, x + 124, yy);
                    }
                }

                ctx.restore();
            }

            function drawLives() {
                if (gameState !== "playing") return;

                const startX = W - 34;
                const y = 26;
                const spacing = 26;
                const scale = 0.75;

                ctx.save();

                for (let i = 0; i < lives; i++) {
                    const px = startX - i * spacing;
                    const py = y;

                    ctx.save();
                    ctx.translate(px, py);
                    ctx.scale(scale, scale);
                    ctx.translate(-px, -py);

                    // body
                    ctx.fillStyle = "#d6d3d1";
                    ctx.fillRect(px - 8, py + 10, 16, 18);

                    // head
                    ctx.fillStyle = "#f5d0a9";
                    ctx.beginPath();
                    ctx.arc(px, py + 6, 7, 0, Math.PI * 2);
                    ctx.fill();

                    // hat
                    ctx.fillStyle = "#2563eb";
                    ctx.fillRect(px - 8, py - 1, 16, 5);

                    // shoes
                    ctx.fillStyle = "#fbbf24";
                    ctx.fillRect(px - 7, py + 28, 6, 4);
                    ctx.fillRect(px + 1, py + 28, 6, 4);

                    // legs
                    ctx.strokeStyle = "#111827";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(px - 3, py + 14);
                    ctx.lineTo(px - 3, py + 24);
                    ctx.moveTo(px + 3, py + 14);
                    ctx.lineTo(px + 3, py + 24);
                    ctx.stroke();

                    ctx.restore();
                }

                if (lives === 0) {
                    ctx.font = "bold 16px system-ui, sans-serif";
                    ctx.fillStyle = "#ffffff";
                    ctx.fillText("0", W - 28, 42);
                }

                ctx.restore();
            }

            function drawAudioStatus() {
                if (gameState !== "playing") return;

                const text = `P Pause   M Music ${musicMuted ? "Off" : "On"}   S SFX ${sfxMuted ? "Off" : "On"}`;

                ctx.save();
                ctx.font = "bold 12px system-ui, sans-serif";
                ctx.textAlign = "left";
                ctx.fillStyle = "#dbeafe";
                ctx.fillText(text, BORDER, H);
                ctx.restore();
            }

            function drawFlash() {
                if (flashTimer <= 0) return;

                const alpha = flashTimer / 0.18;
                ctx.fillStyle = `rgba(255,255,255,${alpha * 0.35})`;
                ctx.fillRect(0, 0, W, H);
            }

            function drawFrame() {
                ctx.lineWidth = BORDER;
                ctx.strokeStyle = "#1d4ed8";
                ctx.strokeRect(BORDER / 2, BORDER / 2, W - BORDER, H - BORDER);

                ctx.lineWidth = 3;
                ctx.strokeStyle = "#93c5fd";
                ctx.strokeRect(BORDER, BORDER, W - BORDER * 2, H - BORDER * 2);
            }

            function drawBorderText() {
                if (gameState !== "startup" && gameState !== "gameover") return;

                ctx.save();
                ctx.textAlign = "center";
                ctx.font = "12px system-ui, sans-serif";
                ctx.fillStyle = "#dbeafe";
                ctx.fillText("© Gelder Arcade Systems", W / 2, H);
                ctx.restore();
            }

            (async () => {
                await loadHighScores();
                requestAnimationFrame(tick);
            })();
        })();
    </script>
</body>

</html>
