<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pang (starter)</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #111;
            color: #ddd;
            font-family: system-ui, sans-serif;
        }

        canvas {
            display: block;
            margin: 0 auto;
            background: #0b0f1a;
        }

        .hint {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 10px;
            text-align: center;
            font-size: 14px;
            opacity: .8;
        }
    </style>
</head>

<body>
    <canvas id="c" width="900" height="520"></canvas>
    <div class="hint">Move: A/D or ←/→ · Fire: Space</div>

    <script>
        (() => {
            const canvas = document.getElementById("c");
            const ctx = canvas.getContext("2d");

            // --- constants ---
            const W = canvas.width, H = canvas.height;
            const FLOOR_Y = H - 40;

            // --- input ---
            const keys = new Set();
            addEventListener("keydown", (e) => {
                if (["ArrowLeft", "ArrowRight", " ", "a", "d", "A", "D"].includes(e.key)) e.preventDefault();
                keys.add(e.key);
            });
            addEventListener("keyup", (e) => keys.delete(e.key));

            // --- entities ---
            const player = {
                w: 34, h: 28,
                x: W * 0.5, y: FLOOR_Y - 48,
                vx: 0,
                speed: 240, // px/s,
                facing: 1,   // 1 = right, -1 = left
                moving: false
            };

            let harpoon = null; // {x, yTop, yBottom, speed}

            const LEVELS = [
                {
                    name: "Meadow",
                    bg: "meadow",
                    balls: [
                        { size: 0, x: 140, y: 100, dir: 1 }
                    ]
                },
                {
                    name: "Sunset",
                    bg: "sunset",
                    balls: [
                        { size: 0, x: 180, y: 100, dir: 1 },
                        { size: 2, x: 520, y: 160, dir: -1 }
                    ]
                },
                {
                    name: "Night",
                    bg: "night",
                    balls: [
                        { size: 1, x: 180, y: 120, dir: 1 },
                        { size: 1, x: 500, y: 120, dir: -1 },
                        { size: 3, x: 340, y: 80, dir: 1 }
                    ]
                }
            ];


            const BALL_SIZES = [60, 40, 25, 15];          // large -> small (radius)
            const BALL_VX = [120, 145, 170, 195];
            const BALL_BOUNCE_VY = [720, 670, 620, 570];
            const GRAVITY = 980;
            const POP_DURATION = 0.28;
            const BORDER = 14;

            const hudX = 28;
            const hudY = 36;
            const hudGap = 22;

            function createBall(size, x, y, dir = 1, vy = 0) {
                return {
                    size,
                    r: BALL_SIZES[size],
                    x, y,
                    vx: BALL_VX[size] * dir,
                    vy,
                    squash: 0
                };
            }

            let balls = [];
            let pops = [];
            let scorePopups = [];

            let score = 0;
            let lives = 3;
            let levelClear = false;
            let levelClearTimer = 0;
            let playerDead = false;
            let deathTimer = 0;
            let levelIndex = 0;
            let timeLeft = 100;

            // --- helpers ---
            function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

            function fireHarpoon() {
                if (harpoon) return;
                harpoon = {
                    x: player.x,
                    yTop: FLOOR_Y,
                    yBottom: FLOOR_Y,
                    maxTop: 0,
                    speed: 900
                };
            }

            function resetLevel() {
                loadLevel(levelIndex);
            }

            function loadLevel(index) {
                const level = LEVELS[index];

                balls = level.balls.map(b => createBall(b.size, b.x, b.y, b.dir));
                harpoon = null;
                player.x = W * 0.5;

                playerDead = false;
                deathTimer = 0;
                levelClear = false;
                levelClearTimer = 0;
                timeLeft = 100;
            }

            function spawnPop(x, y, r) {
                pops.push({
                    x, y,
                    r,
                    life: POP_DURATION
                });
            }

            function spawnScore(x, y, value) {
                scorePopups.push({
                    x,
                    y,
                    value,
                    life: 0.8
                });
            }

            // --- update ---
            let last = performance.now();

            function tick(now) {
                const dt = Math.min(0.033, (now - last) / 1000);
                last = now;

                if (playerDead) {
                    deathTimer -= dt;
                    if (deathTimer <= 0) {
                        if (lives > 0) {
                            resetLevel();
                        }
                    }
                    draw();
                    requestAnimationFrame(tick);
                    return;
                }

                if (!levelClear && !playerDead) {
                    timeLeft -= dt * 3.5;
                    if (timeLeft <= 0) {
                        timeLeft = 0;
                        playerDead = true;
                        deathTimer = 1.0;
                        harpoon = null;
                        lives--;
                    }
                }

                if (balls.length === 0 && !levelClear) {
                    levelClear = true;
                    levelClearTimer = 1.5; // seconds before next level
                }

                if (levelClear) {
                    levelClearTimer -= dt;

                    if (levelClearTimer <= 0) {
                        levelIndex = (levelIndex + 1) % LEVELS.length;
                        loadLevel(levelIndex);
                    }
                }

                // player movement
                let dir = 0;
                if (keys.has("ArrowLeft") || keys.has("a") || keys.has("A")) dir -= 1;
                if (keys.has("ArrowRight") || keys.has("d") || keys.has("D")) dir += 1;

                player.moving = dir !== 0;
                if (dir !== 0) player.facing = dir;
                player.vx = dir * player.speed;
                player.x += player.vx * dt;
                player.x = clamp(player.x, player.w / 2, W - player.w / 2);

                // fire
                if (keys.has(" ")) fireHarpoon();

                for (const b of balls) {
                    b.vy += GRAVITY * dt;
                    b.x += b.vx * dt;
                    b.y += b.vy * dt;
                    b.squash = Math.max(0, b.squash - dt * 8);

                    if (b.x - b.r < 0) { b.x = b.r; b.vx *= -1; }
                    if (b.x + b.r > W) { b.x = W - b.r; b.vx *= -1; }

                    if (b.y + b.r > FLOOR_Y) {
                        b.y = FLOOR_Y - b.r;
                        b.vy = -BALL_BOUNCE_VY[b.size];
                        b.squash = 1;
                    }
                }

                if (!playerDead) {
                    for (const b of balls) {
                        const closestX = Math.max(player.x - 10, Math.min(b.x, player.x + 10));
                        const closestY = Math.max(player.y, Math.min(b.y, player.y + 32));
                        const dx = b.x - closestX;
                        const dy = b.y - closestY;

                        if ((dx * dx + dy * dy) < (b.r * b.r)) {
                            playerDead = true;
                            deathTimer = 1.0;
                            harpoon = null;
                            lives--;
                            break;
                        }
                    }
                }

                // harpoon (move + collide)
                if (harpoon) {
                    harpoon.yTop -= harpoon.speed * dt;

                    if (harpoon.yTop <= harpoon.maxTop) {
                        harpoon.yTop = harpoon.maxTop;
                    }

                    if (harpoon.yTop <= 0) {
                        harpoon = null;
                    } else {
                        for (let i = 0; i < balls.length; i++) {
                            const b = balls[i];
                            const withinX = Math.abs(b.x - harpoon.x) < b.r;
                            const withinY = (b.y + b.r) > harpoon.yTop;

                            if (withinX && withinY) {
                                harpoon = null;
                                score += 100;

                                spawnPop(b.x, b.y, b.r);
                                spawnScore(b.x, b.y, 100);

                                balls.splice(i, 1);

                                const nextSize = b.size + 1;
                                if (nextSize < BALL_SIZES.length) {
                                    const kick = -BALL_BOUNCE_VY[nextSize] * 0.25;
                                    balls.push(createBall(nextSize, b.x - 8, b.y - 4, -1, kick));
                                    balls.push(createBall(nextSize, b.x + 8, b.y - 4, 1, kick));
                                }

                                break;
                            }
                        }
                    }
                }

                for (let i = pops.length - 1; i >= 0; i--) {
                    pops[i].life -= dt;
                    if (pops[i].life <= 0) {
                        pops.splice(i, 1);
                    }
                }

                for (let i = scorePopups.length - 1; i >= 0; i--) {
                    const s = scorePopups[i];
                    s.life -= dt;
                    s.y -= 40 * dt; // float upward

                    if (s.life <= 0) {
                        scorePopups.splice(i, 1);
                    }
                }

                draw();
                requestAnimationFrame(tick);
            }

            function drawBackground() {
                const bg = LEVELS[levelIndex].bg;

                if (bg === "meadow") {
                    // sky
                    ctx.fillStyle = "#38bdf8";
                    ctx.fillRect(0, 0, W, FLOOR_Y);

                    // distant hills
                    ctx.fillStyle = "#65a30d";
                    ctx.beginPath();
                    ctx.moveTo(0, FLOOR_Y - 90);
                    ctx.quadraticCurveTo(140, FLOOR_Y - 150, 300, FLOOR_Y - 95);
                    ctx.quadraticCurveTo(440, FLOOR_Y - 140, 620, FLOOR_Y - 100);
                    ctx.quadraticCurveTo(760, FLOOR_Y - 130, W, FLOOR_Y - 85);
                    ctx.lineTo(W, FLOOR_Y);
                    ctx.lineTo(0, FLOOR_Y);
                    ctx.closePath();
                    ctx.fill();

                    // grass band
                    ctx.fillStyle = "#84cc16";
                    ctx.fillRect(0, FLOOR_Y - 35, W, 35);
                }

                else if (bg === "sunset") {
                    const grad = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
                    grad.addColorStop(0, "#f97316");
                    grad.addColorStop(0.45, "#fb7185");
                    grad.addColorStop(1, "#7c3aed");
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, W, FLOOR_Y);

                    // sun
                    ctx.beginPath();
                    ctx.arc(W - 140, 100, 45, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255,255,180,0.75)";
                    ctx.fill();

                    // mountains
                    ctx.fillStyle = "#334155";
                    ctx.beginPath();
                    ctx.moveTo(80, FLOOR_Y);
                    ctx.lineTo(260, FLOOR_Y - 180);
                    ctx.lineTo(430, FLOOR_Y);
                    ctx.closePath();
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(320, FLOOR_Y);
                    ctx.lineTo(560, FLOOR_Y - 140);
                    ctx.lineTo(760, FLOOR_Y);
                    ctx.closePath();
                    ctx.fill();

                    // ground band
                    ctx.fillStyle = "#166534";
                    ctx.fillRect(0, FLOOR_Y - 28, W, 28);
                }

                else if (bg === "night") {
                    const grad = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
                    grad.addColorStop(0, "#020617");
                    grad.addColorStop(1, "#0f172a");
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, W, FLOOR_Y);

                    // moon
                    ctx.beginPath();
                    ctx.arc(W - 120, 90, 30, 0, Math.PI * 2);
                    ctx.fillStyle = "#e2e8f0";
                    ctx.fill();

                    // stars
                    ctx.fillStyle = "rgba(255,255,255,0.8)";
                    const stars = [
                        [80, 60], [160, 110], [240, 70], [320, 130], [420, 55],
                        [520, 95], [610, 60], [730, 120], [810, 75]
                    ];
                    for (const [x, y] of stars) {
                        ctx.fillRect(x, y, 2, 2);
                    }

                    // city / hills
                    ctx.fillStyle = "#1e293b";
                    ctx.fillRect(0, FLOOR_Y - 55, W, 55);

                    ctx.fillStyle = "#0f172a";
                    for (let i = 0; i < W; i += 60) {
                        const h = 20 + (i % 120 === 0 ? 45 : 30);
                        ctx.fillRect(i, FLOOR_Y - h, 36, h);
                    }
                }
            }

            // --- draw ---
            function draw() {
                drawBackground();

                // floor base
                ctx.fillStyle = "#2563eb";
                ctx.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);

                // brick pattern
                const brickW = 28;
                const brickH = 10;

                for (let row = 0; row < Math.ceil((H - FLOOR_Y) / brickH); row++) {
                    for (let col = 0; col < Math.ceil(W / brickW) + 1; col++) {
                        const offset = (row % 2) * (brickW / 2);
                        const x = col * brickW - offset;
                        const y = FLOOR_Y + row * brickH;

                        ctx.strokeStyle = "#93c5fd";
                        ctx.lineWidth = 1;
                        ctx.strokeRect(x, y, brickW, brickH);
                    }
                }

                // player (larger pang-style boy)
                if (!playerDead) {
                    const px = player.x;
                    const py = player.y;
                    const scale = 1.5;

                    ctx.save();
                    ctx.translate(px, py);
                    ctx.scale(scale, scale);
                    ctx.translate(-px, -py);

                    if (!player.moving) {
                        ctx.fillStyle = "#d6d3d1";
                        ctx.fillRect(px - 8, py + 10, 16, 18);

                        ctx.fillStyle = "#f5d0a9";
                        ctx.beginPath();
                        ctx.arc(px, py + 6, 7, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = "#2563eb";
                        ctx.fillRect(px - 8, py - 1, 16, 5);

                        ctx.fillStyle = "#fbbf24";
                        ctx.fillRect(px - 7, py + 28, 6, 4);
                        ctx.fillRect(px + 1, py + 28, 6, 4);

                        ctx.strokeStyle = "#111827";
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(px - 3, py + 14);
                        ctx.lineTo(px - 3, py + 24);
                        ctx.moveTo(px + 3, py + 14);
                        ctx.lineTo(px + 3, py + 24);
                        ctx.stroke();
                    } else {
                        const f = player.facing;

                        ctx.fillStyle = "#d6d3d1";
                        ctx.fillRect(px - 7, py + 10, 14, 18);

                        ctx.fillStyle = "#f5d0a9";
                        ctx.beginPath();
                        ctx.arc(px, py + 6, 7, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = "#2563eb";
                        ctx.fillRect(px - 8, py - 1, 16, 5);

                        ctx.fillStyle = "#fbbf24";
                        ctx.fillRect(px - 6, py + 28, 6, 4);
                        ctx.fillRect(px + 1, py + 28, 6, 4);

                        // little nose / face direction
                        ctx.fillStyle = "#f5d0a9";
                        if (f === 1) {
                            ctx.fillRect(px + 5, py + 5, 3, 2);
                        } else {
                            ctx.fillRect(px - 8, py + 5, 3, 2);
                        }

                        ctx.strokeStyle = "#e5e7eb";
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(px, py + 16);
                        ctx.lineTo(px + (f * 12), py + 14);
                        ctx.stroke();
                    }

                    ctx.restore();
                }

                if (playerDead) {
                    ctx.strokeStyle = "#ffffff";
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(player.x - 12, player.y + 4);
                    ctx.lineTo(player.x + 12, player.y + 28);
                    ctx.moveTo(player.x + 12, player.y + 4);
                    ctx.lineTo(player.x - 12, player.y + 28);
                    ctx.stroke();
                }

                // harpoon (curly pang-style cable)
                if (harpoon) {
                    ctx.strokeStyle = "#d1d5db";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(harpoon.x, harpoon.yBottom);

                    for (let y = harpoon.yBottom; y >= harpoon.yTop; y -= 8) {
                        const offset = Math.sin((harpoon.yBottom - y) * 0.18) * 3;
                        ctx.lineTo(harpoon.x + offset, y);
                    }

                    ctx.stroke();

                    // arrow head
                    ctx.beginPath();
                    ctx.moveTo(harpoon.x, harpoon.yTop - 6);
                    ctx.lineTo(harpoon.x - 5, harpoon.yTop + 4);
                    ctx.lineTo(harpoon.x + 5, harpoon.yTop + 4);
                    ctx.closePath();
                    ctx.fillStyle = "#d1d5db";
                    ctx.fill();

                    // red bead
                    ctx.beginPath();
                    ctx.arc(harpoon.x, harpoon.yTop + 10, 4, 0, Math.PI * 2);
                    ctx.fillStyle = "#ef4444";
                    ctx.fill();
                }

                // ball shadows
                for (const b of balls) {
                    const groundDist = FLOOR_Y - (b.y + b.r);   // 0 when touching floor
                    const t = Math.max(0, Math.min(1, 1 - groundDist / 260));

                    const shadowW = b.r * (0.55 + t * 0.45);
                    const shadowH = b.r * 0.18 * (0.4 + t * 0.6);
                    const alpha = 0.06 + t * 0.16;

                    ctx.beginPath();
                    ctx.ellipse(b.x, FLOOR_Y - 4, shadowW, shadowH, 0, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0,0,0,${alpha})`;
                    ctx.fill();
                }

                // balls
                for (const b of balls) {
                    const squashX = 1 + b.squash * 0.18;
                    const squashY = 1 - b.squash * 0.18;

                    ctx.save();
                    ctx.translate(b.x, b.y);
                    ctx.scale(squashX, squashY);

                    // fill
                    ctx.beginPath();
                    ctx.arc(0, 0, b.r, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(244, 114, 182, 0.20)";
                    ctx.fill();

                    // outer rim
                    ctx.lineWidth = 4 / Math.max(squashX, squashY);
                    ctx.strokeStyle = "rgba(244, 180, 220, 0.95)";
                    ctx.stroke();

                    // inner rim
                    ctx.beginPath();
                    ctx.arc(0, 0, b.r - 4, 0, Math.PI * 2);
                    ctx.lineWidth = 1.5 / Math.max(squashX, squashY);
                    ctx.strokeStyle = "rgba(255, 220, 240, 0.35)";
                    ctx.stroke();

                    // fixed highlight
                    ctx.beginPath();
                    ctx.arc(-b.r * 0.28, -b.r * 0.28, b.r * 0.18, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
                    ctx.fill();

                    ctx.restore();
                }

                for (const p of pops) {
                    const t = p.life / POP_DURATION;
                    const rr = p.r * (1.2 - t * 0.4);

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, rr, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(255,255,255,${t})`;
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, rr * 0.6, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(255,200,220,${t * 0.8})`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                for (const s of scorePopups) {
                    ctx.fillStyle = `rgba(255,255,180,${s.life})`;
                    ctx.font = "bold 18px system-ui";
                    ctx.textAlign = "center";
                    ctx.fillText(s.value, s.x, s.y);
                }
                ctx.textAlign = "left";

                if (levelClear) {
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 48px system-ui, sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText("LEVEL CLEAR", W / 2, H / 2);
                    ctx.textAlign = "left";
                }

                // HUD
                ctx.fillStyle = "#cbd5e1";
                ctx.font = "16px system-ui, sans-serif";
                ctx.fillText(`Score: ${score}`, hudX, hudY);
                ctx.fillText(`Lives: ${lives}`, hudX, hudY + hudGap);
                ctx.fillText(`Level: ${LEVELS[levelIndex].name}`, hudX, hudY + hudGap * 2);
                ctx.fillText(`Time: ${Math.ceil(timeLeft)}`, hudX, hudY + hudGap * 3);

                // outer frame
                ctx.lineWidth = BORDER;
                ctx.strokeStyle = "#1d4ed8";
                ctx.strokeRect(BORDER / 2, BORDER / 2, W - BORDER, H - BORDER);

                // inner highlight
                ctx.lineWidth = 3;
                ctx.strokeStyle = "#93c5fd";
                ctx.strokeRect(BORDER, BORDER, W - BORDER * 2, H - BORDER * 2);
            }

            loadLevel(levelIndex);
            requestAnimationFrame(tick);
        })();
    </script>
</body>

</html>
